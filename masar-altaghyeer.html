<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>مسار التغيير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a student's project notebook — stepper across the top, one working sheet at a time, the four Design-for-Change phases colour-coded. Light-only, matched to the unit site's palette. */
:root{
  --bg:#F5F6FC; --dot:#DCDFF0; --sheet:#FFFFFF; --ink:#14173A; --muted:#565D8C; --line:#DDE0F0;
  --accent:#6D4BFF; --accent-ink:#FFFFFF; --mark:#FFE16B; --soft:#F1EEFF;
  --feel:#D6336C; --imagine:#D97706; --do:#0E9F76; --share:#0E86C4;
  --ok:#0E9F76; --warn:#B45309;
  --paper:#FFFFFF; --paper-ink:#1A1A1A; --paper-line:#C9CFD9; --paper-head:#EEF2F8;
  --f-display:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  --f-doc:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  --r:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:light}
/* embedded inside the program page */
html.embed body{background:transparent;background-image:none}
html.embed .top{position:static;background:transparent;border-bottom:0}
html.embed .brand>div:first-child{display:none}
html.embed .brand{justify-content:flex-start}
html.embed .wrap{padding-block:0 8px}
html.embed .sheet{margin-top:12px}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;direction:rtl}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* header + stepper */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;line-height:1.3;letter-spacing:0}
.brand h1 b{background:linear-gradient(transparent 58%,var(--mark) 58%);padding-inline:2px}
.brand small{color:var(--muted);font-size:12.5px;display:block}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:8px}
.st{flex:1 0 auto;min-width:86px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;border-top:4px solid var(--line);padding:6px 4px 2px;cursor:pointer;text-align:right;color:var(--muted)}
.st .n{font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.st .t{font-size:13.5px;font-weight:500;white-space:nowrap}
.st.done{border-top-color:var(--c,var(--accent));color:var(--ink)}
.st.on{border-top-color:var(--c,var(--accent));color:var(--ink)}
.st.on .t{font-weight:600}
.st.on::after{content:"";display:block;width:100%;height:2px;background:var(--c,var(--accent));opacity:.35;margin-top:2px}
.st[disabled]{cursor:not-allowed;opacity:.55}

/* sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(16px,4vw,40px);margin-top:20px}
.eyebrow{font-size:12.5px;letter-spacing:.4px;color:var(--c,var(--muted));font-weight:600}
h2.title{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,30px);line-height:1.35;margin:4px 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:68ch}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chip.k{background:none}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:2px;text-align:right;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt b{font-weight:600;font-size:15.5px}
.opt span{color:var(--muted);font-size:13px;line-height:1.6}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.sel::before{content:"✓";position:absolute;left:12px;top:10px;font-weight:700;color:var(--accent)}
.opt.rec{border-style:dashed;border-color:var(--accent)}
.opt .tag{align-self:flex-start;font-size:11px;padding:0 8px;border-radius:99px;background:var(--mark);color:var(--ink);margin-bottom:4px}
.qcount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:9px;border:1.5px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}

/* ideas */
.ideas-head{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-size:12.5px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer}
.fbtn.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ilist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--sheet);text-align:right;width:100%;min-width:0}
.idea:hover{border-color:var(--accent)}
.idea.sel{border-color:var(--accent);background:var(--soft)}
.idea .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:22px;padding-top:3px}
.idea .tx{flex:1;min-width:0}
.idea .tx b{display:block;font-weight:500;font-size:14.5px;line-height:1.6}
.idea .ty{font-size:11.5px;color:var(--muted)}
.own{margin-top:18px;padding:16px;border:1.5px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:8px}

/* form fields */
.phase-intro{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 16px;border-radius:10px;background:var(--soft);margin-bottom:22px}
.phase-badge{font-family:var(--f-display);font-size:22px;color:var(--sheet);background:var(--c);border-radius:10px;padding:6px 14px;line-height:1.4;text-align:center}
.phase-badge small{display:block;font-family:var(--f-body);font-size:11px;opacity:.9}
.phase-intro p{margin:0;font-size:14px;min-width:0}
.fields{display:flex;flex-direction:column;gap:22px}
.grp{font-weight:700;font-size:17px;color:var(--c,var(--accent));padding-bottom:6px;border-bottom:1.5px solid var(--line);margin-top:10px}
.grp:first-child{margin-top:0}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;border:1.5px dashed var(--c,var(--accent));margin-bottom:22px;font-size:14.5px;font-weight:500}
.tip b{color:var(--c,var(--accent));white-space:nowrap}
.ready{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
.ready strong{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.ready span{color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-weight:600;font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.field .fnum{font-variant-numeric:tabular-nums;color:var(--c,var(--muted));font-size:13px;font-weight:600}
.field .req{font-size:11px;color:var(--muted);font-weight:400}
.hint{font-size:13px;color:var(--muted);margin:0;max-width:72ch}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--sheet);line-height:1.7;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none}
.inp::placeholder{color:var(--muted);opacity:.7}
.lrow{display:flex;gap:6px;align-items:center}
.lrow .bul{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:20px;text-align:center}
.lrow .inp{flex:1;min-width:0}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:6px 8px;border-radius:6px}
.x:hover{color:var(--feel);background:var(--soft)}
.add{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.add:hover{color:var(--ink);border-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;min-width:420px}
.tbl th{font-size:12.5px;font-weight:600;text-align:right;padding:6px 6px;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl td{padding:4px 3px;vertical-align:top}
.tbl td .inp{padding:7px 9px}
.fixed{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.fixed span{font-size:13.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1.5px solid var(--line);border-radius:99px;cursor:pointer;font-size:13.5px}
.ck input{accent-color:var(--accent)}
.ck:has(input:checked){border-color:var(--accent);background:var(--soft)}
.radios{display:flex;flex-direction:column;gap:8px}
.rd{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.rd input{margin-top:6px;accent-color:var(--accent)}
.rd:has(input:checked){border-color:var(--accent);background:var(--soft)}
.rd b{font-weight:600}
.rd span{display:block;font-size:13px;color:var(--muted)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.imgc{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--sheet)}
.imgc img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.imgc .inp{border:0;border-top:1px solid var(--line);border-radius:0;font-size:13px}
.imgc .x{align-self:flex-end}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer}
.drop:hover{border-color:var(--accent);color:var(--ink)}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .3s}
.saved{font-size:12px;color:var(--muted)}

/* final */
.final-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;border-top:4px solid var(--c)}
.pcard b{font-family:var(--f-display);font-size:17px}
.pcard .big{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.missing{margin:0 0 18px;padding:12px 16px;border-radius:10px;background:var(--soft);font-size:13.5px}
.missing ul{margin:6px 0 0;padding-inline-start:20px}
.missing a{color:var(--accent);cursor:pointer;text-decoration:underline}
.exports{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.status{font-size:13px;color:var(--muted);min-height:1.5em}
.status.err{color:var(--feel)}
.status.ok{color:var(--ok)}
.preview{overflow-x:auto;background:var(--soft);border-radius:10px;padding:16px;border:1px solid var(--line)}

/* report (always light paper) */
.rep{width:720px;margin:0 auto;background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);font-size:15px;line-height:1.95;direction:rtl;padding:36px 40px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rep .cover{text-align:center;padding:40px 0 30px;border-bottom:3px double var(--paper-line);margin-bottom:20px;page-break-after:always;break-after:page}
.rep .cover .kind{font-family:var(--f-body);font-size:13px;letter-spacing:.3px;color:#555}
.rep .cover h1{font-family:var(--f-display);font-size:30px;line-height:1.5;margin:18px 0 10px;color:#1F3A8A}
.rep .cover .path{font-family:var(--f-body);font-size:12.5px;color:#555;margin-bottom:30px}
.rep .cover table{margin:0 auto;border-collapse:collapse;font-size:14.5px;min-width:60%}
.rep .cover td{padding:6px 12px;border-bottom:1px solid var(--paper-line);text-align:right}
.rep .cover td:first-child{font-weight:700;color:#333;white-space:nowrap}
.rep h1.rh{font-family:var(--f-display);font-size:22px;color:#1F3A8A;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--paper-line);break-after:avoid}
.rep h1.rh small{font-family:var(--f-body);font-size:13px;color:#666;font-weight:400}
.rep h2{font-size:17px;margin:16px 0 4px;color:#222;break-after:avoid}
.rep p{margin:0 0 8px;white-space:pre-wrap}
.rep ul,.rep ol{margin:0 0 8px;padding-inline-start:26px}
.rep table.rt{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:14px}
.rep table.rt th,.rep table.rt td{border:1px solid var(--paper-line);padding:5px 8px;text-align:right;vertical-align:top}
.rep table.rt th{background:var(--paper-head)}
.rep tr{break-inside:avoid}
.rep figure{margin:8px 0 12px;text-align:center;break-inside:avoid}
.rep figure img{max-width:80%;max-height:320px;border:1px solid var(--paper-line)}
.rep figcaption{font-size:13px;color:#555}

.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;padding:8px 12px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){
  .sheet{padding:20px 16px}
  .phase-intro{grid-template-columns:1fr}
  .phase-badge{justify-self:start}
  .fixed{grid-template-columns:1fr}
  .brand h1{font-size:21px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div>
        <h1><b>مسار</b> التغيير</h1>
        <small>وحدة مهارات القرن ٢١ · دليلك لبناء مشروع «التصميم من أجل التغيير» خطوة بخطوة</small>
      </div>
      <div class="tools">
        <span class="saved" id="savedNote" aria-live="polite"></span>
        <button class="btn sm ghost" id="bkSave" type="button">نسخة احتياطية</button>
        <button class="btn sm ghost" id="bkLoad" type="button">استعادة</button>
        <button class="btn sm ghost" id="resetBtn" type="button">بدء من جديد</button>
        <input type="file" id="bkFile" accept=".json,application/json" class="sr">
      </div>
    </div>
    <div id="confirmBox" hidden></div>
    <nav class="steps" id="steps" aria-label="مراحل المشروع"></nav>
  </div>
</header>

<main class="wrap"><section class="sheet" id="main" aria-live="polite"></section></main>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
let EMBED=false;try{EMBED=new URLSearchParams(location.search).has("embed")}catch(e){}
if(EMBED){document.documentElement.classList.add("embed");
  const post=()=>{try{parent.postMessage({type:"masar-h",h:Math.ceil(document.body.offsetHeight)+4},"*")}catch(e){}};
  try{new ResizeObserver(post).observe(document.body)}catch(e){setInterval(post,800)}
  window.addEventListener("load",post);}
/* ============ DATA: interests → domains → subfields → issues ============ */
const INTERESTS=[
 {id:"nature",t:"الطبيعة والنباتات والحيوانات",d:["env","animals"]},
 {id:"tech",t:"التقنية والبرمجة والألعاب",d:["digital","learning"]},
 {id:"help",t:"مساعدة الناس والتطوع",d:["social","relations"]},
 {id:"sport",t:"الرياضة والحركة والطبخ",d:["health","env"]},
 {id:"art",t:"الرسم والتصميم والتصوير والتراث",d:["identity","relations"]},
 {id:"read",t:"القراءة والكتابة والإلقاء",d:["learning","identity"]},
 {id:"sci",t:"التجارب العلمية والاختراع",d:["env","digital","animals"]},
 {id:"biz",t:"البيع والتخطيط وإدارة المال",d:["money","social"]},
 {id:"people",t:"فهم المشاعر والعلاقات",d:["relations","health"]}
];
const DOMAINS=[
{id:"env",t:"البيئة والاستدامة",s:"الماء والطاقة والنفايات والطعام",subs:[
 {id:"water",t:"المياه",i:[["هدر المياه","r"],["تسرب المياه من الصنابير","r"],["ترشيد استهلاك المياه","b"],["إعادة استخدام مياه الوضوء في ري النباتات","b"],["شرب كمية كافية من الماء يومياً","b"],["رمي العبوات البلاستيكية للمياه","r"],["الوعي بندرة المياه في المملكة","b"],["هدر المياه أثناء غسل الأيدي","r"],["نظافة برادات المياه","b"]],x:["تصميم مؤشر بصري يوضح استهلاك المياه في دورات المياه","نظام تذكير ذكي بإغلاق الصنابير المفتوحة","اكتشاف تسرب المياه مبكراً في مرافق المدرسة","حملة لقياس استهلاك المياه اليومي في المدرسة","إعادة استخدام المياه الرمادية بطريقة آمنة في ري النباتات"]},

/* ============ IDEA GENERATOR ============ */
function ideas(){
  const s=sub(),au=aud(),pr=appr(); if(!s||!au||!pr)return[];
  const others=APPR.filter(a=>a.id!==pr.id);
  const out=(s.x||[]).map(t=>({title:t,ap:"cu",apt:"فكرة مختارة"}));
  s.i.forEach(([t,v],k)=>{
    const picks=S.more?[pr,...others]:[pr,others[k%4],others[(k+1)%4]];
    picks.forEach((a,j)=>{
      const tp=a.tp[(k+j)%2];
      const title=tp.replace("{v}",VERB[v]).replace("{i}",t).replace("{c}",au.c).replace(/\s+/g," ").trim();
      out.push({title,ap:a.id,apt:a.t,issue:t});
    });
  });
  return out;
}

/* ============ FIELDS ============ */
function fieldVal(f){return S.a[f.id]}
function isFilled(f){const v=fieldVal(f);if(v==null)return false;
  if(typeof v==="string")return v.trim()!=="";
  if(f.ty==="table")return v.some(r=>r.some(c=>(c||"").trim()));
  if(f.ty==="fixed")return Object.values(v).some(x=>(x||"").trim());
  if(f.ty==="images")return v.length>0;
  if(Array.isArray(v))return v.some(x=>(x||"").trim());
  return false;}
function phaseFill(p){return[p.f.filter(isFilled).length,p.f.length]}

function fieldHTML(f,num){
  const v=fieldVal(f),id=f.id;
  const head=`<${["area","text","select"].includes(f.ty)?`label for="${id}"`:"div class=\"lab\""}>${num?`<span class="fnum">${num}</span>`:""}${esc(f.t)}${f.req?'<span class="req">أساسي</span>':""}</${["area","text","select"].includes(f.ty)?"label":"div"}>${f.h?`<p class="hint">${esc(f.h)}</p>`:""}`;
  let body="";
  if(f.ty==="text")body=`<input class="inp" id="${id}" data-f="${id}" value="${esc(v||"")}" placeholder="${esc(f.p||"")}">`;
  else if(f.ty==="area")body=`<textarea class="inp" id="${id}" data-f="${id}" rows="${f.rows||4}" placeholder="${esc(f.p||"")}">${esc(v||"")}</textarea>`;
  else if(f.ty==="select")body=`<select class="inp" id="${id}" data-f="${id}"><option value="">اختر...</option>${f.o.map(o=>`<option${v===o?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.ty==="list"){const arr=(v&&v.length)?v:Array(f.min||2).fill("");
    body=`<div class="fields" style="gap:6px" data-list="${id}">${arr.map((x,i)=>`<div class="lrow"><span class="bul">${AR(i+1)}</span><input class="inp" aria-label="${esc(f.t)} ${i+1}" data-li="${id}" data-i="${i}" value="${esc(x)}" placeholder="${i===0?esc(f.p||""):""}"><button type="button" class="x" data-del="${id}" data-i="${i}" aria-label="حذف">×</button></div>`).join("")}<button type="button" class="add" data-addl="${id}">+ إضافة</button></div>`;}
  else if(f.ty==="table"){const rows=(v&&v.length)?v:Array.from({length:f.min||2},()=>Array(f.cols.length).fill(""));
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr>${f.cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${f.cols.map((c,j)=>`<td><input class="inp" aria-label="${esc(c)} ${i+1}" data-td="${id}" data-i="${i}" data-j="${j}" value="${esc(r[j]||"")}" placeholder="${i===0&&f.ps?esc(f.ps[j]||""):""}"></td>`).join("")}<td><button type="button" class="x" data-delr="${id}" data-i="${i}" aria-label="حذف الصف">×</button></td></tr>`).join("")}</tbody></table></div><button type="button" class="add" data-addr="${id}">+ إضافة صف</button>`;}
  else if(f.ty==="fixed"){const o=v||{};body=`<div class="fixed">${f.keys.map((k,i)=>`<span>${esc(k)}</span><input class="inp" aria-label="${esc(k)}" data-fx="${id}" data-k="${esc(k)}" value="${esc(o[k]||"")}" placeholder="${esc(f.ps?.[i]||"")}">`).join("")}</div>`;}
  else if(f.ty==="checks"){const a=v||[];body=`<div class="checks">${f.o.map(o=>`<label class="ck"><input type="checkbox" data-ck="${id}" value="${esc(o)}" ${a.includes(o)?"checked":""}>${esc(o)}</label>`).join("")}</div>`;}
  else if(f.ty==="radio"){body=`<div class="radios" role="radiogroup">${f.o.map(([t,d])=>`<label class="rd"><input type="radio" name="${id}" data-rd="${id}" value="${esc(t)}" ${v===t?"checked":""}><div><b>${esc(t)}</b><span>${esc(d)}</span></div></label>`).join("")}</div>`;}
  else if(f.ty==="images"){const a=v||[];body=`<div class="imgs">${a.map((im,i)=>`<div class="imgc"><button type="button" class="x" data-delimg="${id}" data-i="${i}" aria-label="حذف الصورة">×</button><img src="${im.src}" alt="${esc(im.cap||"صورة")}"><input class="inp" placeholder="وصف الصورة" aria-label="وصف الصورة ${i+1}" data-cap="${id}" data-i="${i}" value="${esc(im.cap||"")}"></div>`).join("")}</div>${a.length<6?`<label class="drop" for="${id}_file">اضغط لاختيار صور (${AR(6-a.length)} متبقية)</label><input type="file" class="sr" id="${id}_file" accept="image/*" multiple data-imgs="${id}">`:""}`;}
  return `<div class="field" data-field="${id}">${head}${body}</div>`;
}
function allFields(){return[...COVER,...PHASES.flatMap(p=>p.f)]}
function F(id){return allFields().find(f=>f.id===id)}

let curChange=null;
function bindFields(root,onChange){
  curChange=onChange||null;
  if(root.__bound)return;root.__bound=true;
  const ch=()=>{save();curChange&&curChange()};
  root.addEventListener("input",e=>{const t=e.target,d=t.dataset;
    if(d.f){S.a[d.f]=t.value;ch()}
    else if(d.li){const f=F(d.li);const arr=readList(root,d.li);S.a[d.li]=arr;ch()}
    else if(d.td){S.a[d.td]=readTable(root,d.td);ch()}
    else if(d.fx){const o=Object.assign({},S.a[d.fx]||{});o[d.k]=t.value;S.a[d.fx]=o;ch()}
    else if(d.cap){S.a[d.cap][+d.i].cap=t.value;ch()}
  });
  root.addEventListener("change",e=>{const t=e.target,d=t.dataset;
    if(d.f&&t.tagName==="SELECT"){S.a[d.f]=t.value;ch()}
    if(d.ck){S.a[d.ck]=[...root.querySelectorAll(`[data-ck="${d.ck}"]:checked`)].map(x=>x.value);ch()}
    if(d.rd){S.a[d.rd]=t.value;ch()}
    if(d.imgs){addImages(d.imgs,t.files).then(()=>{rerenderField(root,d.imgs,curChange);ch()})}
  });
  root.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
    if(d.addl){S.a[d.addl]=[...readList(root,d.addl),""];rerenderField(root,d.addl,curChange,true);ch()}
    else if(d.del){const a=readList(root,d.del);a.splice(+d.i,1);S.a[d.del]=a.length?a:[""];rerenderField(root,d.del,curChange);ch()}
    else if(d.addr){const f=F(d.addr);S.a[d.addr]=[...readTable(root,d.addr),Array(f.cols.length).fill("")];rerenderField(root,d.addr,curChange,true);ch()}
    else if(d.delr){const a=readTable(root,d.delr);a.splice(+d.i,1);S.a[d.delr]=a;rerenderField(root,d.delr,curChange);ch()}
    else if(d.delimg){S.a[d.delimg].splice(+d.i,1);rerenderField(root,d.delimg,curChange);ch()}
  });
}
function readList(root,id){return[...root.querySelectorAll(`[data-li="${id}"]`)].map(x=>x.value)}
function readTable(root,id){const rows=[];root.querySelectorAll(`[data-td="${id}"]`).forEach(x=>{const i=+x.dataset.i,j=+x.dataset.j;(rows[i]=rows[i]||[])[j]=x.value});return rows.filter(Boolean)}
function rerenderField(root,id,onChange,focusLast){
  const el=root.querySelector(`[data-field="${id}"]`);const num=el.querySelector(".fnum")?.textContent||"";
  const tmp=document.createElement("div");tmp.innerHTML=fieldHTML(F(id),num);el.replaceWith(tmp.firstElementChild);
  if(focusLast){const ins=root.querySelectorAll(`[data-field="${id}"] input`);const last=ins[ins.length-1];if(last){const row=last.closest("tr");(row?row.querySelector("input"):last).focus();}}
  onChange&&onChange();
}
function addImages(id,files){
  const cur=S.a[id]||(S.a[id]=[]);
  const list=[...files].slice(0,6-cur.length);
  return Promise.all(list.map(file=>new Promise(res=>{
    const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1100,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      cur.push({src:c.toDataURL("image/jpeg",0.72),w:c.width,h:c.height,cap:""});res();};img.onerror=res;img.src=r.result};r.onerror=res;r.readAsDataURL(file);})));
}

/* ============ REPORT MODEL ============ */
function model(){
  const B=[];const v=id=>S.a[id];
  const clean=a=>(a||[]).map(x=>(x||"").trim()).filter(Boolean);
  const coverRows=[["عنوان المشروع",S.title],["اسم الفريق",v("c_team")],["أعضاء الفريق",clean(v("c_members")).join("، ")],["الصف",v("c_grade")],["المدرسة",v("c_school")],["إشراف",v("c_teacher")],["الفصل الدراسي",v("c_term")]].filter(r=>(r[1]||"").trim()&&r[0]!=="عنوان المشروع");
  const path=[dom()?.t,sub()?.t,aud()?.t,appr()?.t].filter(Boolean).join(" ‹ ");
  B.push({k:"cover",title:S.title||"عنوان المشروع",path,rows:coverRows});
  if((v("s_abstract")||"").trim())B.push({k:"h1",t:"ملخص المشروع"},{k:"p",t:v("s_abstract").trim()});
  PHASES.forEach((p,pi)=>{
    const items=[];
    p.f.forEach((f,fi)=>{if(f.id==="s_abstract"||!isFilled(f))return;
      const val=v(f.id),num=`${pi+1}.${fi+1}`;const h={k:"h2",t:`${AR(num)} ${f.t}`};
      if(f.ty==="area"||f.ty==="text")items.push(h,{k:"p",t:val.trim()});
      else if(f.ty==="list")items.push(h,{k:f.id==="s_refs"?"ol":"ol",items:clean(val)});
      else if(f.ty==="table"){const rows=val.filter(r=>r.some(c=>(c||"").trim()));items.push(h,{k:"table",head:f.cols,rows:rows.map(r=>f.cols.map((_,j)=>(r[j]||"").trim()))})}
      else if(f.ty==="fixed")items.push(h,{k:"table",head:["الحد","الوصف"],rows:f.keys.filter(k=>(val[k]||"").trim()).map(k=>[k,val[k].trim()])});
      else if(f.ty==="checks")items.push(h,{k:"p",t:val.join("، ")});
      else if(f.ty==="radio"){const o=f.o.find(x=>x[0]===val);items.push(h,{k:"p",t:o?`${o[0]}: ${o[1]}`:val})}
      else if(f.ty==="images"){items.push(h);val.forEach((im,i)=>items.push({k:"img",src:im.src,w:im.w,h:im.h,cap:`صورة (${AR(i+1)})${im.cap?": "+im.cap:""}`}))}
    });
    if(items.length)B.push({k:"h1",t:`${AR(pi+1)}. ${p.rs}`,sub:`مرحلة «${p.dfc}»`},...items);
  });
  return B;
}
function reportHTML(B){
  return `<div class="rep" id="rep">`+B.map(b=>{
    if(b.k==="cover")return `<div class="cover"><div class="kind">وحدة مهارات القرن ٢١ · مشروع التصميم من أجل التغيير</div><h1>${esc(b.title)}</h1><div class="path">${esc(b.path)}</div>${b.rows.length?`<table>${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>`:""}</div>`;
    if(b.k==="h1")return `<h1 class="rh">${esc(b.t)}${b.sub?` <small>${esc(b.sub)}</small>`:""}</h1>`;
    if(b.k==="h2")return `<h2>${esc(b.t)}</h2>`;
    if(b.k==="p")return `<p>${esc(b.t)}</p>`;
    if(b.k==="ol")return `<ol>${b.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
    if(b.k==="table")return `<table class="rt"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    if(b.k==="img")return `<figure><img src="${b.src}" alt=""><figcaption>${esc(b.cap)}</figcaption></figure>`;
    return "";}).join("")+`</div>`;
}

/* ============ EXPORT: DOCX ============ */
async function buildDocx(B){
  const D=window.docx;if(!D)throw new Error("nolib");
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,ImageRun,Footer,PageNumber,ShadingType,BorderStyle}=D;
  const FONT={ascii:"Arial",hAnsi:"Arial",cs:"Arial",eastAsia:"Arial"};
  const run=(text,o={})=>new TextRun({text,rightToLeft:true,font:FONT,size:o.size||24,sizeComplexScript:o.size||24,bold:!!o.bold,boldComplexScript:!!o.bold,color:o.color||"1A1A1A"});
  const para=(text,o={})=>new Paragraph({bidirectional:true,alignment:o.align,pageBreakBefore:!!o.pb,keepNext:!!o.keepNext,spacing:{before:o.before||0,after:o.after??120,line:o.line||360},
    children:String(text).split("\n").flatMap((ln,i)=>i?[new TextRun({break:1}),run(ln,o)]:[run(ln,o)])});
  const border={style:BorderStyle.SINGLE,size:4,color:"A9B1C0"};
  const cell=(t,head)=>new TableCell({children:[para(t||" ",{bold:head,size:22,after:40,line:300})],shading:head?{type:ShadingType.CLEAR,color:"auto",fill:"E8EEF7"}:undefined,
    borders:{top:border,bottom:border,left:border,right:border},margins:{top:60,bottom:60,left:100,right:100}});
  const table=(head,rows)=>new Table({visuallyRightToLeft:true,width:{size:100,type:WidthType.PERCENTAGE},
    rows:[new TableRow({tableHeader:true,children:head.map(h=>cell(h,true))}),...rows.map(r=>new TableRow({cantSplit:true,children:r.map(c=>cell(c,false))}))]});
  const kids=[];let first=true;
  for(const b of B){
    if(b.k==="cover"){
      kids.push(para("وحدة مهارات القرن ٢١ · مشروع التصميم من أجل التغيير",{align:AlignmentType.CENTER,size:22,color:"555555",before:2400,after:300}));
      kids.push(para(b.title,{align:AlignmentType.CENTER,size:44,bold:true,color:"1F3A8A",after:200,line:440}));
      if(b.path)kids.push(para(b.path,{align:AlignmentType.CENTER,size:20,color:"555555",after:900}));
      if(b.rows.length)kids.push(table(["البيان","التفاصيل"],b.rows));
    }else if(b.k==="h1"){kids.push(para(b.t+(b.sub?"  —  "+b.sub:""),{size:34,bold:true,color:"1F3A8A",pb:true,after:200,keepNext:true}));first=false;}
    else if(b.k==="h2")kids.push(para(b.t,{size:27,bold:true,color:"222222",before:240,after:80,keepNext:true}));
    else if(b.k==="p")kids.push(para(b.t));
    else if(b.k==="ol")b.items.forEach((x,i)=>kids.push(para(`${AR(i+1)}. ${x}`,{after:60})));
    else if(b.k==="table"){kids.push(table(b.head,b.rows));kids.push(para("",{after:80}))}
    else if(b.k==="img"){
      const bin=atob(b.src.split(",")[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      const W=420,H=Math.round(W*b.h/b.w),sc=Math.min(1,320/H);
      kids.push(new Paragraph({alignment:AlignmentType.CENTER,keepNext:true,children:[new ImageRun({data:u,transformation:{width:Math.round(W*sc),height:Math.round(H*sc)}})]}));
      kids.push(para(b.cap,{align:AlignmentType.CENTER,size:20,color:"555555",after:200}));
    }
  }
  const doc=new Document({creator:"مسار التغيير",title:S.title,
    styles:{default:{document:{run:{font:FONT,rightToLeft:true}}}},
    sections:[{properties:{page:{margin:{top:1200,bottom:1200,left:1200,right:1200}}},
      footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({children:[PageNumber.CURRENT],font:FONT,size:20})]})]})},
      children:kids}]});
  return Packer.toBlob(doc);
}

/* ============ EXPORT: PDF (drawn line by line on canvas so Arabic shaping stays correct) ============ */
async function buildPdf(B){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error("nolib");
  const FAM='"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif',DISP=FAM;
  try{await Promise.all(['400 26px "IBM Plex Sans Arabic"','700 26px "IBM Plex Sans Arabic"'].map(f=>document.fonts.load(f,"عربي")))}catch(e){}
  const W=1240,H=1754,M=110,MB=130,CW=W-2*M,R=W-M;
  const pages=[];let c,x,y;
  const newPage=()=>{c=document.createElement("canvas");c.width=W;c.height=H;x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.direction="rtl";x.textBaseline="alphabetic";pages.push(c);y=M;};
  const font=(sz,b,fam)=>{x.font=`${b?700:400} ${sz}px ${fam||FAM}`};
  const wrap=(text,maxW)=>{const out=[];String(text).split("\n").forEach(par=>{const ws=par.split(/\s+/).filter(Boolean);if(!ws.length){out.push("");return}
    let line="";ws.forEach(w=>{const t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out};
  const ensure=h=>{if(y+h>H-MB)newPage()};
  const lines=(text,o={})=>{const sz=o.size||27,lh=Math.round(sz*(o.lh||1.9));font(sz,o.bold,o.fam);x.fillStyle=o.color||"#1a1a1a";
    const right=o.right??R,maxW=o.maxW||CW;
    wrap(text,maxW).forEach(l=>{ensure(lh);x.textAlign=o.center?"center":"right";x.fillText(l,o.center?W/2:right,y+sz*1.15);y+=lh});};
  const table=(head,rows)=>{
    const n=head.length,pad=14,sz=24,lh=Math.round(sz*1.75);
    let ws=n===2?[CW*.34,CW*.66]:Array(n).fill(CW/n);if(n===4)ws=[CW*.4,CW*.2,CW*.2,CW*.2];
    const rowH=(cells,b)=>{font(sz,b);return Math.max(...cells.map((t,i)=>wrap(t||" ",ws[i]-2*pad).length))*lh+2*pad};
    const drawRow=(cells,b)=>{const h=rowH(cells,b);let xr=R;
      cells.forEach((t,i)=>{const w=ws[i];if(b){x.fillStyle="#E8EEF7";x.fillRect(xr-w,y,w,h)}x.strokeStyle="#A9B1C0";x.lineWidth=2;x.strokeRect(xr-w,y,w,h);
        font(sz,b);x.fillStyle="#1a1a1a";x.textAlign="right";wrap(t||" ",w-2*pad).forEach((l,k)=>x.fillText(l,xr-pad,y+pad+k*lh+sz*1.1));xr-=w});y+=h};
    ensure(rowH(head,true)+rowH(rows[0]||head,false));drawRow(head,true);
    rows.forEach(r=>{const h=rowH(r,false);if(y+h>H-MB){newPage();drawRow(head,true)}drawRow(r,false)});y+=18;};
  const loadImg=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src});
  newPage();
  for(let bi=0;bi<B.length;bi++){const b=B[bi];
    if(b.k==="cover"){y=420;lines("وحدة مهارات القرن ٢١ · مشروع التصميم من أجل التغيير",{center:1,size:26,color:"#555"});y+=30;
      lines(b.title,{center:1,size:52,bold:1,fam:DISP,color:"#1F3A8A",lh:1.6,maxW:CW*.9});y+=10;
      if(b.path)lines(b.path,{center:1,size:22,color:"#666"});y+=70;
      if(b.rows.length)table(["البيان","التفاصيل"],b.rows);}
    else if(b.k==="h1"){newPage();lines(b.t,{size:42,bold:1,fam:DISP,color:"#1F3A8A",lh:1.5});if(b.sub)lines(b.sub,{size:23,color:"#666",lh:1.5});
      x.fillStyle="#C9CFD9";x.fillRect(M,y+4,CW,3);y+=34;}
    else if(b.k==="h2"){ensure(36*1.6+27*1.9*2);y+=14;lines(b.t,{size:31,bold:1,color:"#222",lh:1.6});}
    else if(b.k==="p"){lines(b.t);y+=8;}
    else if(b.k==="ol"){b.items.forEach((t,i)=>{font(27,0);const num=AR(i+1)+".";ensure(52);x.fillStyle="#1a1a1a";x.textAlign="right";x.fillText(num,R,y+27*1.15);lines(t,{right:R-48,maxW:CW-48})});y+=8;}
    else if(b.k==="table")table(b.head,b.rows);
    else if(b.k==="img"){const im=await loadImg(b.src);if(im){let w=CW*.72,h=w*im.height/im.width;if(h>620){h=620;w=h*im.width/im.height}
      ensure(h+70);x.drawImage(im,(W-w)/2,y,w,h);x.strokeStyle="#C9CFD9";x.lineWidth=2;x.strokeRect((W-w)/2,y,w,h);y+=h+8;}
      lines(b.cap,{center:1,size:22,color:"#555"});y+=16;}
  }
  const pdf=new J({unit:"mm",format:"a4",orientation:"portrait",compress:true});
  pages.forEach((pg,i)=>{const g=pg.getContext("2d");g.direction="ltr";g.font=`400 22px ${FAM}`;g.fillStyle="#777";g.textAlign="center";g.fillText(AR(i+1),W/2,H-60);
    if(i)pdf.addPage();pdf.addImage(pg.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297);});
  return pdf.output("blob");
}

/* ============ SAVE A FILE ============ */
async function saveFile(name,blob){
  let dl=null;
  try{if(window.claude&&typeof window.claude.use==="function")dl=await window.claude.use("downloads");}catch(e){dl=null}
  if(dl){try{await dl.save({filename:name,data:blob});return "ok"}catch(e){return e&&e.code==="declined"?"declined":"fail:"+(e&&e.code||"")}}
  try{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return "ok"}catch(e){return "fail"}
}
const safeName=()=>((S.title||"مشروع").replace(/[\\/:*?"<>|«»]/g,"").trim().slice(0,60)||"مشروع");

/* ============ FINAL STEP ============ */
function renderFinal(m){
  const B=model();
  const miss=PHASES.flatMap((p,pi)=>p.f.filter(f=>f.req&&!isFilled(f)).map(f=>({f,step:pi+3,ph:p.dfc})));
  const reqAll=PHASES.flatMap(p=>p.f.filter(f=>f.req)).length,pct=Math.round((reqAll-miss.length)/reqAll*100);
  const srcN=(S.a.f_sources||[]).filter(r=>r.some(c=>(c||"").trim())).length,picN=(S.a.d_photos||[]).length;
  m.innerHTML=`<div class="eyebrow">الملف النهائي</div><h2 class="title">${esc(S.title||"مشروعك")}</h2>
  <p class="lead">هذا ملف مشروعك كاملاً بترتيب خطوات البحث العلمي. راجعه، ثم حمّله بصيغة Word لتعدّل عليه، أو PDF لتطبعه وتسلّمه.</p>
  <div class="ready"><strong>${AR(pct)}٪</strong><span>جاهزية المشروع: أكملت ${AR(reqAll-miss.length)} من ${AR(reqAll)} جزءاً أساسياً · ${AR(srcN)} مصادر · ${AR(picN)} صور</span></div>
  <div class="final-grid">${PHASES.map((p,i)=>{const[f,t]=phaseFill(p);return `<button type="button" class="pcard opt" style="--c:${p.color}" data-go="${i+3}"><b>${esc(p.dfc)}</b><span class="big">${esc(p.rs)} · ${AR(f)}/${AR(t)}</span><span class="meter" style="display:block"><i style="width:${f/t*100}%"></i></span></button>`}).join("")}</div>
  ${miss.length?`<div class="missing"><b>أجزاء أساسية لم تكتمل بعد (${AR(miss.length)}):</b><ul>${miss.slice(0,8).map(x=>`<li>«${esc(x.f.t)}» في مرحلة ${esc(x.ph)} <a data-go="${x.step}" role="button" tabindex="0">أكملها</a></li>`).join("")}${miss.length>8?`<li>و${AR(miss.length-8)} أجزاء أخرى</li>`:""}</ul></div>`:`<div class="missing" style="color:var(--ok)"><b>أحسنت! أكملت جميع الأجزاء الأساسية.</b></div>`}
  <div class="exports"><button class="btn pri" type="button" id="exDocx">تحميل ملف Word</button><button class="btn pri" type="button" id="exPdf">تحميل ملف PDF</button><span class="status" id="exStatus" role="status"></span></div>
  <div class="preview">${reportHTML(B)}</div>
  <div class="nav"><button class="btn" type="button" data-go="6">السابق</button></div>`;
  const st=$("#exStatus");
  const runEx=async(btn,kind)=>{btn.disabled=true;st.className="status";st.textContent="جارٍ تجهيز الملف...";
    try{const blob=kind==="docx"?await buildDocx(model()):await buildPdf(model());
      const r=await saveFile(`${safeName()}.${kind}`,blob);
      if(r==="ok"){st.className="status ok";st.textContent="تم تجهيز الملف."}
      else if(r==="declined"){st.textContent="أُلغي التحميل."}
      else{st.className="status err";st.textContent="لم يكتمل التحميل. جرّب مرة أخرى."}
    }catch(e){st.className="status err";st.textContent=e&&e.message==="nolib"?"تعذّر تحميل أداة إنشاء الملفات. تأكد من اتصالك بالإنترنت ثم أعد فتح الصفحة.":"حدث خطأ أثناء إنشاء الملف. جرّب مرة أخرى."}
    btn.disabled=false;};
  $("#exDocx").onclick=e=>runEx(e.currentTarget,"docx");
  $("#exPdf").onclick=e=>runEx(e.currentTarget,"pdf");
}

/* ============ TOOLBAR ============ */
$("#bkSave").onclick=async()=>{const r=await saveFile(`${safeName()} - نسخة احتياطية.json`,new Blob([JSON.stringify(S)],{type:"application/json"}));note(r==="ok"?"تم حفظ النسخة الاحتياطية":"لم تُحفظ النسخة الاحتياطية")};
$("#bkLoad").onclick=()=>$("#bkFile").click();
$("#bkFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||typeof d.a!=="object")throw 0;S=Object.assign(blank(),d);save();render();note("تمت استعادة المشروع")}catch(x){note("هذا الملف ليس نسخة احتياطية صالحة")}};r.readAsText(f);e.target.value=""};
$("#resetBtn").onclick=()=>{const c=$("#confirmBox");c.hidden=false;c.innerHTML=`<div class="confirm">سيُحذف كل ما كتبته في هذا المشروع من هذا الجهاز. هل أنت متأكد؟ <button class="btn sm" type="button" id="cYes">نعم، ابدأ من جديد</button><button class="btn sm ghost" type="button" id="cNo">إلغاء</button></div>`;
  $("#cYes").onclick=()=>{S=blank();try{localStorage.removeItem(KEY)}catch(e){}c.hidden=true;render();note("")};$("#cNo").onclick=()=>{c.hidden=true}};

render();
})();
