<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج ثلاثي الأبعاد تفاعلي للخلية النباتية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 280px;
            pointer-events: none;
        }
        #info-panel h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #4ade80;
        }
        #info-panel ul {
            margin: 0;
            padding-right: 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
    <!-- استدعاء مكتبة Three.js و OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info-panel">
        <h2>الخلية النباتية (3D)</h2>
        <ul>
            <li><span style="color:#22c55e;">■</span> الجدار الخلوي والغشاء</li>
            <li><span style="color:#3b82f6;">■</span> الفجوة العصارية المركزية</li>
            <li><span style="color:#a855f7;">■</span> النواة والنوية</li>
            <li><span style="color:#10b981;">■</span> البلاستيدات الخضراء</li>
            <li><span style="color:#f97316;">■</span> الميتوكندريا</li>
        </ul>
    </div>

    <div id="controls-hint">
        💡 الزر الأيسر: تدوير | السكرول: تقريب وتكبير | الزر الأيمن: سحب وتغيير المكان
    </div>

    <script>
        // 1. إعداد المشهد والكاميرا
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 20, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. أدوات التحكم بالماوس (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(20, 40, 20);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x3b82f6, 0.3);
        dirLight2.position.set(-20, -20, -20);
        scene.add(dirLight2);

        // مجموعة الخلية الجمجمة
        const plantCell = new THREE.Group();

        // 4. بناء الجدار الخلوي (Cell Wall - شفاف مقطوع لإظهار الداخل)
        const cellShapeGeom = new THREE.BoxGeometry(16, 12, 10);
        const cellWallMat = new THREE.MeshPhongMaterial({
            color: 0x22c55e,
            transparent: true,
            opacity: 0.25,
            wireframe: false,
            side: THREE.DoubleSide
        });
        const cellWall = new THREE.Mesh(cellShapeGeom, cellWallMat);
        plantCell.add(cellWall);

        // الإطار الخارجي للجدار الخلوي
        const wireframeGeom = new THREE.WireframeGeometry(cellShapeGeom);
        const wireframeMat = new THREE.LineBasicMaterial({ color: 0x4ade80, linewidth: 2 });
        const wireframe = new THREE.LineSegments(wireframeGeom, wireframeMat);
        plantCell.add(wireframe);

        // 5. السيتوبلازم (Cytoplasm)
        const cytoGeom = new THREE.BoxGeometry(15.2, 11.2, 9.2);
        const cytoMat = new THREE.MeshPhongMaterial({
            color: 0x86efac,
            transparent: true,
            opacity: 0.15
        });
        const cytoplasm = new THREE.Mesh(cytoGeom, cytoMat);
        plantCell.add(cytoplasm);

        // 6. الفجوة العصارية المركزية (Central Vacuole)
        const vacuoleGeom = new THREE.SphereGeometry(3.5, 32, 32);
        vacuoleGeom.scale(1.4, 1.1, 1);
        const vacuoleMat = new THREE.MeshPhysicalMaterial({
            color: 0x3b82f6,
            transmission: 0.6,
            opacity: 1,
            transparent: true,
            roughness: 0.1,
            ior: 1.33
        });
        const vacuole = new THREE.Mesh(vacuoleGeom, vacuoleMat);
        vacuole.position.set(-2, 0, -1);
        plantCell.add(vacuole);

        // 7. النواة (Nucleus) والنوية (Nucleolus)
        const nucleusGroup = new THREE.Group();
        const nucGeom = new THREE.SphereGeometry(2.2, 32, 32);
        const nucMat = new THREE.MeshPhongMaterial({
            color: 0xa855f7,
            transparent: true,
            opacity: 0.75
        });
        const nucleus = new THREE.Mesh(nucGeom, nucMat);

        const nucleolusGeom = new THREE.SphereGeometry(0.8, 16, 16);
        const nucleolusMat = new THREE.MeshPhongMaterial({ color: 0xec4899 });
        const nucleolus = new THREE.Mesh(nucleolusGeom, nucleolusMat);
        nucleusGroup.add(nucleus);
        nucleusGroup.add(nucleolus);
        nucleusGroup.position.set(4, 2, 1);
        plantCell.add(nucleusGroup);

        // 8. البلاستيدات الخضراء (Chloroplasts)
        function createChloroplast() {
            const group = new THREE.Group();
            const chloroGeom = new THREE.CylinderGeometry(0.8, 0.8, 0.5, 16);
            const chloroMat = new THREE.MeshPhongMaterial({ color: 0x10b981 });
            const chloro = new THREE.Mesh(chloroGeom, chloroMat);
            group.add(chloro);
            return group;
        }

        const chloroPositions = [
            [5, -3, -2], [-5, 3, 2], [-4, -3, 2], [3, 3, -2], [0, 4, 2]
        ];
        chloroPositions.forEach(pos => {
            const cp = createChloroplast();
            cp.position.set(...pos);
            cp.rotation.x = Math.random() * Math.PI;
            cp.rotation.z = Math.random() * Math.PI;
            plantCell.add(cp);
        });

        // 9. الميتوكندريا (Mitochondria)
        function createMitochondria() {
            const mitoGeom = new THREE.CapsuleGeometry ? 
                new THREE.CapsuleGeometry(0.5, 1.2, 4, 8) : 
                new THREE.CylinderGeometry(0.5, 0.5, 1.5, 16);
            const mitoMat = new THREE.MeshPhongMaterial({ color: 0xf97316 });
            return new THREE.Mesh(mitoGeom, mitoMat);
        }

        const mitoPositions = [
            [4, -2, 2], [-3, 2, -3], [1, -4, -2], [-5, -2, -2]
        ];
        mitoPositions.forEach(pos => {
            const mt = createMitochondria();
            mt.position.set(...pos);
            mt.rotation.y = Math.random() * Math.PI;
            plantCell.add(mt);
        });

        scene.add(plantCell);

        // 10. التحريك المستمر (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);
            
            // دوران بطيء وخفيف للخلية لإعطاء حيوية
            plantCell.rotation.y += 0.002;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // إعادة ضبط الحجم عند تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
