<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجربة المرايا والعدسات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E9EEF2; --surface:#FFFFFF; --ink:#1B2731; --muted:#5A6873; --line:#CED8E0;
  --steel:#3D5A73; --accent:#E39B1B; --accent-ink:#4A2E00;
  --ok:#2E7D3B; --ok-bg:#E1F2E3; --bad:#B4372F; --bad-bg:#FBE3E0;
  --real:#1E7A4E; --virtual:#B45A1F;
  --f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F2B13F; --accent-ink:#2A1A00;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --real:#6FD39E; --virtual:#F2A968; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F2B13F; --accent-ink:#2A1A00;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --real:#6FD39E; --virtual:#F2A968}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem)} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px}
.topline{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.tag{font-size:.86rem;color:var(--muted)} .tag b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--bg);flex:none}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--ink);color:#fff}
.bench{display:grid;grid-template-columns:260px minmax(0,1fr) 260px;gap:14px}
@media (max-width:1050px){.bench{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segbtn{font:inherit;font-size:.82rem;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 3px;cursor:pointer;flex:1;min-width:0;text-align:center;overflow-wrap:break-word}
.segbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.slide{display:flex;flex-direction:column;gap:4px}
.slide .lbl{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.slide .lbl b{color:var(--ink);font-family:var(--f-display);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.stage{position:relative;background:linear-gradient(180deg,#eef3f6,#dfe7ec);border-radius:20px;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none}
:root:not([data-theme="light"]) .stage, :root[data-theme="dark"] .stage{background:linear-gradient(180deg,#1b2630,#141c23)}
.stage svg{display:block;width:100%;height:auto}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.92rem}
.readout .k{color:var(--muted)}
.readout .v{font-weight:700;font-family:var(--f-display)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{padding:4px 12px;border-radius:999px;font-size:.86rem;font-weight:700;background:var(--bg);color:var(--muted)}
.badge.real{background:color-mix(in srgb,var(--real) 18%,transparent);color:var(--real)}
.badge.virtual{background:color-mix(in srgb,var(--virtual) 18%,transparent);color:var(--virtual)}
.note{font-size:.92rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.screenmsg{border-radius:12px;padding:9px 12px;font-weight:600;font-size:.92rem;background:var(--bg);border:1px solid var(--line)}
.screenmsg.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.screenmsg.warn{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.tasks li{display:flex;gap:8px;padding:6px 8px;border-radius:8px;background:var(--bg)}
.tasks li i{font-style:normal;font-family:var(--f-display);background:var(--steel);color:var(--surface);border-radius:50%;width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:.8rem}
.book{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.book{grid-template-columns:1fr}}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.q{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.lock{color:var(--muted);font-size:.92rem}
.score{font-family:var(--f-display);font-size:1.3rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="head">
    <div>
      <div class="topline">
        <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);text-decoration:none"><span aria-hidden="true">&#8592;</span><span data-t="back"></span></a>
        <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
      </div>
      <h1 data-t="h1"></h1>
      <p class="tag" id="tagText"></p>
    </div>
    <button class="btn ghost" id="restart" data-t="restart"></button>
  </header>

  <div class="bench">
    <!-- left controls -->
    <aside class="card">
      <h3 data-t="chooseDevice"></h3>
      <div class="seg" role="group" id="deviceGroup">
        <button class="segbtn" data-device="mirror" aria-pressed="true" data-t="mirrorBtn"></button>
        <button class="segbtn" data-device="lens" aria-pressed="false" data-t="lensBtn"></button>
      </div>
      <h3 id="typeTitle"></h3>
      <div class="seg" id="typeGroup" role="group"></div>

      <div class="slide" id="fWrap">
        <div class="lbl"><span data-t="fLabel"></span><b id="fVal">15</b></div>
        <input type="range" id="fSlider" min="5" max="35" step="1" value="15">
        <p class="lock" data-t="fNote"></p>
      </div>

      <div class="slide">
        <div class="lbl"><span data-t="doLabel"></span><b id="doVal">30</b></div>
        <input type="range" id="doSlider" min="2" max="90" step="1" value="30">
        <p class="lock" data-t="doNote"></p>
      </div>

      <div class="slide">
        <div class="lbl"><span data-t="dsLabel"></span><b id="dsVal">30</b></div>
        <input type="range" id="dsSlider" min="0" max="90" step="1" value="30">
        <p class="lock" data-t="dsNote"></p>
      </div>
    </aside>

    <!-- stage -->
    <div>
      <div class="stage" id="stage"><svg id="lab" viewBox="0 0 1000 480"></svg></div>
      <div class="screenmsg" id="screenMsg" style="margin-top:10px"></div>
    </div>

    <!-- right readout -->
    <aside class="card">
      <h3 data-t="resultsHeading"></h3>
      <div class="badges" id="badges"></div>
      <div class="readout">
        <span class="k" data-t="readoutDo"></span><span class="v" id="rDo">—</span>
        <span class="k" data-t="readoutDi"></span><span class="v" id="rDi">—</span>
        <span class="k" data-t="readoutF"></span><span class="v" id="rF">—</span>
        <span class="k" data-t="readoutM"></span><span class="v" id="rM">—</span>
      </div>
      <div class="note" id="explain"></div>
      <h3 style="margin-top:4px" data-t="tasksHeading"></h3>
      <ol class="tasks" id="tasks"></ol>
    </aside>
  </div>

  <div class="book">
    <div class="card">
      <h2 data-t="notebookHeading"></h2>
      <p class="lock" data-t="notebookInstr"></p>
      <textarea id="labnotes"></textarea>
    </div>
    <div class="card">
      <h2 data-t="quizHeading"></h2>
      <div id="quiz"></div>
      <div class="row"><button class="btn" id="checkQuiz" data-t="checkBtn"></button><span class="score" id="score"></span></div>
    </div>
  </div>

  <div class="card">
    <h2 data-t="reportHeading"></h2>
    <div class="row"><input type="text" id="sname" style="flex:1;width:auto"><button class="btn" id="copyRep" data-t="copyBtn"></button></div>
    <p class="lock" id="copyMsg"></p>
    <textarea id="repTxt" readonly hidden></textarea>
  </div>
</div>
