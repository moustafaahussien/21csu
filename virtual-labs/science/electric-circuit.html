<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجربة الدائرة الكهربائية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: a lab bench — instruction strip, wax dissection tray (stage) with system trays beside it, tool rack under it, lab notebook below */
:root{
  --bg:#E9EEF2; --surface:#FFFFFF; --ink:#1B2731; --muted:#5A6873; --line:#CED8E0;
  --steel:#3D5A73; --accent:#E39B1B; --accent-ink:#4A2E00;
  --ok:#2E7D3B; --ok-bg:#E1F2E3; --bad:#B4372F; --bad-bg:#FBE3E0;
  --tray:#2B3238; --tray-edge:#1A1F23; --wax:#3A434A;
  --f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F2B13F; --accent-ink:#2A1A00;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --tray:#232A30; --tray-edge:#0D1114; --wax:#2F373E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F2B13F; --accent-ink:#2A1A00;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --tray:#232A30; --tray-edge:#0D1114; --wax:#2F373E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem)} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px}
.tag{font-size:.86rem;color:var(--muted)} .tag b{color:var(--ink)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.task .num{font-family:var(--f-display);background:var(--steel);color:var(--surface);border-radius:10px;padding:2px 12px;white-space:nowrap}
.task p{flex:1;min-width:0;font-weight:700;font-size:1.08rem}
.feedback{border-radius:12px;padding:10px 14px;font-weight:500;background:var(--surface);border:1px solid var(--line);min-height:48px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.feedback.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px}
@media (max-width:860px){.bench{grid-template-columns:1fr}}
.stage{position:relative;background:radial-gradient(circle at 30% 20%,#3B4650,#151B20);border-radius:20px;padding:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:auto}
.stage.tool-on svg{cursor:none}
.cursor{position:absolute;width:64px;height:64px;pointer-events:none;transform:translate(-14px,-50px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));display:none}
.cursor svg{width:100%;height:100%}
.organ{cursor:pointer}
#lens,#lens *{pointer-events:none!important}
.organ.lifted{filter:drop-shadow(0 10px 8px rgba(0,0,0,.55))}
.flap{transform-box:view-box;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.flap .inner{opacity:0;transition:opacity .9s}.flap .outer{transition:opacity .9s}
.flap.open .inner{opacity:1}.flap.open .outer{opacity:0}
.target{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5;animation:pulse 1.2s infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.steps li{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;color:var(--muted)}
.steps li i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--bg);font-family:var(--f-display);font-size:.85rem;flex:none}
.steps li.now{color:var(--ink);font-weight:700;background:var(--bg)} .steps li.now i{background:var(--accent);color:var(--accent-ink)}
.steps li.done i{background:var(--ok);color:var(--surface)}
.wear{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem}
.wear span{padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.wear span.on{background:var(--ok-bg);color:var(--ok);font-weight:700}
.info h3{color:var(--steel)}
.rack{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:640px){.rack{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tool{font:inherit;font-size:.88rem;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tool svg{width:50px;height:50px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.tool.worn{border-color:var(--ok)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.book{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.book{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.85rem}
td.pending{color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.q{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.lock{color:var(--muted);font-size:.92rem}
.score{font-family:var(--f-display);font-size:1.3rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg .choice{padding:3px 10px;font-size:.88rem}
.stage{cursor:default}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--bg);font-family:var(--f-display);font-weight:700;flex:none}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--steel);color:var(--surface)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="head">
    <div>
      <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);text-decoration:none;margin-bottom:6px">&#8592; <span data-t="back"></span></a>
      <h1 data-t="h1"></h1>
      <p class="tag" id="pageTag"></p>
    </div>
    <div class="row" style="gap:8px">
      <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
      <button class="btn ghost" id="restart" data-t="restart"></button>
    </div>
  </header>

  <div class="task"><span class="num" id="taskNum"></span><p id="taskTxt"></p></div>
  <div class="feedback" id="fb" aria-live="polite"></div>

  <div class="bench">
    <div><div class="stage" id="stage"><svg id="lab" viewBox="0 0 1000 560"></svg></div></div>
    <aside class="side">
      <div class="card"><h3 data-t="stepsHeading"></h3><ol class="steps" id="steps"></ol></div>
      <div class="card"><h3 data-t="circuitStateHeading"></h3><div class="wear"><span id="stSwitch"></span><span id="stBulb"></span><span id="stShort" hidden data-t="shortLabel"></span></div></div>
      <div class="card info" id="info"></div>
    </aside>
  </div>

  <div class="book">
    <div class="card">
      <h2 data-t="nbHeading"></h2>
      <p class="lock" data-t="nbLock"></p>
      <div class="tbl"><table>
        <thead><tr><th data-t="thMat"></th><th data-t="thPred"></th><th data-t="thRes"></th></tr></thead>
        <tbody id="nb"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h2 data-t="quizHeading"></h2>
      <p class="lock" id="quizLock" data-t="quizLock"></p>
      <div id="quiz" hidden></div>
      <div class="row" id="quizBtns" hidden><button class="btn" id="checkQuiz" data-t="checkQuiz"></button><span class="score" id="score"></span></div>
    </div>
  </div>

  <div class="card">
    <h2 data-t="reportHeading"></h2>
    <p class="lock" data-t="reportDesc"></p>
    <textarea id="concl"></textarea>
    <div class="row"><input type="text" id="sname" style="flex:1;width:auto"><button class="btn" id="copyRep" data-t="copyRep"></button></div>
    <p class="lock" id="copyMsg"></p>
    <textarea id="repTxt" readonly hidden></textarea>
  </div>
</div>
