<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجربة الدائرة الكهربائية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: a lab bench — instruction strip, wax dissection tray (stage) with system trays beside it, tool rack under it, lab notebook below */
:root{
  --bg:#E9EEF2; --surface:#FFFFFF; --ink:#1B2731; --muted:#5A6873; --line:#CED8E0;
  --steel:#3D5A73; --accent:#E39B1B; --accent-ink:#4A2E00;
  --ok:#2E7D3B; --ok-bg:#E1F2E3; --bad:#B4372F; --bad-bg:#FBE3E0;
  --tray:#2B3238; --tray-edge:#1A1F23; --wax:#3A434A;
  --f-display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F2B13F; --accent-ink:#2A1A00;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --tray:#232A30; --tray-edge:#0D1114; --wax:#2F373E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F2B13F; --accent-ink:#2A1A00;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --tray:#232A30; --tray-edge:#0D1114; --wax:#2F373E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem)} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px}
.tag{font-size:.86rem;color:var(--muted)} .tag b{color:var(--ink)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.task .num{font-family:var(--f-display);background:var(--steel);color:var(--surface);border-radius:10px;padding:2px 12px;white-space:nowrap}
.task p{flex:1;min-width:0;font-weight:700;font-size:1.08rem}
.feedback{border-radius:12px;padding:10px 14px;font-weight:500;background:var(--surface);border:1px solid var(--line);min-height:48px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.feedback.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px}
@media (max-width:860px){.bench{grid-template-columns:1fr}}
.stage{position:relative;background:radial-gradient(circle at 30% 20%,#3B4650,#151B20);border-radius:20px;padding:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:auto}
.stage.tool-on svg{cursor:none}
.cursor{position:absolute;width:64px;height:64px;pointer-events:none;transform:translate(-14px,-50px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));display:none}
.cursor svg{width:100%;height:100%}
.organ{cursor:pointer}
#lens,#lens *{pointer-events:none!important}
.organ.lifted{filter:drop-shadow(0 10px 8px rgba(0,0,0,.55))}
.flap{transform-box:view-box;transition:transform .9s cubic-bezier(.5,0,.2,1)}
.flap .inner{opacity:0;transition:opacity .9s}.flap .outer{transition:opacity .9s}
.flap.open .inner{opacity:1}.flap.open .outer{opacity:0}
.target{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5;animation:pulse 1.2s infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.steps li{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;color:var(--muted)}
.steps li i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--bg);font-family:var(--f-display);font-size:.85rem;flex:none}
.steps li.now{color:var(--ink);font-weight:700;background:var(--bg)} .steps li.now i{background:var(--accent);color:var(--accent-ink)}
.steps li.done i{background:var(--ok);color:var(--surface)}
.wear{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem}
.wear span{padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.wear span.on{background:var(--ok-bg);color:var(--ok);font-weight:700}
.info h3{color:var(--steel)}
.rack{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:640px){.rack{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tool{font:inherit;font-size:.88rem;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tool svg{width:50px;height:50px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.tool.worn{border-color:var(--ok)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.book{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.book{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.85rem}
td.pending{color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.q{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.lock{color:var(--muted);font-size:.92rem}
.score{font-family:var(--f-display);font-size:1.3rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg .choice{padding:3px 10px;font-size:.88rem}
.stage{cursor:default}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--bg);font-family:var(--f-display);font-weight:700;flex:none}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--steel);color:var(--surface)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="head">
    <div>
      <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);text-decoration:none;margin-bottom:6px">&#8592; <span data-t="back"></span></a>
      <h1 data-t="h1"></h1>
      <p class="tag" id="pageTag"></p>
    </div>
    <div class="row" style="gap:8px">
      <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
      <button class="btn ghost" id="restart" data-t="restart"></button>
    </div>
  </header>

  <div class="task"><span class="num" id="taskNum"></span><p id="taskTxt"></p></div>
  <div class="feedback" id="fb" aria-live="polite"></div>

  <div class="bench">
    <div><div class="stage" id="stage"><svg id="lab" viewBox="0 0 1000 560"></svg></div></div>
    <aside class="side">
      <div class="card"><h3 data-t="stepsHeading"></h3><ol class="steps" id="steps"></ol></div>
      <div class="card"><h3 data-t="circuitStateHeading"></h3><div class="wear"><span id="stSwitch"></span><span id="stBulb"></span><span id="stShort" hidden data-t="shortLabel"></span></div></div>
      <div class="card info" id="info"></div>
    </aside>
  </div>

  <div class="book">
    <div class="card">
      <h2 data-t="nbHeading"></h2>
      <p class="lock" data-t="nbLock"></p>
      <div class="tbl"><table>
        <thead><tr><th data-t="thMat"></th><th data-t="thPred"></th><th data-t="thRes"></th></tr></thead>
        <tbody id="nb"></tbody>
      </table></div>
    </div>
    <div class="card">
      <h2 data-t="quizHeading"></h2>
      <p class="lock" id="quizLock" data-t="quizLock"></p>
      <div id="quiz" hidden></div>
      <div class="row" id="quizBtns" hidden><button class="btn" id="checkQuiz" data-t="checkQuiz"></button><span class="score" id="score"></span></div>
    </div>
  </div>

  <div class="card">
    <h2 data-t="reportHeading"></h2>
    <p class="lock" data-t="reportDesc"></p>
    <textarea id="concl"></textarea>
    <div class="row"><input type="text" id="sname" style="flex:1;width:auto"><button class="btn" id="copyRep" data-t="copyRep"></button></div>
    <p class="lock" id="copyMsg"></p>
    <textarea id="repTxt" readonly hidden></textarea>
  </div>
</div>

<script>

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(ms,fn,done){const t0=performance.now();(function f(n){const t=Math.min(1,(n-t0)/ms);fn(ease(t),t);if(t<1)requestAnimationFrame(f);else if(done)done()})(t0)}

  <rect x="690" y="386" width="180" height="62" rx="8" fill="url(#gBake)"/>
  <path d="M708,432 V418 H730 M852,432 V418 H836" fill="none" stroke="url(#gSteel)" stroke-width="5"/>
  <rect x="726" y="398" width="16" height="22" rx="2" fill="url(#gCopper)"/>
  <path d="M822,398 L822,420 M836,398 L836,420" stroke="url(#gCopper)" stroke-width="5"/>
  <g id="blade" style="transform-origin:734px 405px;transition:transform .35s cubic-bezier(.5,0,.3,1.3)">
    <rect x="730" y="400" width="106" height="10" rx="3" fill="url(#gCopper)" stroke="#6E3010" stroke-width=".8"/>
    <path d="M736,402 H830" stroke="#FFD8B5" stroke-opacity=".8" stroke-width="1.5"/>
    <rect x="836" y="396" width="38" height="18" rx="9" fill="url(#gBake)" stroke="#000" stroke-width=".8"/>
    <path d="M842,400 H866" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  </g>
  <circle cx="734" cy="405" r="5" fill="url(#gSteel)"/>
  ${post(708,432)}${post(852,432)}
  ${label(780,478,T('labels.switch'))}
  <!-- test clips -->
  ${[[680,1],[880,-1]].map(([x,dir])=>`<rect x="${x-26}" y="${236}" width="52" height="36" rx="6" fill="#000" fill-opacity=".35" filter="url(#fSoft)"/><rect x="${x-24}" y="${230}" width="48" height="36" rx="6" fill="url(#gBake)"/>
    <path d="M${x+dir*10},${246} L${x+dir*52},${244} L${x+dir*58},${250} L${x+dir*52},${256} L${x+dir*10},${254} Z" fill="url(#gSteel)" stroke="#59646B" stroke-width=".8"/>
    <path d="M${x+dir*26},${244} l${dir*4},4 l${dir*4},-4 l${dir*4},4 l${dir*4},-4 l${dir*4},4 M${x+dir*26},${256} l${dir*4},-4 l${dir*4},4 l${dir*4},-4 l${dir*4},4 l${dir*4},-4" stroke="#59646B" stroke-width="1" fill="none"/>${post(x,250)}`).join('')}
  ${label(780,300,T('labels.testClips'))}
  <g id="mats"></g>
  <g id="wires"></g>`;
  const mg=$('#mats');
  for(const k in MATS){const g=document.createElementNS(NS,'g');g.dataset.m=k;g.style.cursor='grab';g.innerHTML=`<ellipse cx="4" cy="9" rx="66" ry="7" fill="#000" fill-opacity=".35" filter="url(#fSoft)"/>${matSVG(k)}<rect x="-70" y="-18" width="142" height="36" fill="transparent"/>`;mg.appendChild(g)}
  renderMats();renderWires();
}
function renderMats(){for(const k in MATS){const g=$(`[data-m="${k}"]`),p=S.mpos[k];g.setAttribute('transform',`translate(${p[0]},${p[1]})`)}}
function curve(w){const A=w.e[0].p,B=w.e[1].p,dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,k=w.sag*(18+d*.12);
  const c1=[A[0]+dx*.25+nx*k,A[1]+dy*.25+ny*k],c2=[A[0]+dx*.75+nx*k,A[1]+dy*.75+ny*k];return{A,B,c1,c2}}
function clipSVG(p,from,col){const a=Math.atan2(p[1]-from[1],p[0]-from[0])*180/Math.PI;
  return `<g transform="translate(${p[0]},${p[1]}) rotate(${a})"><ellipse cx="-8" cy="6" rx="20" ry="6" fill="#000" fill-opacity=".3" filter="url(#fSoft)"/>
  <rect x="-34" y="-7" width="22" height="14" rx="5" fill="${col.b}" stroke="${col.d}" stroke-width="1"/><path d="M-32,-4 H-14" stroke="${col.h}" stroke-opacity=".7" stroke-width="2"/>
  <path d="M-14,-6 L6,-3 L8,0 L6,3 L-14,6 Z" fill="url(#gSteel)" stroke="#59646B" stroke-width=".8"/>
  <path d="M-8,-4.5 l2,2 l2,-2 l2,2 l2,-2 l2,2" stroke="#59646B" stroke-width=".8" fill="none"/></g>`}
function renderWires(){
  const g=$('#wires');let h='';
  S.wires.forEach((w,i)=>{const c=curve(w),col=WCOL[i],d=`M${c.A} C${c.c1} ${c.c2} ${c.B}`;
    h+=`<path d="${d}" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="10" transform="translate(4,7)" filter="url(#fSoft)"/>
    <path d="${d}" fill="none" stroke="${col.d}" stroke-width="9" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${col.b}" stroke-width="7" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="${col.h}" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" transform="translate(-1,-2)"/>
    <path class="flow" data-w="${i}" d="${d}" fill="none" stroke="#FFE36A" stroke-width="3" stroke-dasharray="3 13" stroke-linecap="round" style="display:none"/>
    ${clipSVG(c.A,c.c1,col)}${clipSVG(c.B,c.c2,col)}`});
  g.innerHTML=h;
}

/* ---------- circuit analysis ---------- */
function solve(opt){
  const par={};const f=x=>{while(par[x]&&par[x]!==x)x=par[x];return x};const u=(a,b)=>{a=f(a);b=f(b);if(a!==b)par[a]=b};
  for(const k in TERM)par[k]=k;
  S.wires.forEach(w=>{if(w.e[0].t&&w.e[1].t)u(w.e[0].t,w.e[1].t)});
  if(opt.sw)u('S1','S2');if(opt.gap)u('T1','T2');
  const short=f('Bpos')===f('Bneg');
  const lit=!short&&((f('Bpos')===f('L1')&&f('L2')===f('Bneg'))||(f('Bpos')===f('L2')&&f('L1')===f('Bneg')));
  return{short,lit,f};
}
function update(){
  const gapC=S.gap?MATS[S.gap].c:false,r=solve({sw:S.sw,gap:gapC});
  S.lit=r.lit;S.short=r.short;
  $('#halo').setAttribute('opacity',r.lit?1:0);$('#glass').setAttribute('fill',r.lit?'url(#gBulbOn)':'url(#gBulbOff)');
  const fil=$('#fil');fil.setAttribute('stroke',r.lit?'#FFFBE0':'#4A4F53');fil.setAttribute('stroke-width',r.lit?2.6:1.8);fil.setAttribute('filter',r.lit?'url(#fGlow)':'');
  $('#heat').setAttribute('opacity',r.short?.85:0);
  $$('.flow').forEach(p=>{const w=S.wires[+p.dataset.w];const on=r.lit&&w.e[0].t&&w.e[1].t&&r.f(w.e[0].t)!==null&&inLoop(w,r);p.style.display=on?'':'none'});
  const st=$('#stSwitch');st.textContent=S.sw?T('switchClosed'):T('switchOpen');
  const sb=$('#stBulb');sb.textContent=r.lit?T('bulbOn'):T('bulbOff');sb.classList.toggle('on',r.lit);
  $('#stShort').hidden=!r.short;
  return r;
}
function inLoop(w,r){const t=w.e[0].t;const comp=r.f(t);return comp===r.f('Bpos')||comp===r.f('Bneg')}

/* ---------- steps ---------- */
function renderSteps(){
  const steps=T('steps');
  $('#steps').innerHTML=steps.map((s,i)=>`<li class="${i<S.step?'done':i===S.step?'now':''}"><i>${i<S.step?'✓':i+1}</i>${s.s}</li>`).join('');
  if(S.step<5){$('#taskNum').textContent=T('taskNum')(S.step+1);$('#taskTxt').textContent=steps[S.step].t}
  else{$('#taskNum').textContent=T('taskDoneNum');$('#taskTxt').textContent=T('taskDoneTxt')}
}
function next(){S.step++;renderSteps();if(S.step===5){$('#quizLock').hidden=true;$('#quiz').hidden=false;$('#quizBtns').hidden=false}}
function attached(list){let n=0;list.forEach(t=>{if(S.wires.some(w=>w.e.some(e=>e.t===t)))n++});return n}
function check(src){
  const r=update();
  if(r.short){S.shorts++;fb('shortCircuit',[],'bad');info('short');return}
  if(S.step===1){
    const pot=solve({sw:true,gap:false});
    const usesSwitch=!solve({sw:false,gap:false}).lit;
    if(pot.lit&&usesSwitch){fb(S.sw?'circuitCompleteLit':'circuitReadyOpenSwitch',[],'ok');
      info('circuit');next();if(S.sw)check()}
    else if(pot.lit&&!usesSwitch)fb('bulbConnectedNoSwitch',[],'');
    else if(src==='wire')fb('attachedCount',[attached(['Bpos','Bneg','L1','L2','S1','S2'])],'');
    return}
  if(S.step===2){
    if(r.lit&&!S.sawOn){S.sawOn=true;fb('bulbLitStep2',[],'ok');info('closedLoop')}
    else if(S.sawOn&&!r.lit&&!S.sw){fb('bulbOffStep2',[],'ok');info('openCircuit');next()}
    else if(src==='wire'&&!r.lit)fb('wireDisconnected',[],'bad');
    return}
  if(S.step===3){
    const pot=solve({sw:false,gap:true});
    if(pot.lit){fb('clipsReady',[],'ok');
      info('clips');next()}
    else if(src==='wire')fb('moveWiresToClips',[],'');
    return}
  if(S.step===4&&src==='mat'&&S.gap){
    const k=S.gap,m=MATS[k];S.tested[k]=r.lit;refreshNbRow(k);
    const p=S.pred[k];const pmKey=p===undefined?'':(p===m.c?'correct':'wrong');
    const cls=r.lit?'ok':(p===undefined||p===m.c?'':'bad');
    fb(r.lit?'matLit':'matNotLit',[k,pmKey],cls);
    info('material',[k]);
    const n=Object.keys(S.tested).length;if(n===Object.keys(MATS).length){fb('allTested',[],'ok');next()}
  }
}
I18N.ar.fb.matLit=(k,pm)=>T('mats.'+k+'.n')+': '+I18N.ar.fb.matLitVerb+(pm==='correct'?I18N.ar.fb.predCorrectSuffix:pm==='wrong'?I18N.ar.fb.predWrongSuffix:'');
I18N.ar.fb.matNotLit=(k,pm)=>T('mats.'+k+'.n')+': '+I18N.ar.fb.matNotLitVerb+(pm==='correct'?I18N.ar.fb.predCorrectSuffix:pm==='wrong'?I18N.ar.fb.predWrongSuffix:'');
I18N.en.fb.matLit=(k,pm)=>T('mats.'+k+'.n')+': '+I18N.en.fb.matLitVerb+(pm==='correct'?I18N.en.fb.predCorrectSuffix:pm==='wrong'?I18N.en.fb.predWrongSuffix:'');
I18N.en.fb.matNotLit=(k,pm)=>T('mats.'+k+'.n')+': '+I18N.en.fb.matNotLitVerb+(pm==='correct'?I18N.en.fb.predCorrectSuffix:pm==='wrong'?I18N.en.fb.predWrongSuffix:'');

/* ---------- pointer ---------- */
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
let drag=null;
function toggleSwitch(){S.sw=!S.sw;$('#blade').style.transform=S.sw?'rotate(0deg)':'rotate(-58deg)';
  if(S.step===0&&!S.sw){fb('openedSwitchOk',[],'ok');next();update();return}
  const st0=S.step;check('switch');if(S.step===st0&&S.step>2&&!S.short&&S.step!==4)fb(S.sw?'switchClosedMsg':'switchOpenMsg',[],'')}
stage.addEventListener('pointerdown',e=>{
  const p=pt(e);
  if(p.x>725&&p.x<885&&p.y>340&&p.y<420&&!nearEnd(p,14)){toggleSwitch();return}
  if(S.step===0){fb('switchClosedWarn',[],'bad');return}
  const ne=nearEnd(p,26);
  if(ne){drag={type:'wire',w:ne.w,k:ne.k};ne.w.e[ne.k].t=null;stage.setPointerCapture(e.pointerId);update();return}
  const mk=Object.keys(MATS).find(k=>Math.abs(p.x-S.mpos[k][0])<70&&Math.abs(p.y-S.mpos[k][1])<18);
  if(mk){if(S.step<4){fb('earlyMatLock',[],'');return}
    if(S.gap===mk){S.gap=null;update()}
    drag={type:'mat',k:mk,dx:S.mpos[mk][0]-p.x,dy:S.mpos[mk][1]-p.y};$('#mats').appendChild($(`[data-m="${mk}"]`));stage.setPointerCapture(e.pointerId)}
});
function nearEnd(p,r){let best=null,bd=r;S.wires.forEach(w=>w.e.forEach((e,k)=>{const d=Math.hypot(e.p[0]-p.x,e.p[1]-p.y);if(d<bd){bd=d;best={w,k}}}));return best}
stage.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);
  if(drag.type==='wire'){drag.w.e[drag.k].p=[Math.max(30,Math.min(970,p.x)),Math.max(30,Math.min(530,p.y))];renderWires()}
  else{S.mpos[drag.k]=[p.x+drag.dx,p.y+drag.dy];renderMats()}});
stage.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;
  if(d.type==='wire'){const end=d.w.e[d.k];let snap=null,bd=30;for(const t in TERM){const q=TERM[t],dd=Math.hypot(q[0]-end.p[0],q[1]-end.p[1]);if(dd<bd){bd=dd;snap=t}}
    if(snap){end.p=TERM[snap].slice();end.t=snap}renderWires();check('wire');
    if(snap&&S.step<5&&!S.short&&$('#fb').className==='feedback'&&S.step===4)fb('wireConnected',[T('wcol')[d.w.i],T('term')[snap]],'');return}
  const k=d.k,p=S.mpos[k];
  if(Math.hypot(p[0]-780,p[1]-250)<70){
    if(S.step===4&&S.pred[k]===undefined){fb('predFirst',[T('mats.'+k+'.n')],'bad');goHome(k);return}
    if(S.gap&&S.gap!==k)goHome(S.gap);S.gap=k;tween(150,t=>{S.mpos[k]=[p[0]+(780-p[0])*t,p[1]+(250-p[1])*t];renderMats()},()=>check('mat'))}
  else goHome(k);
});
function goHome(k){if(S.gap===k){S.gap=null;update()}const p=S.mpos[k].slice(),h=MATS[k].home;tween(300,t=>{S.mpos[k]=[p[0]+(h[0]-p[0])*t,p[1]+(h[1]-p[1])*t];renderMats()})}

/* ---------- notebook ---------- */
function buildNb(){
  $('#nb').innerHTML=Object.keys(MATS).map(k=>`<tr id="nb-${k}"><td id="nbn-${k}"></td><td><div class="seg" role="group" id="nbg-${k}"><button class="choice" aria-pressed="false" data-k="${k}" data-v="1"></button><button class="choice" aria-pressed="false" data-k="${k}" data-v="0"></button></div></td><td id="nbr-${k}" class="pending"></td></tr>`).join('');
  $$('#nb .choice').forEach(b=>b.onclick=()=>{if(S.tested[b.dataset.k]!==undefined)return;S.pred[b.dataset.k]=b.dataset.v==='1';$$(`#nbg-${b.dataset.k} .choice`).forEach(c=>c.setAttribute('aria-pressed',c===b))});
  refreshNb();
}
function refreshNbRow(k){
  const cell=$('#nbr-'+k);
  if(S.tested[k]===undefined){cell.className='pending';cell.textContent=T('pending')}
  else{cell.className='';cell.innerHTML=S.tested[k]?`<b style="color:var(--ok)">${T('predConductor')}</b> (${T('fb.bulbLitNote')})`:`<b style="color:var(--bad)">${T('predInsulator')}</b> (${T('fb.bulbNotLitNote')})`}
}
function refreshNb(){
  for(const k in MATS){
    $('#nbn-'+k).textContent=T('mats.'+k+'.n');
    $('#nbg-'+k).setAttribute('aria-label',T('predAriaPrefix')+T('mats.'+k+'.n'));
    const btns=$$('#nbg-'+k+' .choice');btns[0].textContent=T('predConductor');btns[1].textContent=T('predInsulator');
    refreshNbRow(k);
  }
}

/* ---------- quiz + report ---------- */
function buildQuiz(){
  $('#quiz').innerHTML=T('quiz').map((x,i)=>`<div class="q"><h3 id="qh${i}"></h3><div class="choices" id="qz${i}">${x.o.map((o,j)=>`<button class="choice" aria-pressed="false" data-i="${i}" data-j="${j}"></button>`).join('')}</div></div>`).join('');
  $$('#quiz .choice').forEach(b=>b.onclick=()=>{$$('#qz'+b.dataset.i+' .choice').forEach(c=>{c.setAttribute('aria-pressed',c===b);c.style.borderColor=''});S.quiz[b.dataset.i]=+b.dataset.j});
  refreshQuizText();
}
function refreshQuizText(){
  T('quiz').forEach((x,i)=>{$('#qh'+i).textContent=(i+1)+'. '+x.q;$$('#qz'+i+' .choice').forEach((b,j)=>b.textContent=x.o[j])});
}
$('#checkQuiz').onclick=()=>{const QUIZ=T('quiz');let s=0;QUIZ.forEach((x,i)=>{const p=S.quiz[i];$$('#qz'+i+' .choice').forEach((c,j)=>c.style.borderColor=(p!==undefined&&j===x.a)?'var(--ok)':(j===p?'var(--bad)':''));if(p===x.a)s++});$('#score').textContent=s+' / '+QUIZ.length};
$('#copyRep').onclick=()=>{
  const rp=T('report');
  const lines=[rp.title, rp.student($('#sname').value||rp.dash), rp.stepsCompleted(Math.min(S.step,5)), rp.shorts(S.shorts),
   ...Object.keys(MATS).map(k=>rp.matLine(T('mats.'+k+'.n'), S.pred[k]===undefined?rp.dash:(S.pred[k]?T('predConductor'):T('predInsulator')), S.tested[k]===undefined?rp.notTested:(S.tested[k]?T('predConductor'):T('predInsulator')))),
   rp.quizScore($('#score').textContent||rp.quizNotChecked), rp.conclusion($('#concl').value||rp.dash)].join('\n');
  const ta=$('#repTxt');ta.value=lines;
  navigator.clipboard.writeText(lines).then(()=>setCopyMsg('done')).catch(()=>{ta.hidden=false;ta.select();setCopyMsg('manual')});
};
$('#restart').onclick=()=>{resetState();
  $('#quizLock').hidden=false;$('#quiz').hidden=true;$('#quizBtns').hidden=true;draw();buildNb();buildQuiz();update();renderSteps();renderFb();renderInfo();setCopyMsg('default')};

/* ---------- i18n apply ---------- */
function applyLang(lang){
  LANG=lang;
  const de=document.documentElement;de.lang=lang;de.dir=lang==='ar'?'rtl':'ltr';
  $('#wrap').dir=lang==='ar'?'rtl':'ltr';$('#wrap').lang=lang;
  document.title=T('meta.title');
  document.querySelectorAll('[data-t]').forEach(el=>{const v=T(el.dataset.t);if(v!=null)el.textContent=v});
  $('#pageTag').innerHTML=T('pageTag');
  $('#concl').placeholder=T('conclPlaceholder');
  $('#sname').placeholder=T('snamePlaceholder');
  LS.set('lang',lang);
  draw();refreshNb();refreshQuizText();update();renderSteps();renderFb();renderInfo();setCopyMsg(S.copyMsgKey);
}
document.getElementById('langBtn').addEventListener('click',()=>applyLang(LANG==='ar'?'en':'ar'));

buildNb();buildQuiz();applyLang(LANG);
</script>
