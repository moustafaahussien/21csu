<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة الكتابة الصحيحة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#FBF1F5; --bg2:#F3E4EC; --surface:#FFFFFF; --ink:#2A1822; --muted:#6F5A66; --line:#EAD3DE;
  --accent:#E63E7C; --accent-ink:#FFFFFF; --accent-soft:#FDE3EE;
  --ok:#1F7A3E; --ok-bg:#DFF3E5; --bad:#B3261E; --bad-bg:#FCE4E1; --gold:#F2A900; --gold-soft:#FFF1C9;
  --shadow:0 6px 22px rgba(120,40,80,.10);
  --f-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1017; --bg2:#24151F; --surface:#2A1A24; --ink:#F6E8EF; --muted:#BFA3B2; --line:#46293A;
  --accent:#FF6B9F; --accent-ink:#2A0A17; --accent-soft:#4A1E32;
  --ok:#7CD79A; --ok-bg:#16301F; --bad:#FF9A92; --bad-bg:#3C1C1A; --gold:#FFC83D; --gold-soft:#3B3010;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1017; --bg2:#24151F; --surface:#2A1A24; --ink:#F6E8EF; --muted:#BFA3B2; --line:#46293A;
  --accent:#FF6B9F; --accent-ink:#2A0A17; --accent-soft:#4A1E32;
  --ok:#7CD79A; --ok-bg:#16301F; --bad:#FF9A92; --bad-bg:#3C1C1A; --gold:#FFC83D; --gold-soft:#3B3010;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 500px at 85% -10%,var(--accent-soft),transparent 60%),var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:17px;line-height:1.7;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:16px 48px;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800} h2{font-size:1.25rem} h3{font-size:1.06rem}
p{margin:0}
button{font:inherit;color:inherit}
.headTop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}
.tag{font-size:.9rem;color:var(--muted)} .tag b{color:var(--ink)}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--bg2);flex:none;margin-inline-start:8px;cursor:pointer}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--accent);color:var(--accent-ink)}
.hud{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow)}
.lvl{display:flex;align-items:center;gap:10px;min-width:0}
.lvl .badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--accent-ink);background:conic-gradient(var(--accent),var(--gold),var(--accent));flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.lvl small{color:var(--muted);display:block;font-size:.8rem;line-height:1.2}
.lvl b{font-family:var(--f-display);font-size:1.02rem}
.xpbar{flex:1;min-width:150px}
.bar{height:12px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .5s}
.xpbar small{color:var(--muted);font-size:.8rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.92rem;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 2px 0}
.sec-title p{color:var(--muted);font-size:.92rem}
.btn{border:0;border-radius:14px;padding:10px 20px;cursor:pointer;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* mastery map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.node{position:relative;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.node:hover{transform:translateY(-3px)}
.node::before{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:100px;height:100px;border-radius:50%;background:var(--c);opacity:.16}
.node .g{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.7rem;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.node h3{font-size:1.05rem}
.node .sub{font-size:.84rem;color:var(--muted);line-height:1.4}
.stars{display:flex;gap:2px;font-size:1.35rem;letter-spacing:1px;direction:ltr;justify-content:flex-start}
html[dir=rtl] .stars{justify-content:flex-end}
.stars .on{color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.2)} .stars .off{color:var(--line)}
.node.mix{--c:#7A3FE0;background:linear-gradient(135deg,var(--surface),var(--accent-soft))}
.node.det{--c:#0E8F8F}
.fill{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden}
.fill i{display:block;height:100%;background:var(--c);border-radius:99px}
/* station intro */
.hero{display:flex;gap:14px;align-items:center;border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:var(--shadow)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.hero p{opacity:.94;font-size:.95rem}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.rule{border:2px solid var(--line);border-inline-start:8px solid var(--c);border-radius:18px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
.rule.hl{border-color:var(--accent);border-inline-start-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pop .5s}
.rule .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:.85rem;margin-inline-end:8px;flex:none}
.rule h3{display:flex;align-items:center}
.rule .b{font-size:.96rem;color:var(--ink)}
.ex{display:flex;flex-wrap:wrap;gap:8px}
.exw{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:2px 10px;font-size:1.12rem;font-weight:600;background:var(--ok-bg);color:var(--ok)}
.exw s{color:var(--bad);font-weight:400;opacity:.9;font-size:1rem;text-decoration-thickness:2px}
.exw em{font-style:normal;font-size:.78rem;color:var(--muted);font-weight:400}
.viz{background:var(--bg2);border-radius:14px;padding:8px}
.viz svg{display:block;width:100%;height:auto}
/* quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hearts{font-size:1.4rem;letter-spacing:2px;direction:ltr}
.hearts .lost{filter:grayscale(1);opacity:.35}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--bg2);border:2px solid var(--line)}
.dots i.ok{background:var(--ok);border-color:var(--ok)} .dots i.bad{background:var(--bad);border-color:var(--bad)} .dots i.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lvtag{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--gold-soft);color:var(--ink);white-space:nowrap}
.stem{font-size:clamp(1.35rem,3.6vw,1.9rem);font-weight:600;line-height:2;text-align:center;padding:14px 8px;font-family:var(--f-display)}
.gap{display:inline-block;min-width:4.2em;padding:0 10px;border-bottom:4px dashed var(--accent);border-radius:8px;color:var(--accent);margin-inline:4px;transition:all .2s}
.gap.ok{border-bottom:4px solid var(--ok);color:var(--ok);background:var(--ok-bg)}
.gap.bad{border-bottom:4px solid var(--bad);color:var(--bad);background:var(--bad-bg)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.opt{border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 10px;font-size:1.7rem;font-weight:700;cursor:pointer;font-family:var(--f-display);box-shadow:0 4px 0 var(--line);transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.fb{border-radius:16px;padding:12px 16px;font-size:1rem}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block;font-size:1.08rem;margin-bottom:2px}
.fb .why{color:var(--ink)}
.tip{background:var(--gold-soft);border-radius:14px;padding:8px 14px;font-size:.92rem}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
/* results */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.res .bigstars{font-size:3rem;direction:ltr}
.weak{width:100%;display:flex;flex-direction:column;gap:8px;text-align:start}
.wk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--bg)}
.wk .n{background:var(--bad-bg);color:var(--bad);font-weight:800;border-radius:999px;padding:0 10px}
.wk b{flex:1;min-width:140px}
/* detective */
.para{font-size:clamp(1.2rem,3vw,1.5rem);line-height:2.5;font-family:var(--f-display);font-weight:500;padding:6px 4px}
.w{display:inline-block;border-radius:10px;padding:0 5px;cursor:pointer;border:2px solid transparent;background:none;font:inherit;color:inherit}
.w:hover{background:var(--accent-soft)}
.w.sel{border-color:var(--accent);background:var(--accent-soft)}
.w.fixed{background:var(--ok-bg);color:var(--ok);cursor:default;border-color:var(--ok)}
.w.miss{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.w.fa{animation:shake .4s;background:var(--bad-bg)}
.fixbox{border:2px dashed var(--accent);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--accent-soft)}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dl{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px}
.dl:hover{border-color:var(--accent)}
.dl.done{border-color:var(--ok);background:var(--ok-bg)}
.dl b{font-family:var(--f-display)}
.dl small{color:var(--muted)}
.found{display:flex;flex-direction:column;gap:6px}
.found div{border-inline-start:5px solid var(--ok);background:var(--bg);border-radius:10px;padding:6px 12px;font-size:.95rem}
/* report */
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical;margin-top:8px}
.lock{color:var(--muted);font-size:.92rem}
.pill{display:inline-block;border-radius:999px;padding:0 10px;background:var(--bg2);font-size:.85rem;color:var(--muted)}
.toast{position:fixed;inset-inline:0;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:9}
.toast span{background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 20px;font-weight:700;animation:pop .4s;box-shadow:var(--shadow)}
@media (max-width:560px){body{font-size:16px}.hero .big{width:64px;height:64px;font-size:2.4rem}.rules{grid-template-columns:1fr}.opt{font-size:1.45rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">
  <header>
    <div class="headTop">
      <a href="../index.html" class="back" id="backLink">&#10229; العودة إلى المعامل الافتراضية</a>
      <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>

<p id="footerCopyright" style="text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line);"></p>
</div>
