<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأساليب وعلامات الترقيم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a "sentence workbench" — mode tabs, a wooden bench with the sentence on a paper strip, tool chips on a rack, notebook/report below */
:root{
  --bg:#F3EDE8; --surface:#FFFFFF; --ink:#2A1F26; --muted:#6B5C66; --line:#E3D6D9;
  --accent:#E63E7C; --accent-ink:#FFFFFF; --accent-soft:#FDE4EE; --steel:#8A2650;
  --ok:#237A3B; --ok-bg:#E0F2E4; --bad:#B3302A; --bad-bg:#FBE3E0; --warn-bg:#FFF2CC; --warn:#7A5600;
  --hl:#FFE27A; --hl-ink:#3A2A00; --punc:#D4156A;
  --wood1:#8C5A34; --wood2:#6A3F20; --paper:#FFFDF6; --paper-ink:#2A1F26; --paper-line:#E8DFC8;
  --f-display:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-text:"Amiri","Traditional Arabic","Scheherazade New","Tajawal",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1318; --surface:#271B22; --ink:#F3E8EE; --muted:#B5A2AD; --line:#40303A;
  --accent:#FF5C9A; --accent-ink:#2A0A18; --accent-soft:#3F1B2D; --steel:#FF9CC2;
  --ok:#7CD08F; --ok-bg:#1C3324; --bad:#FF9A92; --bad-bg:#3C1D1B; --warn-bg:#3A3010; --warn:#F2D27A;
  --hl:#5A4A10; --hl-ink:#FFF0B0; --punc:#FF7DB4;
  --wood1:#4A2F1B; --wood2:#33200F; --paper:#2F2229; --paper-ink:#F6EDF1; --paper-line:#4A3842; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem)} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.headTop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--accent)}
.tag{font-size:.88rem;color:var(--muted)} .tag b{color:var(--ink)}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--line);flex:none;margin-inline-start:8px;cursor:pointer;font:inherit}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--accent);color:var(--accent-ink)}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px}
.tab{font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab small{font-weight:500;opacity:.85}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:.92rem}
.stats span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.stats b{font-family:var(--f-display);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lock{color:var(--muted);font-size:.92rem}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.92rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.task .num{font-family:var(--f-display);background:var(--steel);color:var(--surface);border-radius:10px;padding:2px 12px;white-space:nowrap;font-size:.92rem}
.task p{flex:1;min-width:200px;font-weight:700}
.feedback{border-radius:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);min-height:48px}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.feedback.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.feedback.info{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.feedback b{font-weight:800}
/* workbench */
.bench{background:linear-gradient(180deg,var(--wood1),var(--wood2));border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);position:relative}
.bench::before{content:"";position:absolute;inset:0;border-radius:20px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px);pointer-events:none}
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 20px;box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 18px rgba(0,0,0,.3);
  }
.paper .lbl{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sent{font-family:var(--f-text);font-size:clamp(1.7rem,4.8vw,2.5rem);line-height:2.1;min-height:3.2em;word-spacing:.12em;display:flex;flex-wrap:wrap;gap:0 .32em;align-items:baseline;direction:rtl}
.w{display:inline-block;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .35s,background .3s;border-radius:6px;padding:0 .1em}
.w.in{animation:wIn .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes wIn{from{opacity:0;transform:translateY(-.8em) scale(.8)}to{opacity:1;transform:none}}
.w.tool{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 2px var(--hl)}
.w.punc{color:var(--punc);font-weight:700;font-size:1.1em;background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft);margin-inline-start:-.26em;padding:0 .06em}
.w.chg{border-bottom:3px solid var(--accent)}
.w.gone{opacity:.25;text-decoration:line-through;transform:translateY(.25em)}
.w.plain{opacity:.95}
.arrow{align-self:center;font-size:1.4rem;color:#fff;opacity:.85}
.rackLbl{color:#F6E7D6;font-size:.86rem;font-weight:700;opacity:.95}
.rack{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;font-size:.98rem;border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 14px;cursor:pointer;color:#fff;background:rgba(0,0,0,.28);display:inline-flex;align-items:center;gap:6px;transition:transform .15s,background .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:#fff;color:var(--accent-ink)}
.chip:disabled{opacity:.35;cursor:not-allowed;transform:none}
.chip .sym{font-family:var(--f-text);font-size:1.15em;line-height:1}
.expl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.expl{grid-template-columns:1fr}}
.diff{display:flex;flex-direction:column;gap:6px;font-size:.98rem}
.diff .k{display:inline-block;min-width:1.4em;padding:0 8px;border-radius:8px;font-weight:700}
.k.t{background:var(--hl);color:var(--hl-ink)} .k.p{background:var(--accent-soft);color:var(--punc)}
.ar-txt{font-family:var(--f-text);font-size:1.25em}
/* quiz chips */
.slots{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:12px;align-items:center;direction:rtl;background:var(--paper)}
.slots.over,.pool.over{border-color:var(--accent);background:var(--accent-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:12px;background:rgba(0,0,0,.18);direction:rtl}
.wc{font-family:var(--f-text);font-size:1.5rem;line-height:1.5;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:2px 12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.wc.sel{border-color:var(--accent);background:var(--accent-soft)}
.wc.ok{border-color:var(--ok);background:var(--ok-bg)} .wc.bad{border-color:var(--bad);background:var(--bad-bg)}
.wc.drag{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:rotate(-3deg)}
.nums{font-size:.82rem;color:var(--muted)}
/* punctuation */
.ptext{font-family:var(--f-text);font-size:clamp(1.45rem,3.8vw,2rem);line-height:2.5;direction:rtl;display:flex;flex-wrap:wrap;gap:0 .3em;align-items:baseline}
.gap{font:inherit;font-family:var(--f-text);display:inline-flex;min-width:1.15em;height:1.5em;align-items:center;justify-content:center;border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:8px;background:transparent;color:var(--punc);font-weight:700;cursor:pointer;padding:0 2px;margin:0 -.05em;vertical-align:middle;font-size:.95em}
.gap:hover{background:var(--accent-soft)}
.gap.cur{border-style:solid;background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.gap.filled{border-style:solid;border-color:var(--line);background:var(--accent-soft)}
.gap.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.gap.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.gap.miss{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);border-style:dashed}
.gap.free{border-color:transparent;opacity:.0;min-width:.2em;width:.2em;pointer-events:none}
.gapok{border-radius:8px;padding:0 .12em;color:var(--punc);font-weight:700}
.pal{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;position:sticky;bottom:8px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.pal .chip{background:var(--bg);color:var(--ink);border-color:var(--line);min-width:46px;justify-content:center;font-size:1.2rem}
.pal .chip small{font-family:var(--f-body);font-size:.68rem;font-weight:500;color:var(--muted)}
.pal .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pal .chip[aria-pressed="true"] small{color:var(--accent-ink)}
.rulecard{border-radius:14px;border:2px solid var(--bad);background:var(--bad-bg);padding:10px 14px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.rulecard h3{color:var(--bad)}
.rulecard .ex{font-family:var(--f-text);font-size:1.3rem}
.rulecard.good{border-color:var(--ok);background:var(--ok-bg)} .rulecard.good h3{color:var(--ok)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.rules .rc{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);font-size:.95rem}
.rules .rc b{color:var(--accent);font-family:var(--f-text);font-size:1.3rem;margin-inline-end:6px}
.demo{display:flex;flex-wrap:wrap;gap:8px}
.demoBtn{font-family:var(--f-text);font-size:1.5rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:2px 16px;cursor:pointer}
.demoBtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* cloze */
.cloze{font-family:var(--f-text);font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:2.4;direction:rtl}
.blank{font:inherit;font-family:var(--f-text);font-size:.92em;min-width:4.2em;border:2px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--ink);padding:0 .5em;cursor:pointer;vertical-align:baseline;line-height:1.6}
.blank.cur{border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.blank.ok{border-color:var(--ok);background:var(--ok-bg)} .blank.bad{border-color:var(--bad);background:var(--bad-bg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-family:var(--f-text);font-size:1.35rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:2px 16px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.lv{display:flex;gap:6px;flex-wrap:wrap}
.levelBadge{display:inline-block;font-size:.78rem;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--steel);font-weight:700}
.explItem{border-top:1px solid var(--line);padding-top:8px;font-size:.98rem}
.explItem:first-child{border-top:0;padding-top:0}
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.score{font-family:var(--f-display);font-size:1.15rem}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.repGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.repGrid div{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:.92rem}
.repGrid b{display:block;font-family:var(--f-display);font-size:1.2rem;color:var(--accent)}
@media (max-width:560px){.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{flex-direction:column;gap:0;padding:8px 4px;text-align:center;font-size:.88rem;line-height:1.3;justify-content:center}.tab small{display:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="headTop">
      <a class="back" href="../index.html" id="backLink">&#10230; العودة إلى المعامل الافتراضية</a>
      <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
    </div>
    <h1 id="pageH1"></h1>
    <p class="tag" id="tagP"></p>
  </header>

  <div class="topbar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="stats" id="stats"></div>
  </div>

  <section id="modeA" hidden>
    <div class="card" style="gap:12px">
      <div class="row" style="justify-content:space-between">
        <div class="seg" id="aSub" role="group"></div>
        <div class="seg" id="aLevel" role="group"></div>
      </div>
      <div class="task"><span class="num" id="aNum"></span><p id="aTask"></p></div>
    </div>
    <div class="bench" id="aBench" style="margin-top:14px">
      <div class="paper"><div class="lbl"><span id="aBaseLbl"></span><span id="aBaseInfo"></span></div><div class="sent" id="aBase" aria-live="polite"></div></div>
      <div class="rackLbl" id="aRackLbl"></div>
      <div class="rack" id="aRack"></div>
      <div id="aOutWrap"><div class="paper"><div class="lbl"><span id="aOutLbl"></span><span id="aOutStyle"></span></div><div class="sent" id="aOut" aria-live="polite"></div></div></div>
      <div id="aQuizWrap" hidden>
        <div class="paper"><div class="lbl"><span id="aQLbl"></span></div><div class="slots" id="aSlots"></div></div>
        <div class="rackLbl" style="margin-top:10px" id="aPoolLbl"></div>
        <div class="pool" id="aPool"></div>
        <div class="row" style="margin-top:10px"><button class="btn" id="aCheck"></button><button class="btn ghost" id="aHint" style="background:rgba(0,0,0,.3);color:#fff;border-color:rgba(255,255,255,.3)"></button><button class="btn ghost" id="aReset" style="background:rgba(0,0,0,.3);color:#fff;border-color:rgba(255,255,255,.3)"></button><button class="btn" id="aNext" hidden></button></div>
      </div>
    </div>
    <div class="feedback" id="aFb" aria-live="polite" style="margin-top:14px"></div>
    <div class="expl" style="margin-top:14px" id="aExplWrap">
      <div class="card"><h3 id="aWhatH"></h3><div class="diff" id="aDiff"></div></div>
      <div class="card"><h3 id="aWhyH"></h3><div id="aWhy"></div></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="aPrev"></button><button class="btn" id="aNextBase"></button><span class="nums" id="aCount"></span></div>
  </section>

  <section id="modeB" hidden>
    <div class="card" style="gap:12px">
      <div class="row" style="justify-content:space-between">
        <div class="seg" id="bSub" role="group"></div>
        <div class="seg" id="bLevel" role="group"></div>
      </div>
      <div class="task"><span class="num" id="bNum"></span><p id="bTask"></p></div>
    </div>
    <div id="bLab" style="margin-top:14px;display:flex;flex-direction:column;gap:12px">
      <div class="bench">
        <div class="paper"><div class="lbl"><span id="bTitle"></span><span id="bInfo"></span></div><div class="ptext" id="bText"></div></div>
      </div>
      <div class="pal" id="bPal" role="toolbar"></div>
      <div class="row"><button class="btn" id="bCheck"></button><button class="btn ghost" id="bHint"></button><button class="btn ghost" id="bClear"></button><button class="btn" id="bNext" hidden></button></div>
      <div class="feedback" id="bFb" aria-live="polite"></div>
      <div id="bRule"></div>
    </div>
    <div id="bDemo" hidden style="margin-top:14px"></div>
    <div class="card" style="margin-top:14px"><h2 id="bRulesH"></h2><div class="rules" id="bRules"></div></div>
  </section>

  <section id="modeC" hidden>
    <div class="card" style="gap:12px">
      <div class="row" style="justify-content:space-between">
        <div class="seg" id="cLevel" role="group"></div>
        <span class="nums" id="cCount"></span>
      </div>
      <div class="task"><span class="num" id="cNum"></span><p id="cTask"></p></div>
    </div>
    <div class="bench" style="margin-top:14px"><div class="paper"><div class="lbl"><span id="cTitle"></span><span id="cInfo"></span></div><div class="cloze" id="cText"></div></div></div>
    <div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h3 id="cOptH"></h3><span class="nums" id="cBlankInfo"></span></div><div class="opts" id="cOpts"></div></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="cCheck"></button><button class="btn ghost" id="cHint"></button><button class="btn ghost" id="cReset"></button><button class="btn" id="cNext" hidden></button></div>
    <div class="feedback" id="cFb" aria-live="polite" style="margin-top:12px"></div>
    <div class="card" style="margin-top:12px" id="cExplCard" hidden><h3 id="cExplH"></h3><div id="cExpl"></div></div>
  </section>

  <div class="card" id="reportCard">
    <h2 id="repH"></h2>
    <div class="repGrid" id="repGrid"></div>
    <div class="bar"><i id="repBar"></i></div>
    <div class="row"><input type="text" id="sname" style="flex:1;width:auto;min-width:200px"><button class="btn" id="copyRep"></button><button class="btn ghost" id="resetAll"></button></div>
    <p class="lock" id="copyMsg"></p>
    <textarea id="repTxt" readonly hidden></textarea>
  </div>
<p id="footerCopyright" style="text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line);"></p>
