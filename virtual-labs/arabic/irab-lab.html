<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر الإعراب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: header -> level & sentence picker -> parsing stage (word cards) -> banks (roles / signs) -> i'rab detail -> transformation lab -> report */
:root{
  --bg:#F4EEF1; --surface:#FFFFFF; --ink:#2A1F26; --muted:#6B5A64; --line:#E3D5DC;
  --steel:#8E2452; --accent:#E63E7C; --btn:#C42A64; --btn-ink:#FFFFFF;
  --ok:#2E7D3B; --ok-bg:#E1F2E3; --bad:#B4372F; --bad-bg:#FBE3E0; --warn-bg:#FFF2D6; --warn:#8A5A00;
  --c-v:#2F6DB5; --c-raf:#2E7D3B; --c-nasb:#B8620A; --c-jar:#7B4FB5; --c-na3t:#0F7F80; --c-part:#5A6873; --c-mawsul:#C0307A;
  --f-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic","IBM Plex Sans Arabic","Tajawal",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171117; --surface:#231A21; --ink:#F2E8EE; --muted:#B2A0AB; --line:#3A2C36;
  --steel:#F27FAB; --accent:#F26B9F; --btn:#E63E7C; --btn-ink:#FFFFFF;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C; --warn-bg:#3A2D12; --warn:#F2B13F;
  --c-v:#7FB2EE; --c-raf:#7CC786; --c-nasb:#F2B13F; --c-jar:#BC9AEE; --c-na3t:#5FD1CF; --c-part:#A9B7C1; --c-mawsul:#F28DB9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171117; --surface:#231A21; --ink:#F2E8EE; --muted:#B2A0AB; --line:#3A2C36;
  --steel:#F27FAB; --accent:#F26B9F; --btn:#E63E7C; --btn-ink:#FFFFFF;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C; --warn-bg:#3A2D12; --warn:#F2B13F;
  --c-v:#7FB2EE; --c-raf:#7CC786; --c-nasb:#F2B13F; --c-jar:#BC9AEE; --c-na3t:#5FD1CF; --c-part:#A9B7C1; --c-mawsul:#F28DB9; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--steel)} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.headTop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#backLink{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);text-decoration:none;margin-bottom:6px}
#backLink:hover{color:var(--accent)}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--surface);flex:none;margin-inline-start:8px;font:inherit}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s;cursor:pointer}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--btn);color:var(--btn-ink)}
.tag{font-size:.9rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lock{color:var(--muted);font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* levels */
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvl{font:inherit;text-align:start;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lvl b{font-family:var(--f-display);font-size:1.02rem}
.lvl small{color:var(--muted);font-size:.8rem;line-height:1.4}
.lvl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.lvl .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.lvl .bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:640px){.levels{grid-template-columns:1fr}}
.sents{display:flex;flex-wrap:wrap;gap:6px}
.sn{font:inherit;min-width:40px;height:38px;padding:0 8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-weight:700;position:relative}
.sn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.sn.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.sn.rev{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.sn.fam::after{content:"⇄";font-size:.65rem;position:absolute;top:-1px;inset-inline-end:3px;color:var(--accent)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.2}
.stat span{font-size:.78rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* task + feedback */
.task{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.task .num{font-family:var(--f-display);background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:1px 12px;white-space:nowrap}
.task p{flex:1;min-width:200px;font-weight:600}
.feedback{border-radius:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);min-height:56px;line-height:1.75}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.feedback.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.feedback.info{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.feedback .ar{font-family:var(--f-ar);font-size:1.15em}
/* stage: word cards */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 12px;
  background-image:radial-gradient(circle at 90% 0%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 55%)}
.words{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;direction:rtl}
.wc{--gc:var(--muted);font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-width:96px;padding:10px 14px 8px;border-radius:16px;border:2px solid var(--line);background:var(--bg);transition:transform .15s,box-shadow .15s}
.wc .t{font-family:var(--f-ar);font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.5;white-space:nowrap}
.wc .r,.wc .s{font-size:.82rem;min-height:1.3em;color:var(--muted);line-height:1.3;max-width:150px;text-align:center}
.wc.sel{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent);transform:translateY(-2px)}
.wc.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg));transform:scale(1.04)}
.wc.rok{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 10%,var(--surface))}
.wc.rok .r{color:var(--gc);font-weight:700}
.wc.done{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 17%,var(--surface))}
.wc.done .s{color:var(--ink)}
.wc.rev{border-style:dashed}
.wc{position:relative}
.wc .chgdot{position:absolute;top:-8px;inset-inline-start:-6px;background:var(--accent);color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:0 7px;line-height:1.6}
.wc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wc[data-g="v"]{--gc:var(--c-v)}.wc[data-g="raf"]{--gc:var(--c-raf)}.wc[data-g="nasb"]{--gc:var(--c-nasb)}.wc[data-g="jar"]{--gc:var(--c-jar)}
.wc[data-g="na3t"]{--gc:var(--c-na3t)}.wc[data-g="part"]{--gc:var(--c-part)}.wc[data-g="mawsul"]{--gc:var(--c-mawsul)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;background:var(--gc);margin-inline-end:4px;vertical-align:-1px}
.tr{text-align:center;color:var(--muted);font-size:.92rem;margin-top:10px;direction:ltr}
html[lang="ar"] .tr{direction:ltr}
/* banks */
.bank{display:flex;flex-direction:column;gap:8px}
.bank.off{opacity:.5}
.bank .gh{font-size:.82rem;color:var(--muted);font-weight:700;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--gc:var(--muted);font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-inline-start:6px solid var(--gc);border-radius:12px;padding:5px 12px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1.4;text-align:start}
.chip small{display:block;font-weight:400;font-size:.76rem;color:var(--muted)}
.chip:hover{border-color:var(--accent)}
.chip.dim{opacity:.3}
.chip[data-g="v"]{--gc:var(--c-v)}.chip[data-g="raf"]{--gc:var(--c-raf)}.chip[data-g="nasb"]{--gc:var(--c-nasb)}.chip[data-g="jar"]{--gc:var(--c-jar)}
.chip[data-g="na3t"]{--gc:var(--c-na3t)}.chip[data-g="part"]{--gc:var(--c-part)}.chip[data-g="mawsul"]{--gc:var(--c-mawsul)}
.chip.sg{border-inline-start-width:2px}
.ghost-chip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:5px 14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:translate(-50%,-120%)}
.step{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.step b{font-family:var(--f-ar);font-size:1.3rem}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
/* detail */
.irab{font-family:var(--f-ar);font-size:1.3rem;line-height:1.8;color:var(--ink)}
.gloss{color:var(--muted);font-size:.92rem;direction:ltr;text-align:start}
html[lang="ar"] .gloss{text-align:right}
.why{border-inline-start:4px solid var(--accent);padding:2px 12px;background:var(--bg);border-radius:8px}
.full{display:flex;flex-direction:column;gap:8px}
.full .fi{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.full .fi:first-child{border-top:0}
.full .fi .t{font-family:var(--f-ar);font-size:1.5rem;white-space:nowrap}
.full .fi .p{font-family:var(--f-ar);font-size:1.12rem;line-height:1.7}
.full .fi .w{grid-column:2;font-size:.88rem;color:var(--muted)}
/* transformation lab */
.tfl{border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.tfb{display:flex;flex-wrap:wrap;gap:8px}
.tfb .tb{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 14px;cursor:pointer}
.tfb .tb[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tfb .tb.dn::before{content:"✓ ";color:var(--ok)}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp .ci{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cmp .ci .a{font-family:var(--f-ar);font-size:1.02rem;line-height:1.6}
.cmp .ci .a b{display:block;font-size:1.3rem}
.cmp .ci .arrow{color:var(--accent);font-size:1.4rem;font-weight:700}
html[dir="rtl"] .cmp .ci .arrow{transform:scaleX(-1)}
@media (max-width:560px){.cmp .ci{grid-template-columns:1fr}.cmp .ci .arrow{transform:rotate(90deg)!important;text-align:center}}
/* report */
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:.85rem}
.tblw{overflow-x:auto}
input[type=text],textarea{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="headTop">
      <a href="../index.html" id="backLink"></a>
      <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
    </div>
    <h1 id="h1"></h1>
    <p class="tag" id="tag"></p>
  </header>

  <section class="card" id="pick" aria-label="levels">
    <div class="levels" id="levels"></div>
    <div class="row"><b id="sentLbl"></b></div>
    <div class="sents" id="sents"></div>
  </section>

  <div class="stats" id="stats"></div>

  <div class="card task"><span class="num" id="taskNum"></span><p id="taskTxt"></p></div>
  <div class="feedback" id="fb" aria-live="polite"></div>

  <section class="stage" id="stage">
    <div class="words" id="words"></div>
    <div class="tr" id="trans"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="row" id="acts"></div>

  <div class="cols">
    <section class="card" id="bankCard">
      <div class="step" id="stepBar"></div>
      <div class="bank" id="roleBank"></div>
      <div class="bank" id="signBank"></div>
    </section>
    <section class="card" id="detail"></section>
  </div>

  <section class="card full" id="fullBox" hidden></section>

  <section class="card tfl" id="tfl"></section>

  <section class="card" id="rep">
    <h2 id="repH"></h2>
    <div class="tblw" id="repTbl"></div>
    <p class="lock" id="repWeak"></p>
    <div class="row"><input type="text" id="sname" style="flex:1;min-width:180px;width:auto"><button class="btn" id="copyRep" type="button"></button><button class="btn ghost" id="resetAll" type="button"></button></div>
    <p class="lock" id="copyMsg"></p>
    <textarea id="repTxt" readonly hidden></textarea>
  </section>
<p id="footerCopyright" style="text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line);"></p>
</div>
