<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة الحركات والتشكيل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: header -> level tabs -> item chips -> task -> board (big vowelled text) -> palette -> feedback -> Meaning Switch -> report */
:root{
  --bg:#E9EEF2; --surface:#FFFFFF; --ink:#1B2731; --muted:#5A6873; --line:#CED8E0;
  --steel:#3D5A73; --accent:#E63E7C; --accent-ink:#FFFFFF; --accent-soft:#FBE3EC;
  --ok:#2E7D3B; --ok-bg:#E1F2E3; --bad:#B4372F; --bad-bg:#FBE3E0; --warn:#9A6200; --warn-bg:#FFF1D6;
  --f-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-text:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic","Geeza Pro","Segoe UI","DejaVu Sans",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F0679A; --accent-ink:#2A0A16; --accent-soft:#3A1B28;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C; --warn:#F2B13F; --warn-bg:#352A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F0679A; --accent-ink:#2A0A16; --accent-soft:#3A1B28;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C; --warn:#F2B13F; --warn-bg:#352A14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(1.55rem,3.8vw,2.2rem);font-weight:800} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.headTop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--accent)}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--surface);flex:none;margin-inline-start:8px;cursor:pointer;font:inherit}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--steel);color:var(--surface)}
.tag{font-size:.9rem;color:var(--muted)} .tag b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lock{color:var(--muted);font-size:.92rem}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,#board:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text]{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%}
/* levels + chips */
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lv{font:inherit;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.lv b{font-family:var(--f-display);font-size:1.02rem}
.lv small{color:var(--muted);font-size:.82rem;line-height:1.4}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lv .sc{font-weight:700;color:var(--accent);font-size:.85rem}
@media (max-width:640px){.levels{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.88rem;font-weight:700;min-width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:0 6px}
.chip[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.chip.g{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.m{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.r{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.g[aria-current="true"],.chip.m[aria-current="true"],.chip.r[aria-current="true"]{border-color:var(--accent)}
/* task */
.task{display:flex;flex-direction:column;gap:6px}
.cat{align-self:flex-start;font-size:.8rem;font-weight:700;background:var(--steel);color:var(--surface);border-radius:999px;padding:1px 12px}
.task .ins{font-weight:700}
.target{background:var(--accent-soft);border-radius:10px;padding:6px 12px;font-size:.98rem}
.target b{color:var(--accent)}
/* board */
.boardCard{padding:10px 12px}
.board{font-family:var(--f-text);font-size:clamp(2.3rem,7.4vw,3.7rem);line-height:2.7;text-align:center;padding:10px 4px 22px;outline-offset:-2px;border-radius:12px;overflow-wrap:anywhere;font-feature-settings:"rlig" 0,"liga" 0,"calt" 1;direction:rtl}
.board .ln{display:block}
.w{display:inline-block;white-space:nowrap;margin-inline:.16em}
.u{position:relative;border-radius:8px}
.u.can{cursor:pointer;border-bottom:3px dotted color-mix(in srgb,var(--accent) 55%,transparent)}
.u.can.has{border-bottom-color:transparent}
.u.can:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.u.sel{background:color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:0 0 0 3px var(--accent);z-index:1}
.u.drop{background:color-mix(in srgb,var(--accent) 38%,transparent);box-shadow:0 0 0 3px var(--accent)}
.u.fix{color:var(--ink)}
.u.mine{color:var(--accent)}
.u.ok{color:var(--ok);background:var(--ok-bg)}
.u.bad{color:var(--bad);background:var(--bad-bg)}
.u.hint{color:var(--warn);background:var(--warn-bg)}
.u.extra{background:var(--warn-bg)}
.u.bad::after{content:attr(data-ans);position:absolute;inset-inline-start:50%;transform:translateX(50%);top:76%;font-size:.34em;line-height:1.6;color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:0 .35em;white-space:nowrap;font-family:var(--f-text);z-index:2;pointer-events:none}
html[dir="ltr"] .u.bad::after{transform:translateX(-50%)}
.board.flipping .u{color:var(--steel);background:transparent}
.flipBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.92rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:4px}
/* palette */
.pal{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.key{position:relative;font:inherit;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:4px 4px 6px;cursor:grab;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:border-color .15s,background .15s}
.key:hover{border-color:var(--accent)}
.key:active{background:var(--accent-soft)}
.key .g{font-family:var(--f-text);font-size:2.3rem;line-height:1.5;direction:rtl}
.key .n{font-size:.78rem;font-weight:700;line-height:1.25;text-align:center}
.key .k{position:absolute;top:3px;inset-inline-start:6px;font-size:.68rem;color:var(--muted);font-weight:700}
.key.on{border-color:var(--accent);background:var(--accent-soft)}
.key:disabled{opacity:.5;cursor:not-allowed}
#ghost{position:fixed;z-index:50;pointer-events:none;display:none;font-family:var(--f-text);font-size:3rem;line-height:1;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:6px 14px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:translate(-50%,-130%)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.hintCnt{font-size:.85rem;color:var(--muted)}
.scaf{display:flex;gap:8px;align-items:center;font-size:.92rem}
.scaf input{width:18px;height:18px;accent-color:var(--accent)}
.liveInfo{font-size:.95rem;background:var(--bg);border-radius:10px;padding:6px 12px;min-height:44px}
.liveInfo b{color:var(--accent)}
/* feedback */
.feedback{border-radius:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--ok-bg);border-color:transparent}
.feedback.mid{background:var(--warn-bg);border-color:transparent}
.feedback.bad{background:var(--bad-bg);border-color:transparent}
.feedback .big{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.feedback.ok .big{color:var(--ok)} .feedback.mid .big{color:var(--warn)} .feedback.bad .big{color:var(--bad)}
.why{font-size:1rem}
.why .rule{font-weight:700;color:var(--steel)}
/* meaning switch */
.ms h2{display:flex;align-items:center;gap:8px}
.ms h2 em{font-style:normal;font-size:.78rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.vc{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.vc.cur{border-color:var(--accent);background:var(--accent-soft)}
.vc .vt{font-family:var(--f-text);font-size:1.9rem;line-height:2.1;text-align:center;direction:rtl}
.vc .vm{font-size:.95rem}
.vc .tags{display:flex;gap:6px;flex-wrap:wrap}
.vc .tags span{font-size:.74rem;font-weight:700;border-radius:999px;padding:0 9px}
.t-target{background:var(--ok-bg);color:var(--ok)} .t-mine{background:var(--accent);color:var(--accent-ink)} .t-flip{background:var(--warn-bg);color:var(--warn)}
.liveMean{border-radius:12px;padding:10px 14px;background:var(--accent-soft);font-size:1rem}
.liveMean .vt{font-family:var(--f-text);font-size:1.7rem;line-height:2;direction:rtl;display:block;text-align:center}
.liveMean.none{background:var(--bad-bg);color:var(--bad)}
.liveMean.wait{background:var(--bg);color:var(--muted)}
/* report */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.82rem}
.bar{height:10px;border-radius:6px;background:var(--bg);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
.score{font-family:var(--f-display);font-size:1.4rem;font-weight:800}
textarea{font:inherit;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%;min-height:120px}
@media (max-width:520px){
  .card{padding:12px}
  .key .g{font-size:1.9rem}
  .pal{grid-template-columns:repeat(3,minmax(0,1fr))}
  .u.can{padding-block:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="headTop">
      <a href="../index.html" id="backLink" class="back">&#10229; العودة إلى المعامل الافتراضية</a>
      <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
    </div>
    <h1 id="pageH1">ورشة الحركات والتشكيل</h1>
    <p class="tag" id="tagP"></p>
  </header>

  <nav class="levels" id="levels" aria-label="levels"></nav>
  <div class="chips" id="chips" role="list"></div>

  <section class="card task" id="task"></section>

  <section class="card boardCard">
    <div class="board" id="board" tabindex="0" role="application" aria-label="board"></div>
    <div class="flipBar" id="flipBar" hidden></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card" id="paletteCard">
    <div class="row" style="justify-content:space-between"><h3 id="palH">لوحة الحركات</h3><span class="lock" id="palHelp"></span></div>
    <div class="pal" id="pal" role="toolbar"></div>
    <div class="liveInfo" id="liveInfo" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="feedback" id="fb" aria-live="polite"></section>
  <section class="card ms" id="ms"></section>

  <section class="card" id="report">
    <h2 id="repH">بطاقة النتائج</h2>
    <div id="repBody"></div>
    <div class="row"><input type="text" id="sname" style="flex:1;width:auto;min-width:160px"><button class="btn" id="copyRep" type="button"></button><button class="btn ghost" id="resetAll" type="button"></button></div>
    <p class="lock" id="copyMsg"></p>
    <textarea id="repTxt" readonly hidden></textarea>
  </section>
<p id="footerCopyright" style="text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line);"></p>
</div>
<div id="ghost" aria-hidden="true"></div>
