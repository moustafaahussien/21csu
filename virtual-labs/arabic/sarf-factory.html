<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصنع الصرف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: top bar (back + language), tabs, then one panel per mode. The factory panel = root picker, pattern grid, machine stage, info card, derivation tree. */
:root{
  --bg:#E9EEF2; --surface:#FFFFFF; --ink:#1B2731; --muted:#5A6873; --line:#CED8E0;
  --steel:#3D5A73; --accent:#E63E7C; --accent-ink:#FFFFFF; --accent-soft:#FCE3EC;
  --ok:#2E7D3B; --ok-bg:#E1F2E3; --bad:#B4372F; --bad-bg:#FBE3E0;
  --c-verb:#2F6FEB; --c-noun:#17935F; --c-masdar:#8A4FD6; --c-place:#B96F00; --c-aug:#D6336C;
  --belt:#2B3238; --belt-edge:#1A1F23;
  --f-display:"Tajawal","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F0679B; --accent-ink:#2A0A16; --accent-soft:#3A1826;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --c-verb:#7FA8FF; --c-noun:#4FD1A0; --c-masdar:#B592F0; --c-place:#F2B13F; --c-aug:#F57BA6;
  --belt:#232A30; --belt-edge:#0D1114; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A232A; --ink:#E5ECF1; --muted:#97A6B1; --line:#2C3943;
  --steel:#8FB3D1; --accent:#F0679B; --accent-ink:#2A0A16; --accent-soft:#3A1826;
  --ok:#7CC786; --ok-bg:#1C3322; --bad:#F2897F; --bad-bg:#3A1E1C;
  --c-verb:#7FA8FF; --c-noun:#4FD1A0; --c-masdar:#B592F0; --c-place:#F2B13F; --c-aug:#F57BA6;
  --belt:#232A30; --belt-edge:#0D1114; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.headTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.headTop a{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);text-decoration:none}
.headTop a:hover{color:var(--accent)}
.tag{font-size:.9rem;color:var(--muted)} .tag b{color:var(--ink)}
.lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:var(--surface);flex:none;margin-inline-start:8px}
.lang span{padding:5px 10px;border-radius:11px;color:var(--muted);font-size:12px;font-weight:700;transition:background .2s,color .2s;cursor:pointer}
html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--steel);color:var(--surface)}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;border-radius:12px;padding:9px 14px;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible,.btn:focus-visible,.root:focus-visible,.pat:focus-visible,.opt:focus-visible,.wcard:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sub{font-size:.88rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 16px;font-weight:700;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.panel[hidden]{display:none}
/* root picker */
.roots{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.root{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 4px;font-family:var(--f-display);font-size:1.45rem;font-weight:700;letter-spacing:.12em;line-height:1.35;transition:transform .15s,background .2s,border-color .2s}
.root:hover{transform:translateY(-2px);border-color:var(--accent)}
.root[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px -8px var(--accent)}
.root small{display:block;font-size:.68rem;letter-spacing:0;font-weight:500;opacity:.8}
/* pattern grid */
.pgroup{display:flex;flex-direction:column;gap:6px}
.pgroup h3{font-size:.95rem;display:flex;align-items:center;gap:8px;color:var(--muted)}
.pgroup h3 i{width:12px;height:12px;border-radius:4px;display:inline-block}
.pats{display:flex;flex-wrap:wrap;gap:6px}
.pat{border:2px solid var(--gc);background:var(--bg);border-radius:12px;padding:5px 12px;font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;line-height:1.35;transition:background .2s,color .2s,transform .15s}
.pat b{font-family:var(--f-display);font-size:1.15rem}
.pat span{font-size:.72rem;font-weight:500;color:var(--muted)}
.pat:hover{transform:translateY(-1px)}
.pat.on{background:var(--gc);color:#fff} .pat.on span{color:#fff;opacity:.9}
.pat.off{border-style:dashed;opacity:.5}
.pat.done::after{content:"✓";font-size:.7rem;color:var(--ok)}
.pat.on.done::after{color:#fff}
/* machine */
.machine{background:radial-gradient(circle at 30% 15%,#3B4650,#151B20);border-radius:22px;padding:14px 12px 18px;position:relative;overflow:hidden;color:#EEF3F6;min-height:330px;display:flex;flex-direction:column;align-items:center;gap:12px}
.machine .lbl{font-size:.8rem;color:#A9B7C1;text-align:center}
.hopper{display:flex;gap:10px;direction:rtl;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.ltile{width:54px;height:60px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1;position:relative}
.hopper .ltile{background:#F7D36B;color:#3A2A00;box-shadow:0 4px 0 #B78F1C}
.hopper .ltile em{position:absolute;bottom:-17px;font-style:normal;font-size:.7rem;font-weight:500;color:#A9B7C1}
.pipe{width:6px;height:18px;background:linear-gradient(#6B7B87,#3D4952);border-radius:3px}
.tpl{display:flex;direction:rtl;gap:6px;flex-wrap:nowrap;justify-content:center;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.28);border:1px dashed rgba(255,255,255,.22);min-height:78px;align-items:center;max-width:100%}
.tpl .tile{min-width:44px;height:58px;padding:0 6px;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.5;background:#34414B;color:#C9D4DB;border:1px solid rgba(255,255,255,.1)}
.tpl .tile.slot{background:rgba(247,211,107,.12);border:2px dashed #F7D36B;color:#7B6A2E}
.tpl .tile.slot.filled{background:#F7D36B;color:#3A2A00;border:2px solid #F7D36B;box-shadow:0 3px 0 #B78F1C}
.belt{width:min(100%,520px);height:16px;border-radius:8px;background:repeating-linear-gradient(90deg,#222a30 0 14px,#2f3840 14px 28px);box-shadow:inset 0 2px 4px #0008,0 2px 0 #4a5762}
.belt.run{animation:beltmove .8s linear infinite}
@keyframes beltmove{to{background-position:28px 0}}
.plate{min-height:82px;display:flex;align-items:center;justify-content:center;padding:6px 26px;border-radius:16px;background:var(--surface);color:var(--gc,var(--ink));border:3px solid var(--gc,var(--line));font-family:var(--f-display);font-size:clamp(2.2rem,7vw,3.2rem);font-weight:800;line-height:1.6;box-shadow:0 10px 24px -10px #000a;max-width:100%}
.plate.empty{background:transparent;border:2px dashed rgba(255,255,255,.2);color:#8695A0;font-size:1rem;font-weight:500;box-shadow:none}
.plate.sparks::after{content:"";position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;background:#F7D36B}
.progress{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
/* info */
.info .big{font-family:var(--f-display);font-size:2rem;font-weight:800;color:var(--gc)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700;background:var(--gc,var(--steel));color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.98rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.ex{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:1.1rem;border-inline-start:5px solid var(--gc,var(--accent))}
.ex mark{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:0 5px;font-weight:700}
.note{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:.92rem}
/* tree */
.treeWrap{overflow:hidden}
.tnode{cursor:pointer}
.tnode rect{fill:var(--surface);stroke-width:2.5;transition:fill .2s}
.tnode text{font-family:var(--f-display);font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.tnode:hover rect,.tnode.sel rect{fill:var(--accent-soft)}
.tnode.sel rect{stroke-width:4}
.tbranch{fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.75}
.troot circle{fill:var(--accent)} .troot text{fill:var(--accent-ink);font-family:var(--f-display);font-weight:800;text-anchor:middle;dominant-baseline:central}
.vtree{display:flex;flex-direction:column;gap:10px}
.vroot{align-self:center;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:6px 22px;font-family:var(--f-display);font-size:1.8rem;font-weight:800;letter-spacing:.15em}
.vbr{border-inline-start:4px solid var(--gc);padding-inline-start:12px;margin-inline-start:14px;display:flex;flex-direction:column;gap:6px}
.vbr h3{font-size:.9rem;color:var(--gc)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:2px solid var(--gc);background:var(--bg);border-radius:12px;padding:3px 12px;font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.vchip.sel{background:var(--gc);color:#fff}
/* practice */
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.lvl{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;text-align:start;display:flex;flex-direction:column;gap:2px}
.lvl b{font-family:var(--f-display)} .lvl span{font-size:.85rem;color:var(--muted)}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:.92rem;color:var(--muted)}
.qword{font-family:var(--f-display);font-size:clamp(2.4rem,9vw,3.6rem);font-weight:800;text-align:center;line-height:1.5;color:var(--ink)}
.qtext{text-align:center;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 8px;font-family:var(--f-display);font-size:1.35rem;font-weight:700;transition:border-color .2s,background .2s,transform .15s;min-height:56px}
.opt.txt{font-family:var(--f-body);font-size:1.02rem;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateY(-1px)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.typein{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.typein input{font-family:var(--f-display);font-size:1.6rem;text-align:center;width:min(100%,260px)}
.fb{border-radius:12px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);min-height:48px}
.fb.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.fb.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.fb .why{color:var(--ink);font-size:.95rem;margin-top:4px;display:block}
.hint{background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:.93rem}
/* lost root */
.wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.wcard{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 6px;font-family:var(--f-display);font-size:1.7rem;font-weight:800;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;transition:border-color .2s,background .2s}
.wcard small{display:block;font-family:var(--f-body);font-size:.78rem;font-weight:500;color:var(--muted);line-height:1.4}
.wcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.wcard.drag{z-index:5;box-shadow:0 14px 30px -10px #0007;transition:none;opacity:.95}
.wcard.fam{border-color:var(--ok);background:var(--ok-bg)} .wcard.odd{border-color:var(--bad);background:var(--bad-bg)}
.drop{border:3px dashed var(--line);border-radius:18px;padding:14px;text-align:center;font-weight:700;color:var(--muted);transition:border-color .2s,background .2s}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
/* report */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem}
.stat span{font-size:.82rem;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;font-size:.9rem}
.bar .lab{flex:0 0 38%;min-width:0}
.bar .tr{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden} .bar .tr i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--surface);padding:8px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:560px){
  body{font-size:16px}
  .tpl .tile{min-width:34px;height:50px;font-size:1.35rem;padding:0 3px}
  .tpl{gap:4px;padding:8px 6px}
  .ltile{width:46px;height:52px;font-size:1.7rem}
  .roots{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="headTop">
      <a href="../index.html" id="backLink">&#8592;</a>
      <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
    </div>
    <h1 id="pageH1"></h1>
    <p class="tag" id="tagP"></p>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="panel" id="p-factory" role="tabpanel">
    <div class="wrap" style="gap:14px">
      <div class="card"><h2 id="h-root"></h2><p class="sub" id="s-root"></p><div class="roots" id="rootGrid"></div><div class="note" id="rootInfo"></div></div>
      <div class="card"><h2 id="h-pat"></h2><p class="sub" id="s-pat"></p><div id="patGrid" style="display:flex;flex-direction:column;gap:10px"></div>
        <div class="row"><button class="btn pri" id="playAll"></button><span class="sub" id="prog"></span></div><div class="progress"><i id="progBar" style="width:0"></i></div></div>
      <div class="machine" id="machine" aria-live="polite">
        <div class="lbl" id="l-hop"></div>
        <div class="hopper" id="hopper"></div><div class="pipe"></div>
        <div class="lbl" id="l-tpl"></div>
        <div class="tpl" id="tpl"></div><div class="pipe"></div>
        <div class="belt" id="belt"></div>
        <div class="plate empty" id="plate"></div>
      </div>
      <div class="card info" id="info"></div>
      <div class="card"><h2 id="h-tree"></h2><p class="sub" id="s-tree"></p><div class="treeWrap" id="tree"></div></div>
    </div>
  </section>

  <section class="panel" id="p-practice" role="tabpanel" hidden><div class="card" id="practice"></div></section>
  <section class="panel" id="p-lost" role="tabpanel" hidden><div class="card" id="lost"></div></section>
  <section class="panel" id="p-report" role="tabpanel" hidden><div class="card" id="report"></div></section>
<p id="footerCopyright" style="text-align:center;font-size:12px;color:var(--muted);margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--line);"></p>
</div>
