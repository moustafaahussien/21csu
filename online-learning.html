<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التعليم أونلاين | مدارس دار الذكر</title>
<meta name="description" content="روابط الفصول الافتراضية وجداول الحصص لجميع صفوف مدارس دار الذكر">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@300;600;900&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6FC;
    --ink:#14173A;
    --muted:#565D8C;
    --glass:rgba(255,255,255,.66);
    --glass-edge:rgba(255,255,255,.95);
    --line:rgba(60,70,160,.14);
    --violet:#6D4BFF; --cyan:#0EA5D6; --green:#0E9F76; --orange:#E8790A; --pink:#E63E7C; --red:#E5383B;
    --foil:linear-gradient(100deg,#6D4BFF 0%,#0EA5D6 20%,#0E9F76 40%,#E8790A 60%,#E63E7C 80%,#6D4BFF 100%);
    --display:'Sora','Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,sans-serif;
    --body:'IBM Plex Sans Arabic','Sora',Tahoma,sans-serif;
    --wrap:1200px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:100px;overflow-x:clip}
  body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.85;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:clip}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:10px}
  .wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
  [hidden]{display:none!important}

  .aurora{position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(40% 35% at 20% 25%,rgba(109,75,255,.22),transparent 70%),
      radial-gradient(35% 30% at 80% 20%,rgba(14,165,214,.20),transparent 70%),
      radial-gradient(38% 34% at 72% 80%,rgba(230,62,124,.16),transparent 70%),
      radial-gradient(34% 30% at 15% 85%,rgba(232,121,10,.14),transparent 70%);
    animation:drift 28s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}}

  /* ---------- الشريط العلوي ---------- */
  .nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;
    width:min(1200px,calc(100% - 24px));height:66px;padding-inline:16px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--glass-edge);border-radius:22px;box-shadow:0 12px 36px -16px rgba(40,50,140,.35)}
  .logos{display:flex;align-items:center;gap:12px}
  .logos .sep{width:1px;height:30px;background:var(--line)}
  .logo{position:relative;display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:44px}
  .logo img{height:44px;width:auto;display:block}
  .logo .ph{display:none;font-size:11.5px;line-height:1.3;color:var(--muted);text-align:center;border:1.5px dashed rgba(60,70,160,.35);border-radius:11px;padding:5px 10px;white-space:nowrap}
  .logo.missing img{display:none}
  .logo.missing .ph{display:block}
  .nav-right{display:flex;align-items:center;gap:8px}
  .home-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;font-size:15px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
  .home-link:hover{background:rgba(109,75,255,.09);color:var(--ink)}
  .home-link svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:rgba(20,23,58,.07);font-family:'Sora',sans-serif;font-weight:600;font-size:13px}
  .lang span{padding:6px 12px;border-radius:11px;color:var(--muted);transition:background .2s,color .2s}
  html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--ink);color:#fff}

  /* ---------- الهيرو ---------- */
  .hero{padding:124px 0 26px;text-align:center}
  .live-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);box-shadow:0 8px 24px -14px rgba(40,50,140,.4);margin-bottom:16px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(229,56,59,.6);animation:ping 1.8s infinite}
  @keyframes ping{70%{box-shadow:0 0 0 9px rgba(229,56,59,0)}100%{box-shadow:0 0 0 0 rgba(229,56,59,0)}}
  .hero h1{font-family:var(--display);font-weight:900;font-size:clamp(36px,5.4vw,70px);line-height:1.3;margin-bottom:10px;
    background-image:var(--foil);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:foil 10s linear infinite,rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes foil{to{background-position:200% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  .hero .lead{color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:40em;margin:0 auto 24px;animation:rise .9s .1s cubic-bezier(.2,.8,.2,1) both}
  .howto{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;animation:rise .9s .2s cubic-bezier(.2,.8,.2,1) both}
  .howto li{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-edge);font-weight:500;font-size:15px}
  .howto b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-family:'Sora',sans-serif;font-size:14px;background:linear-gradient(135deg,var(--violet),var(--pink))}

  /* ---------- رسائل الحالة ---------- */
  .notice{display:flex;align-items:flex-start;gap:14px;margin:6px 0 18px;padding:16px 20px;border-radius:20px;background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--c,var(--orange));box-shadow:0 10px 30px -20px rgba(40,50,140,.5)}
  .notice svg{flex:none;width:24px;height:24px;margin-top:3px;fill:none;stroke:var(--c,var(--orange));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .notice b{display:block;font-family:var(--display);font-weight:600}
  .notice p{color:var(--muted);font-size:15px}
  .notice button{margin-top:8px;padding:6px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
  .status-bar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:18px 0 6px;font-size:14px;color:var(--muted)}
  .status-bar button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:600;color:var(--muted)}
  .status-bar button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .status-bar button.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- خريطة المدرسة ---------- */
  .sec-title{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.4vw,30px);margin:26px 0 14px;display:flex;align-items:center;gap:12px}
  .sec-title::before{content:"";width:8px;height:1.1em;border-radius:6px;background:linear-gradient(var(--violet),var(--pink))}
  .map{display:grid;grid-template-columns:1.9fr 1fr;gap:18px;align-items:start}
  .track{position:relative;padding:20px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 22px 50px -32px rgba(40,50,140,.55)}
  .track-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .track-head .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#14173A));box-shadow:0 10px 22px -10px var(--c)}
  .track-head .ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .track-head h3{font-family:var(--display);font-weight:900;font-size:20px;line-height:1.4}
  .track-head small{display:block;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--muted)}
  .sections{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .section{padding:14px;border-radius:20px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
  .section h4{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .section h4 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .stage{padding:10px 0;border-top:1px dashed var(--line)}
  .stage:first-of-type{border-top:0;padding-top:2px}
  .stage-name{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .stage-name span{font-weight:400;font-size:12.5px}
  .grades{display:flex;flex-wrap:wrap;gap:8px}
  .grade{position:relative;min-width:54px;padding:8px 12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);background:#fff;
    font-family:var(--display);font-weight:600;font-size:14px;line-height:1.35;text-align:center;transition:transform .18s,box-shadow .18s,background .18s,color .18s}
  .grade:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px var(--c);border-color:var(--c)}
  .grade.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 12px 24px -12px var(--c)}
  .grade .n{position:absolute;top:-8px;inset-inline-end:-6px;min-width:20px;height:20px;padding-inline:5px;border-radius:999px;display:grid;place-items:center;
    font-family:'Sora',sans-serif;font-size:11px;font-weight:800;color:#fff;background:var(--ink);border:2px solid #fff}
  .grade .live{position:absolute;top:-5px;inset-inline-start:-5px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;animation:ping 1.8s infinite}
  .track.american .grades{display:grid;grid-template-columns:repeat(3,1fr)}

  /* ---------- لوحة الصف ---------- */
  .panel{margin-top:26px;padding:22px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 26px 60px -36px rgba(40,50,140,.6);border-top:5px solid var(--c,var(--violet))}
  .pick{padding:44px 20px;text-align:center;color:var(--muted)}
  .pick svg{width:54px;height:54px;fill:none;stroke:var(--violet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
  .pick b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .crumbs{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
  .crumbs i{opacity:.5;font-style:normal}
  .p-head h2{font-family:var(--display);font-weight:900;font-size:clamp(24px,2.8vw,34px);line-height:1.35;color:color-mix(in srgb,var(--c) 70%,#14173A)}
  .copy{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;transition:background .2s}
  .copy:hover{background:var(--bg)}
  .copy svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .copy.done{color:var(--green);border-color:var(--green)}
  .contacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .contact{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:9px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:14.5px}
  .contact svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .contact span{color:var(--muted)}
  .contact a{font-family:'Sora',sans-serif;font-weight:600;direction:ltr;color:color-mix(in srgb,var(--c) 75%,#14173A)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.today::after{content:"•";color:var(--red);margin-inline-start:5px}

  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
  .group{display:flex;flex-direction:column;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 30px -24px rgba(40,50,140,.6);overflow:hidden}
  .group.is-live{border-color:color-mix(in srgb,var(--red) 55%,#fff);box-shadow:0 0 0 3px rgba(229,56,59,.10),0 18px 36px -26px rgba(229,56,59,.6)}
  .g-head{padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 10%,#fff),#fff 70%)}
  .g-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .g-title{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.3}
  .g-title small{display:block;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--muted)}
  .badge{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
  .badge.live{background:var(--red);color:#fff;display:inline-flex;align-items:center;gap:6px}
  .badge.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .badge.soon,.badge.brk{background:color-mix(in srgb,var(--orange) 15%,#fff);color:color-mix(in srgb,var(--orange) 75%,#14173A)}
  .now-line{font-size:15px;color:var(--muted)}
  .now-line b{color:var(--ink);font-family:var(--display)}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
  .meta span{display:inline-flex;align-items:center;gap:6px}
  .meta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .note{font-size:14px;padding:8px 12px;border-radius:12px;background:var(--bg);color:var(--muted)}
  .join{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 18px;border-radius:16px;font-family:var(--display);font-weight:600;font-size:16.5px;color:#fff;
    background:linear-gradient(135deg,var(--c,var(--violet)),color-mix(in srgb,var(--c,var(--violet)) 55%,#14173A));box-shadow:0 12px 24px -14px var(--c,var(--violet));transition:transform .2s,box-shadow .2s}
  .join:hover{transform:translateY(-2px)}
  .join svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .group.is-live .join{background:linear-gradient(135deg,var(--red),#B5172F);box-shadow:0 12px 24px -14px var(--red)}
  .join.off{background:var(--bg);color:var(--muted);box-shadow:none;cursor:not-allowed;border:1px dashed var(--line)}

  .tt{list-style:none;border-top:1px solid var(--line)}
  .tt li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px dashed var(--line);font-size:15px}
  .tt li:last-child{border-bottom:0}
  .tt .pn{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 75%,#14173A);font-family:'Sora',sans-serif;font-weight:800;font-size:13px}
  .tt .sub b{display:block;font-family:var(--display);font-weight:600;line-height:1.4}
  .tt .sub span{font-size:13.5px;color:var(--muted)}
  .tt .tm{font-family:'Sora','IBM Plex Sans Arabic',sans-serif;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;text-align:end;line-height:1.5}
  .tt li.past{opacity:.45}
  .tt li.cur{background:color-mix(in srgb,var(--red) 7%,#fff)}
  .tt li.cur .pn{background:var(--red);color:#fff}
  .tt li.cur .tm::before{content:attr(data-now);display:block;color:var(--red);font-family:var(--body);font-weight:700}
  .tt li.brk{grid-template-columns:34px 1fr auto;background:repeating-linear-gradient(-45deg,rgba(232,121,10,.06) 0 8px,transparent 8px 16px)}
  .tt li.brk .pn{background:color-mix(in srgb,var(--orange) 15%,#fff);color:var(--orange)}
  .tt li.brk .pn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tt li.brk.cur{background:color-mix(in srgb,var(--orange) 12%,#fff)}
  .tt li.brk.cur .pn{background:var(--orange);color:#fff}
  .tt li.brk.cur .tm::before{color:var(--orange)}
  .tt-empty{padding:14px 18px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
  .tt-win{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
  .tt-win svg{flex:none;width:20px;height:20px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .empty-state{padding:36px 16px;text-align:center;color:var(--muted)}
  .empty-state svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.6;margin-bottom:6px}
  .empty-state b{display:block;font-family:var(--display);color:var(--ink);font-size:18px}

  footer{padding:36px 0 44px;color:var(--muted);font-size:15px}
  footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-block:22px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-edge)}
  footer b{color:var(--ink);font-weight:600}

  @media (max-width:980px){
    .map{grid-template-columns:1fr}
    .track.american .grades{display:flex}
  }
  @media (max-width:640px){
    .wrap{padding-inline:16px}
    .home-link span{display:none}
    .sections{grid-template-columns:1fr}
    .track,.panel{padding:16px;border-radius:22px}
    .groups{grid-template-columns:1fr}
    .tt li{padding:9px 14px}
    .howto li{font-size:14px}
    .logo img{height:38px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<header class="nav">
  <div class="logos">
    <a href="index.html" class="logo" aria-label="الرئيسية"><img src="assets/school-logo.png" alt="School logo" onerror="this.parentNode.classList.add('missing')"><span class="ph">School<br>Logo</span></a>
    <span class="sep" aria-hidden="true"></span>
    <a href="index.html" class="logo" aria-label="الرئيسية"><img src="assets/unit-logo.png" alt="Unit logo" onerror="this.parentNode.classList.add('missing')"><span class="ph">Unit<br>Logo</span></a>
  </div>
  <div class="nav-right">
    <a class="home-link" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span data-t="home"></span></a>
    <button class="lang" id="langBtn" type="button" aria-label="Change language / تغيير اللغة"><span data-l="ar">AR</span><span data-l="en">EN</span></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="live-pill"><i class="dot" aria-hidden="true"></i><span data-t="pill"></span></span>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <ol class="howto">
      <li><b>1</b><span data-t="how1"></span></li>
      <li><b>2</b><span data-t="how2"></span></li>
      <li><b>3</b><span data-t="how3"></span></li>
    </ol>
    <div class="status-bar">
      <span id="updated"></span>
      <button type="button" id="refreshBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span data-t="refresh"></span></button>
    </div>
  </section>

  <div id="notices"></div>

/* ==================================================================
   3) تفسير محتوى الجدول
   ================================================================== */
function norm(s){
  return String(s ?? "").trim().toLowerCase()
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ـًٌٍَُِّْ]/g,"")
    .replace(/\s+/g," ");
}
const ORD_WORDS = [["الحادي عشر",11],["الثاني عشر",12],["العاشر",10],["تاسع",9],["ثامن",8],["سابع",7],["سادس",6],["خامس",5],["رابع",4],["ثالث",3],["ثاني",2],["اول",1]];
function ordinalIn(s){ for (const [w,v] of ORD_WORDS){ if (s.includes(norm(w))) return v; } return null; }

/* «ينطبق على» / «الصف»: يرجع قائمة معرّفات الصفوف المشمولة
   يقبل: صفًا واحدًا، مرحلة كاملة، نطاقًا مثل (4-6)، أو «كل المدرسة» */
function parseScope(raw){
  const s = norm(raw);
  const all = Object.keys(GRADES);
  if (!s || /كل المدرس|الكل|جميع الصفوف|^all|whole school/.test(s)) return all;
  const isAm = /امريك|american|diploma|دبلوم/.test(s);
  const sec = isAm ? "american" : /بنات|girls/.test(s) ? "girls" : /بنين|boys/.test(s) ? "boys" : null;
  const st  = isAm ? "g" : /ابتدا|primary|elementary/.test(s) ? "primary" : /متوسط|middle|intermediate/.test(s) ? "middle" : /ثانو|secondary|high/.test(s) ? "secondary" : null;
  const rest = s.replace(/ثانوي|ثانويه/g," # ");                    // حتى لا تختلط «ثانوي» بـ«الثاني»
  let nums = null;
  const rg = rest.match(/(\d{1,2})\s*[-–—]\s*(\d{1,2})/);
  if (rg) nums = range(Math.min(+rg[1],+rg[2]), Math.max(+rg[1],+rg[2]));
  else {
    const ds = rest.match(/\d{1,2}/g);
    if (ds) nums = ds.map(Number);
    else { const o = ordinalIn(rest.replace(/الصفوف|صفوف/g,"")); if (o) nums = [o]; }
  }
  return all.filter(id => {
    const g = GRADES[id];
    if (sec && g.sec !== sec) return false;
    if (st && g.st !== st) return false;
    if (!sec && !st && !nums) return false;
    if (nums && !nums.includes(g.n)) return false;
    return true;
  });
}
/* «الصف» في ورقتي الروابط والجدول يجب أن يحدد صفًا واحدًا */
function parseGrade(raw){ const ids = parseScope(raw); return ids.length === 1 ? ids[0] : null; }

/* الفصول: «أ / ب» = «أ/ب» = «أ و ب» */
function classKey(raw){
  return norm(raw).replace(/\s+و\s*/g,"/").replace(/[^a-z0-9ء-ي]/g,"");
}
function classLabel(raw){
  const parts = String(raw ?? "").split(/\s*[\/،,\-]\s*|\s+و\s*/).map(x=>x.trim()).filter(Boolean);
  return parts.join(" / ");
}

/* رقم الحصة أو «فسحة» */
function parsePeriod(raw){
  const s = norm(raw);
  if (!s) return null;
  if (/فسح|استراح|راحه|break|recess/.test(s)) return "break";
  if (/دوام|اليوم الدراسي|متاح|اتاح|school day|available|window/.test(s)) return "window";   // رابط متاح طوال اليوم
  const d = s.match(/\d{1,2}/);
  if (d) return +d[0];
  return ordinalIn(s);
}

/* اليوم: 0=الأحد … 4=الخميس، أو "all" */
const DAY_KEYS = [["احد","sun"],["اثنين","mon"],["ثلاثا","tue"],["اربعا","wed"],["خميس","thu"]];
function parseDay(raw){
  const s = norm(raw).replace(/ء/g,"");
  if (!s || /يومي|كل الايام|daily|every/.test(s)) return "all";
  for (let i=0;i<DAY_KEYS.length;i++){ const [ar,en] = DAY_KEYS[i]; if (s.includes(ar) || s.startsWith(en)) return i; }
  return "all";
}

/* الوقت ← دقائق منذ منتصف الليل */
function parseTime(raw){
  const s = norm(raw);
  if (!s) return null;
  const m = s.match(/(\d{1,2})(?:[:.٫](\d{2}))?/);
  if (!m) return null;
  let h = +m[1], min = +(m[2] || 0);
  const pm = /(\bpm\b|p\.m|مساء|(^|\s|\d)م(\s|$))/.test(s);
  const am = /(\bam\b|a\.m|صباح|(^|\s|\d)ص(\s|$))/.test(s);
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (!pm && !am && h >= 1 && h <= 5) h += 12;    // بدون ص/م: 1–5 تُفهم بعد الظهر
  if (h > 23 || min > 59) return null;
  return h*60 + min;
}
function fmtTime(mins){
  if (mins == null) return "";
  let h = Math.floor(mins/60); const m = mins % 60;
  const suf = h >= 12 ? t("pm") : t("am");
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")} ${suf}`;
}
function fixUrl(u){
  u = String(u ?? "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)){
    if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) u = "https://" + u; else return "";
  }
  // روابط Meet المنسوخة من داخل حساب (مثل /meet/abc-defg-hij?authuser=0) ← الرابط المختصر
  const m = u.match(/^https?:\/\/meet\.google\.com\/(?:meet\/)?([a-z]{3}-[a-z]{4}-[a-z]{3})/i);
  return m ? "https://meet.google.com/" + m[1].toLowerCase() : u;
}
function telHref(p){ const d = norm(p).replace(/[^\d+]/g,""); return d ? "tel:" + d : ""; }

/* أعمدة كل ورقة — نتعرف عليها بالاسم لا بالترتيب */
const COLS = {
  scope:   ["ينطبق علي","الصف","المرحله","الفئه","grade","applies to"],
  cls:     ["الفصول","الفصل","الشعبه","classes","class","section"],
  link:    ["رابط الحصه","رابط الفصل","الرابط","link","url"],
  owner:   ["مسؤول الرابط","المسؤول","host","owner"],
  note:    ["ملاحظات","ملاحظه","notes","note"],
  period:  ["الحصه","رقم الحصه","period"],
  subject: ["الماده","subject"],
  teacher: ["المعلم","المعلمه","teacher"],
  day:     ["اليوم","day"],
  start:   ["من","وقت البدايه","البدايه","start","from"],
  end:     ["الي","وقت النهايه","النهايه","end","to"],
  role:    ["المسمي","الصفه","role","title"],
  name:    ["الاسم","name"],
  phone:   ["الجوال","رقم الجوال","الهاتف","التواصل","phone","mobile"]
};
function reader(table){
  const H = table.headers.map(norm);
  const idx = {};
  for (const [k, names] of Object.entries(COLS)){
    const nn = names.map(norm);
    let i = H.findIndex(h => nn.includes(h));
    if (i < 0) i = H.findIndex(h => nn.some(n => n.length > 3 && h.includes(n)));
    idx[k] = i;
  }
  const has = (...ks) => ks.every(k => idx[k] >= 0);
  const rows = table.rows.filter(r => r.some(c => String(c ?? "").trim()))
    .map(r => new Proxy({}, { get: (_,k) => idx[k] >= 0 ? String(r[idx[k]] ?? "").trim() : "" }));
  return { has, rows };
}

/* ---------- البيانات بعد التفسير ---------- */
let GROUPS = [];        // [{grade, key, label, link, owner, note, periods:[{p, day, subject, teacher}]}]
let TIMING = [];        // [{ids:Set, size, p, start, end}]
let SUPS = [];          // [{ids:Set, size, role, name, phone}]
let UNMATCHED = [];
let LAST_LOAD = null;
let LOAD_STATE = "idle"; // idle | loading | ok | error | setup | demo

function buildData(D){
  const groups = new Map(); const bad = [];
  const getGroup = (gid, clsRaw) => {
    const key = gid + "|" + classKey(clsRaw);
    if (!groups.has(key)) groups.set(key, { grade:gid, key, label:classLabel(clsRaw), link:"", owner:"", note:"", periods:[] });
    return groups.get(key);
  };

  const Lk = reader(D.links || {headers:[],rows:[]});
  if (Lk.has("scope","link")) Lk.rows.forEach(r=>{
    const gid = parseGrade(r.scope); if (!gid){ bad.push(r.scope); return; }
    const g = getGroup(gid, r.cls);
    g.link = fixUrl(r.link) || g.link; g.owner = r.owner || g.owner; g.note = r.note || g.note;
  });

  const Sc = reader(D.schedule || {headers:[],rows:[]});
  if (Sc.has("scope","period","subject")) Sc.rows.forEach(r=>{
    const gid = parseGrade(r.scope); if (!gid){ bad.push(r.scope); return; }
    const p = parsePeriod(r.period); if (typeof p !== "number") return;
    getGroup(gid, r.cls).periods.push({ p, day:parseDay(r.day), subject:r.subject, teacher:r.teacher });
  });

  const Tm = reader(D.timing || {headers:[],rows:[]});
  TIMING = Tm.has("scope","period","start") ? Tm.rows.map(r=>{
    const ids = parseScope(r.scope);
    return { ids:new Set(ids), size:ids.length, p:parsePeriod(r.period), start:parseTime(r.start), end:parseTime(r.end) };
  }).filter(x => x.size && x.p != null && x.start != null) : [];

  const Sp = reader(D.supervisors || {headers:[],rows:[]});
  SUPS = Sp.has("name") && !Sp.has("link") && !Sp.has("subject") ? Sp.rows.map(r=>{
    const ids = parseScope(r.scope);
    return { ids:new Set(ids), size:ids.length, role:r.role, name:r.name, phone:r.phone };
  }).filter(x => x.size && x.name) : [];

  GROUPS = [...groups.values()].sort((a,b)=> a.grade.localeCompare(b.grade) || a.label.localeCompare(b.label, "ar"));
  UNMATCHED = [...new Set(bad)];
}

/* توقيت حصص صف معيّن: لكل حصة نأخذ أدق نطاق ينطبق عليه */
function timingFor(gid){
  const best = new Map();
  TIMING.filter(x => x.ids.has(gid)).forEach(x=>{
    const k = String(x.p), cur = best.get(k);
    if (!cur || x.size < cur.size) best.set(k, x);
  });
  return [...best.values()].sort((a,b)=> a.start - b.start);
}
function supsFor(gid){
  const list = SUPS.filter(s => s.ids.has(gid));
  if (!list.length) return [];
  const min = Math.min(...list.map(s => s.size));
  return list.filter(s => s.size === min);
}

/* ---------- التحميل من Google Sheets (JSONP — لا تعترضه قيود CORS) ---------- */
function loadTab(name){
  return new Promise((resolve, reject)=>{
    const cb = "__olcb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); }
    window[cb] = res => {
      cleanup();
      if (!res || res.status === "error" || !res.table) return reject(new Error("sheet"));
      resolve({
        headers: res.table.cols.map(c => c.label || ""),
        rows: res.table.rows.map(r => (r.c || []).map(c => c == null ? "" : (c.f != null ? c.f : (c.v ?? ""))))
      });
    };
    s.src = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SHEET_ID)}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    document.head.appendChild(s);
  });
}
async function loadAll(){
  const links = await loadTab(SHEETS.links).catch(async()=>{ await new Promise(r=>setTimeout(r,1500)); return loadTab(SHEETS.links); });
  const [schedule, timing, supervisors] = await Promise.all(
    [SHEETS.schedule, SHEETS.timing, SHEETS.supervisors].map(n => loadTab(n).catch(()=> ({headers:[],rows:[]})))
  );
  return { links, schedule, timing, supervisors };

let SEL = null;    // الصف المختار
let DAY = null;    // اليوم المختار (يظهر فقط إن كان في الجدول أيام مختلفة)

const todayIdx = () => { const d = new Date().getDay(); return d <= 4 ? d : null; };   // الجمعة والسبت: لا دوام
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const hasDays = gid => GROUPS.some(g => g.grade === gid && g.periods.some(p => p.day !== "all"));

/* صفوف جدول فصل ما لليوم المختار، مع الفسحة، مرتبة بالوقت */
function timetable(group, day){
  const T = timingFor(group.grade);
  const tmap = new Map(T.filter(x => typeof x.p === "number").map(x => [x.p, x]));
  const per = group.periods.filter(p => p.day === "all" || p.day === day);
  const byP = new Map(); per.forEach(p => { if (!byP.has(p.p) || p.day !== "all") byP.set(p.p, p); });
  const rows = [...byP.values()].map(p => ({ kind:"p", p:p.p, subject:p.subject, teacher:p.teacher, start:tmap.get(p.p)?.start ?? null, end:tmap.get(p.p)?.end ?? null }));
  if (rows.length) T.filter(x => x.p === "break").forEach(b => rows.push({ kind:"b", start:b.start, end:b.end }));
  return rows.sort((a,b)=> (a.start ?? (a.p ?? 0)*1000) - (b.start ?? (b.p ?? 0)*1000) || (a.p ?? 0) - (b.p ?? 0));
}

const windowFor = gid => timingFor(gid).find(x => x.p === "window") || null;

/* حالة الفصل الآن */
function groupNow(rows, day, gid){
  const td = todayIdx();
  if (td == null || day !== td) return null;
  const n = nowMin();
  const timed = rows.filter(r => r.start != null);
  if (!timed.length){
    // لا يوجد جدول حصص: نعتمد على فترة إتاحة الرابط (مثل 6:30 ص – 2:30 م)
    const w = gid ? windowFor(gid) : null;
    if (!w) return null;
    const wEnd = w.end ?? 24*60;
    if (n >= w.start && n < wEnd) return { k:"open", w };
    if (n < w.start) return { k:"opens", m:w.start - n, w };
    return { k:"over" };
  }
  const cur = timed.find(r => n >= r.start && n < (r.end ?? r.start + 30));
  if (cur) return cur.kind === "b" ? { k:"brk", row:cur, next: timed.find(r => r.start >= (cur.end ?? 0) && r.kind === "p") } : { k:"live", row:cur };
  const first = timed[0], last = timed[timed.length-1];
  if (n < first.start) return { k:"before", m:first.start - n, row:first };
  if (n >= (last.end ?? last.start + 30)) return { k:"over" };
  const next = timed.find(r => r.start > n);
  return next ? { k:"gap", row:next, m:next.start - n } : null;
}

  if (LOAD_STATE === "error") parts.push(notice("alert", t("errT"), t("errD",{s:SHEETS.links}), "#E5383B", true));
  if (LOAD_STATE === "demo")  parts.push(notice("info", t("demo"), "", "#E8790A"));
  // تنبيه الأسطر غير المفهومة يظهر للمشرف فقط: أضف ?admin=1 لآخر الرابط
  if (UNMATCHED.length && new URLSearchParams(location.search).has("admin"))
    parts.push(notice("alert", t("unmatched",{n:UNMATCHED.length, list:UNMATCHED.map(x=>`«${x || "فارغ"}»`).join("، ")}), "", "#E8790A"));
  box.innerHTML = parts.join("");
  box.querySelector("[data-retry]")?.addEventListener("click", refresh);
}

}

function renderMap(){
  const td = todayIdx();
  const count = id => GROUPS.filter(g => g.grade === id).length;
  const liveIn = id => GROUPS.some(g => g.grade === id && ["live","open"].includes(groupNow(timetable(g, td), td, id)?.k));
  const chip = g => {
    const c = count(g.id);
    return `<button type="button" class="grade${SEL === g.id ? " on" : ""}" data-g="${g.id}" style="--c:${g.color}" aria-pressed="${SEL === g.id}" aria-label="${esc([L(g.track), L(g.section), L(g.stage), gradeName(g)].filter(Boolean).join(" "))}">
      ${esc(gradeShort(g))}${c ? `<span class="n">${c}</span>` : ""}${liveIn(g.id) ? `<span class="live" title="${esc(t("live"))}"></span>` : ""}</button>`;
  };
  const gradesOf = (tr, s, st) => st.grades.map(n => GRADES[tr.key === "american" ? `american-${n}` : `${s.key}-${st.key}-${n}`]);

  document.getElementById("map").innerHTML = SCHOOL.map(tr=>{
    if (tr.key === "american"){
      const st = tr.sections[0].stages[0];
      return `<article class="track american" style="--c:${tr.color}">
        <div class="track-head"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${tr.icon}</svg></span>
          <h3>${esc(L(tr))}<small>${LANG === "ar" ? "من الصف الرابع إلى التاسع" : "Grades 4 – 9"}</small></h3></div>
        <div class="grades">${gradesOf(tr, tr.sections[0], st).map(chip).join("")}</div>
      </article>`;
    }
    return `<article class="track" style="--c:${tr.color}">
      <div class="track-head"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${tr.icon}</svg></span><h3>${esc(L(tr))}</h3></div>
      <div class="sections">${tr.sections.map(s=>`
        <div class="section" style="--c:${s.color}">
          <h4><i aria-hidden="true"></i>${esc(L(s))}</h4>
          ${s.stages.map(st=>`
            <div class="stage">
              <div class="stage-name">${esc(L(st))} <span>(${LANG === "ar" ? `من الصف الأول إلى ${ORD_AR[st.grades.at(-1)]}` : `Grades 1 – ${st.grades.at(-1)}`})</span></div>
              <div class="grades">${gradesOf(tr, s, st).map(chip).join("")}</div>
            </div>`).join("")}
        </div>`).join("")}
      </div>
    </article>`;
  }).join("");
  document.querySelectorAll(".grade").forEach(b => b.addEventListener("click", ()=> selectGrade(b.dataset.g, true)));
}

function renderPanel(){
  const p = document.getElementById("panel");
  if (!SEL || !GRADES[SEL]){
    p.style.removeProperty("--c");
    p.innerHTML = `<div class="pick">${svg("hand")}<b>${esc(t("pickT"))}</b><p>${esc(t("pickD"))}</p></div>`;
    return;
  }
  const g = GRADES[SEL];
  p.style.setProperty("--c", g.color);
  const mine = GROUPS.filter(x => x.grade === SEL);
  const td = todayIdx();
  const multiDay = hasDays(SEL);
  const day = multiDay ? (DAY ?? td ?? 0) : (td ?? "all");
  const crumbs = [L(g.track), L(g.section), L(g.stage)].filter(Boolean);
  const sups = supsFor(SEL);

  p.innerHTML = `
    <div class="p-head">
      <div><div class="crumbs">${crumbs.map(esc).join(' <i>›</i> ')}</div><h2>${esc(gradeName(g))}</h2></div>
      <button type="button" class="copy" id="copyBtn">${svg("copy")}<span>${esc(t("copy"))}</span></button>
    </div>
    ${sups.length ? `<div class="contacts">${sups.map(s => `<div class="contact">${svg(s.phone ? "phone" : "user")}<span><bdi>${esc(s.role || "")}</bdi></span><b><bdi>${esc(s.name)}</bdi></b>${s.phone ? `<a href="${esc(telHref(s.phone))}">${esc(norm(s.phone))}</a>` : ""}</div>`).join("")}</div>` : ""}
    ${multiDay ? `<div class="chips" role="group">${I18N[LANG].days.map((d,i)=>`<button type="button" class="chip${day === i ? " on" : ""}${td === i ? " today" : ""}" data-day="${i}">${esc(d)}</button>`).join("")}</div>` : ""}
    ${mine.length ? `<div class="groups" id="groups"></div>` : `<div class="empty-state">${svg("cal")}<b>${esc(t("emptyT"))}</b><p>${esc(t("emptyD"))}</p></div>`}
  `;
  p.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", ()=>{ DAY = +b.dataset.day; renderPanel(); }));
  p.querySelector("#copyBtn").addEventListener("click", copyLink);
  renderGroups(day);
}

function renderGroups(dayArg){
  const box = document.getElementById("groups");
  if (!box) return;
  const td = todayIdx();
  const day = dayArg ?? (hasDays(SEL) ? (DAY ?? td ?? 0) : (td ?? "all"));
  const n = nowMin();
  const g = GRADES[SEL];

  box.innerHTML = GROUPS.filter(x => x.grade === SEL).map(gr=>{
    const rows = timetable(gr, day === "all" ? 0 : day);
    const st = groupNow(rows, day === "all" ? null : day, gr.grade);
    const win = windowFor(gr.grade);
    const isToday = td != null && (day === td || day === "all");
    let badge = "", line = "";
    if (st?.k === "live"){
      badge = `<span class="badge live">${esc(t("live"))}</span>`;
      line = `${esc(t("nowP"))}<b>${esc(t("period",{n:st.row.p}))} — <bdi>${esc(st.row.subject)}</bdi></b>${st.row.teacher ? ` · <bdi>${esc(st.row.teacher)}</bdi>` : ""}`;
    } else if (st?.k === "brk"){
      badge = `<span class="badge brk">${esc(t("brkNow"))}</span>`;
      line = esc(t("brkUntil",{t:fmtTime(st.row.end)})) + (st.next ? ` · ${esc(t("nextP"))}<b>${esc(st.next.subject)}</b>` : "");
    } else if (st?.k === "before"){
      if (st.m <= 60) badge = `<span class="badge soon">${esc(t("startsIn",{m:st.m}))}</span>`;
      line = esc(t("firstAt",{t:fmtTime(st.row.start)})) + ` — <b>${esc(st.row.subject || "")}</b>`;
    } else if (st?.k === "gap"){
      badge = `<span class="badge soon">${esc(t("startsIn",{m:st.m}))}</span>`;
      line = `${esc(t("nextP"))}<b>${esc(st.row.subject || "")}</b>`;
    } else if (st?.k === "open"){
      badge = `<span class="badge live">${esc(t("openNow"))}</span>`;
      line = esc(t("openUntil",{t:fmtTime(st.w.end)}));
    } else if (st?.k === "opens"){
      if (st.m <= 60) badge = `<span class="badge soon">${esc(t("opensIn",{m:st.m}))}</span>`;
      line = esc(t("opensAt",{t:fmtTime(st.w.start)}));
    } else if (st?.k === "over"){
      badge = `<span class="badge">${esc(t("dayOver"))}</span>`;
    }

    const tt = rows.length ? `<ol class="tt">${rows.map(r=>{
      const end = r.end ?? (r.start != null ? r.start + 30 : null);
      const cls = isToday && r.start != null ? (n >= end ? " past" : (n >= r.start ? " cur" : "")) : "";
      const tm = r.start != null ? `${fmtTime(r.start)}${r.end != null ? `<br>${fmtTime(r.end)}` : ""}` : "";
      return r.kind === "b"
        ? `<li class="brk${cls}"><span class="pn">${svg("cup")}</span><span class="sub"><b>${esc(t("brk"))}</b></span><span class="tm" data-now="${esc(t("now"))}">${tm}</span></li>`
        : `<li class="${cls.trim()}"><span class="pn">${r.p}</span><span class="sub"><b>${esc(r.subject || "—")}</b>${r.teacher ? `<span>${esc(r.teacher)}</span>` : ""}</span><span class="tm" data-now="${esc(t("now"))}">${tm}</span></li>`;
    }).join("")}</ol>`
      : win ? `<p class="tt-empty tt-win">${svg("cal")}<span>${esc(t("winLine",{d:`${I18N[LANG].days[0]} – ${I18N[LANG].days[4]}`, a:fmtTime(win.start), b:fmtTime(win.end)}))}</span></p>`
      : `<p class="tt-empty">${esc(t("noTT"))}</p>`;

    return `<article class="group${["live","open"].includes(st?.k) ? " is-live" : ""}" style="--c:${g.color}">
      <div class="g-head">
        <div class="g-top"><h3 class="g-title">${gr.label ? `${esc(t("classes"))} <bdi>${esc(gr.label)}</bdi>` : esc(t("allClasses"))}</h3>${badge}</div>
        ${line ? `<p class="now-line">${line}</p>` : ""}
        ${gr.owner ? `<div class="meta"><span>${svg("user")}${esc(t("owner"))}: <bdi>${esc(gr.owner)}</bdi></span></div>` : ""}
        ${gr.note ? `<p class="note">${esc(gr.note)}</p>` : ""}
        ${gr.link
          ? `<a class="join" href="${esc(gr.link)}" target="_blank" rel="noopener">${svg("video")}${esc(t("join"))}</a>`
          : `<span class="join off">${esc(t("noLink"))}</span>`}
      </div>
      ${tt}
    </article>`;
  }).join("");
}

function selectGrade(id, scroll){
  if (!GRADES[id]) return;
  SEL = id; DAY = null;
  LS.set("ol-grade", id);
  if (location.hash !== "#" + id) history.replaceState(null, "", location.pathname + location.search + "#" + id);
  renderMap(); renderPanel();
  if (scroll) document.getElementById("panel").scrollIntoView({ behavior:"smooth", block:"start" });
}

async function copyLink(){
  const url = location.origin + location.pathname + "#" + SEL;
  try { await navigator.clipboard.writeText(url); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); }
  const b = document.getElementById("copyBtn");
  b.classList.add("done"); b.querySelector("span").textContent = t("copied");
  setTimeout(()=>{ if (!b.isConnected) return; b.classList.remove("done"); b.querySelector("span").textContent = t("copy"); }, 2000);
}

function renderAll(){ renderNotices(); renderStatus(); renderMap(); renderPanel(); }

function applyLang(lang){
  LANG = lang;
  const de = document.documentElement;
  de.lang = lang; de.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.title = t("meta");
  LS.set("lang", lang);
  renderAll();
}


/* ==================================================================
   5) التشغيل
   ================================================================== */
document.getElementById("langBtn").addEventListener("click", ()=> applyLang(LANG === "ar" ? "en" : "ar"));
document.getElementById("refreshBtn").addEventListener("click", refresh);
window.addEventListener("hashchange", ()=>{ const id = location.hash.slice(1); if (GRADES[id] && id !== SEL) selectGrade(id, true); });

(function init(){
  const q = new URLSearchParams(location.search).get("lang");
  LANG = [q, LS.get("lang")].find(v => v === "ar" || v === "en") || "ar";
  const fromHash = location.hash.slice(1);
  const start = GRADES[fromHash] ? fromHash : (GRADES[LS.get("ol-grade")] ? LS.get("ol-grade") : null);
  if (start) SEL = start;
  applyLang(LANG);
  refresh().then(()=>{ if (start) selectGrade(start, !!GRADES[fromHash]); });
  setInterval(refresh, AUTO_REFRESH_MIN * 60000);
  setInterval(()=>{ renderMap(); renderGroups(); }, 30000);   // تحديث «مباشر الآن» والحصة الحالية
})();
</script>
