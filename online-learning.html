<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التعليم عن بعد | مدارس دار الذكر</title>
<meta name="description" content="روابط الفصول الافتراضية وجداول الحصص لجميع صفوف مدارس دار الذكر">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@300;600;900&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6FC;
    --ink:#14173A;
    --muted:#565D8C;
    --glass:rgba(255,255,255,.66);
    --glass-edge:rgba(255,255,255,.95);
    --line:rgba(60,70,160,.14);
    --violet:#6D4BFF; --cyan:#0EA5D6; --green:#0E9F76; --orange:#E8790A; --pink:#E63E7C; --red:#E5383B;
    --foil:linear-gradient(100deg,#6D4BFF 0%,#0EA5D6 20%,#0E9F76 40%,#E8790A 60%,#E63E7C 80%,#6D4BFF 100%);
    --display:'Sora','Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,sans-serif;
    --body:'IBM Plex Sans Arabic','Sora',Tahoma,sans-serif;
    --wrap:1200px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:100px;overflow-x:clip}
  body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.85;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:clip}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:10px}
  .wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
  [hidden]{display:none!important}

  .aurora{position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(40% 35% at 20% 25%,rgba(109,75,255,.22),transparent 70%),
      radial-gradient(35% 30% at 80% 20%,rgba(14,165,214,.20),transparent 70%),
      radial-gradient(38% 34% at 72% 80%,rgba(230,62,124,.16),transparent 70%),
      radial-gradient(34% 30% at 15% 85%,rgba(232,121,10,.14),transparent 70%);
    animation:drift 28s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}}

  /* ---------- الشريط العلوي ---------- */
  .nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;
    width:min(1200px,calc(100% - 24px));height:66px;padding-inline:16px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--glass-edge);border-radius:22px;box-shadow:0 12px 36px -16px rgba(40,50,140,.35)}
  .logos{display:flex;align-items:center;gap:12px}
  .logos .sep{width:1px;height:30px;background:var(--line)}
  .logo{position:relative;display:inline-flex;align-items:center;justify-content:center;height:44px;min-width:44px}
  .logo img{height:44px;width:auto;display:block}
  .logo .ph{display:none;font-size:11.5px;line-height:1.3;color:var(--muted);text-align:center;border:1.5px dashed rgba(60,70,160,.35);border-radius:11px;padding:5px 10px;white-space:nowrap}
  .logo-dt,.logo-dt img{height:58px}
  .logo.missing img{display:none}
  .logo.missing .ph{display:block}
  .nav-right{display:flex;align-items:center;gap:8px}
  .home-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;font-size:15px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
  .home-link:hover{background:rgba(109,75,255,.09);color:var(--ink)}
  .home-link svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lang{direction:ltr;display:inline-flex;align-items:center;padding:3px;border:0;border-radius:14px;background:rgba(20,23,58,.07);font-family:'Sora',sans-serif;font-weight:600;font-size:13px}
  .lang span{padding:6px 12px;border-radius:11px;color:var(--muted);transition:background .2s,color .2s}
  html[lang="ar"] .lang [data-l="ar"],html[lang="en"] .lang [data-l="en"]{background:var(--ink);color:#fff}

  /* ---------- الهيرو ---------- */
  .hero{padding:124px 0 26px;text-align:center}
  .live-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);box-shadow:0 8px 24px -14px rgba(40,50,140,.4);margin-bottom:16px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(229,56,59,.6);animation:ping 1.8s infinite}
  @keyframes ping{70%{box-shadow:0 0 0 9px rgba(229,56,59,0)}100%{box-shadow:0 0 0 0 rgba(229,56,59,0)}}
  .hero h1{font-family:var(--display);font-weight:900;font-size:clamp(36px,5.4vw,70px);line-height:1.3;margin-bottom:10px;
    background-image:var(--foil);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:foil 10s linear infinite,rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes foil{to{background-position:200% 0}}
  @keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  .hero .lead{color:var(--muted);font-size:clamp(16px,1.6vw,19px);max-width:40em;margin:0 auto 24px;animation:rise .9s .1s cubic-bezier(.2,.8,.2,1) both}
  .howto{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;animation:rise .9s .2s cubic-bezier(.2,.8,.2,1) both}
  .howto li{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-edge);font-weight:500;font-size:15px}
  .howto b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font-family:'Sora',sans-serif;font-size:14px;background:linear-gradient(135deg,var(--violet),var(--pink))}

  /* ---------- رسائل الحالة ---------- */
  .notice{display:flex;align-items:flex-start;gap:14px;margin:6px 0 18px;padding:16px 20px;border-radius:20px;background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--c,var(--orange));box-shadow:0 10px 30px -20px rgba(40,50,140,.5)}
  .notice svg{flex:none;width:24px;height:24px;margin-top:3px;fill:none;stroke:var(--c,var(--orange));stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .notice b{display:block;font-family:var(--display);font-weight:600}
  .notice p{color:var(--muted);font-size:15px}
  .notice button{margin-top:8px;padding:6px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
  .status-bar{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:18px 0 6px;font-size:14px;color:var(--muted)}
  .status-bar button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:600;color:var(--muted)}
  .status-bar button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .status-bar button.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- خريطة المدرسة ---------- */
  .sec-title{font-family:var(--display);font-weight:900;font-size:clamp(22px,2.4vw,30px);margin:26px 0 14px;display:flex;align-items:center;gap:12px}
  .sec-title::before{content:"";width:8px;height:1.1em;border-radius:6px;background:linear-gradient(var(--violet),var(--pink))}
  .map{display:grid;grid-template-columns:1.9fr 1fr;gap:18px;align-items:start}
  .track{position:relative;padding:20px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 22px 50px -32px rgba(40,50,140,.55)}
  .track-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .track-head .ico{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#14173A));box-shadow:0 10px 22px -10px var(--c)}
  .track-head .ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .track-head h3{font-family:var(--display);font-weight:900;font-size:20px;line-height:1.4}
  .track-head small{display:block;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--muted)}
  .sections{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .section{padding:14px;border-radius:20px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
  .section h4{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .section h4 i{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .stage{padding:10px 0;border-top:1px dashed var(--line)}
  .stage:first-of-type{border-top:0;padding-top:2px}
  .stage-name{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .stage-name span{font-weight:400;font-size:12.5px}
  .grades{display:flex;flex-wrap:wrap;gap:8px}
  .grade{position:relative;min-width:54px;padding:8px 12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);background:#fff;
    font-family:var(--display);font-weight:600;font-size:14px;line-height:1.35;text-align:center;transition:transform .18s,box-shadow .18s,background .18s,color .18s}
  .grade:hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px var(--c);border-color:var(--c)}
  .grade.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 12px 24px -12px var(--c)}
  .grade .n{position:absolute;top:-8px;inset-inline-end:-6px;min-width:20px;height:20px;padding-inline:5px;border-radius:999px;display:grid;place-items:center;
    font-family:'Sora',sans-serif;font-size:11px;font-weight:800;color:#fff;background:var(--ink);border:2px solid #fff}
  .grade .live{position:absolute;top:-5px;inset-inline-start:-5px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;animation:ping 1.8s infinite}
  .track.american .grades{display:grid;grid-template-columns:repeat(3,1fr)}

  /* ---------- بوابة الدخول ---------- */
  .login{max-width:520px;margin:18px auto 0;padding:30px 26px 24px;border-radius:28px;text-align:center;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 26px 60px -36px rgba(40,50,140,.6)}
  .login .lock{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 14px 28px -14px rgba(109,75,255,.8);margin-bottom:10px}
  .login .lock svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .login h2{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.4}
  .login>p{color:var(--muted);font-size:15px}
  .code-row{display:flex;gap:8px;margin:16px 0 6px}
  .code-row input{flex:1;min-width:0;padding:13px 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-family:'Sora',monospace;font-weight:600;font-size:19px;letter-spacing:.35em;text-align:center;text-transform:uppercase;outline:0;transition:border-color .2s,box-shadow .2s}
  .code-row input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(109,75,255,.12)}
  .code-row button{padding:0 22px;border:0;border-radius:16px;font-family:var(--display);font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 12px 24px -14px rgba(109,75,255,.8)}
  .code-row button:disabled,.code-row input:disabled{opacity:.6;cursor:wait}
  .login-err{margin-top:6px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--red) 10%,#fff);color:#B5172F!important;font-weight:600;font-size:14.5px!important}
  .login-note{margin-top:12px;font-size:13px!important}
  .picker{margin-top:18px;padding:16px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .pgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px}
  .pgroup{padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid var(--line)}
  .pg-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .pg-name i{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .picker .who{margin-bottom:10px}
  .pg-name{flex-wrap:wrap}
  .live-badge{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--red);color:#fff}
  .live-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  .live-badge.none{background:var(--bg);color:var(--muted);font-weight:600}
  .live-badge.none::before{display:none}
  .gate-days{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:2px 0 12px}
  .gd-l{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--muted)}
  .gd-l svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .gd-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .gd-chips .chip{padding:6px 12px;font-size:13.5px}
  .gd-chips input{min-height:34px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13.5px;color:var(--ink)}
  .plan-badge{margin-inline-start:auto;display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
  .plan-badge.ok{background:color-mix(in srgb,var(--green) 16%,#fff);color:#0B6E52}
  .plan-badge.miss{background:color-mix(in srgb,#E8790A 16%,#fff);color:#B45309}
  .grade .plan-n{background:var(--green)}
  .grade .miss-n{background:#E8790A}
  .now-list.miss-list{border-color:color-mix(in srgb,#E8790A 35%,#fff)}
  .miss-list .now-h svg{width:18px;height:18px;fill:none;stroke:#B45309;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .now-list.ok-list{border-color:color-mix(in srgb,var(--green) 35%,#fff)}
  .ok-list .now-h{margin:0;color:#0B6E52}
  .pgroup.has-live{border-color:color-mix(in srgb,var(--red) 40%,#fff)}
  .grade .live-n{background:var(--red)}
  .now-list{margin-top:12px;padding:12px;border-radius:18px;background:#fff;border:1px solid color-mix(in srgb,var(--red) 30%,#fff)}
  .now-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:6px}
  .now-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
  .now-item:first-of-type{border-top:0}
  .now-main{flex:1;min-width:0;text-align:start;border:0;background:none;padding:0;font-size:14.5px;line-height:1.5}
  .now-main b{font-family:var(--display);color:color-mix(in srgb,var(--c) 70%,#14173A)}
  .now-main span{display:block;color:var(--muted);font-size:13.5px}
  .now-join{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:12px;color:#fff;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--red),#B5172F)}
  .now-join svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .who{display:inline-flex;align-items:center;gap:6px;margin-inline-end:6px;font-weight:600;color:var(--muted);font-size:14.5px}
  .who svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .tab{display:flex;flex-direction:column;align-items:flex-start;padding:8px 16px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);background:#fff;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.35;transition:background .2s,color .2s}
  .tab small{font-family:var(--body);font-weight:500;font-size:12px;opacity:.75}
  .tab.on{background:var(--c);border-color:var(--c);color:#fff}

  /* ---------- نموذج إدخال الجداول ---------- */
  .picker-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .picker-top .who{margin:0}
  .ed-open{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:0;border-radius:14px;color:#fff;font-family:var(--display);font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 10px 22px -12px rgba(109,75,255,.8)}
  .ed-open svg,.ed-btn svg,.ed-ic svg,.row-link svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  body.ed-lock{overflow:hidden}
  .ed-wrap{position:fixed;inset:0;z-index:100;background:rgba(20,23,58,.45);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow:auto}
  .ed-panel{width:min(980px,100%);background:var(--bg);border-radius:26px;box-shadow:0 40px 90px -30px rgba(20,23,58,.6);display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
  .ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .ed-head h2{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.4}
  .ed-head small{color:var(--muted);font-size:14px}
  .ed-body{padding:16px 22px;overflow:auto;flex:1}
  .ed-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
  .ed-date{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:6px}
  .ed-date label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .ed-quick{display:flex;gap:6px;flex-wrap:wrap}
  .ed-hint{font-size:13.5px;color:var(--muted);margin:6px 0 12px}
  .ed-loading{padding:30px;text-align:center;color:var(--muted)}
  .ed-rows{display:grid;gap:12px}
  .ed-tabs{margin:0 0 12px}
  .lk-row .lk-name{width:auto;height:auto;padding:4px 10px;font-family:var(--display);font-size:14px;margin-inline-end:auto}
  .lk-row .lk-link{grid-column:span 4}
  .lk-row .lk-owner{grid-column:span 2}
  .lk-row.dirty{border-color:var(--violet);box-shadow:0 0 0 3px rgba(109,75,255,.08)}
  .lk-badge{font-size:12px;font-weight:700;color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,#fff);padding:2px 10px;border-radius:999px}
  .ed-filter{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin:0 0 12px;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
  .ed-filter label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);flex:1;min-width:220px}
  .ed-filter label svg{display:none}
  .ed-btn.sm{padding:8px 14px;font-size:13.5px}
  .ed-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line)}
  .ed-row-h{grid-column:1/-1;display:flex;align-items:center;gap:6px}
  .ed-row-h b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-family:'Sora',sans-serif;font-size:13px;margin-inline-end:auto}
  .ed-row label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
  .ed-row label{grid-column:span 2}
  .ed-row .w3{grid-column:span 3}
  .ed-row .w1{grid-column:span 1}
  .ed-wrap input,.ed-wrap select{width:100%;min-height:40px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14.5px;color:var(--ink)}

/* ==================================================================
   3) تفسير محتوى الجدول
   ================================================================== */
function norm(s){
  return String(s ?? "").trim().toLowerCase()
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ـًٌٍَُِّْ]/g,"")
    .replace(/\s+/g," ");
}
const ORD_WORDS = [["الحادي عشر",11],["الثاني عشر",12],["العاشر",10],["تاسع",9],["ثامن",8],["سابع",7],["سادس",6],["خامس",5],["رابع",4],["ثالث",3],["ثاني",2],["اول",1]];
function ordinalIn(s){ for (const [w,v] of ORD_WORDS){ if (s.includes(norm(w))) return v; } return null; }

/* «ينطبق على» / «الصف»: يرجع قائمة معرّفات الصفوف المشمولة
   يقبل: صفًا واحدًا، مرحلة كاملة، نطاقًا مثل (4-6)، أو «كل المدرسة» */
function parseScope(raw){
  const s = norm(raw);
  const all = Object.keys(GRADES);
  if (!s || /كل المدرس|الكل|جميع الصفوف|^all|whole school/.test(s)) return all;
  const isAm = /امريك|american|diploma|دبلوم/.test(s);
  const sec = isAm ? "american" : /بنات|girls/.test(s) ? "girls" : /بنين|boys/.test(s) ? "boys" : null;
  const st  = isAm ? "g" : /ابتدا|primary|elementary/.test(s) ? "primary" : /متوسط|middle|intermediate/.test(s) ? "middle" : /ثانو|secondary|high/.test(s) ? "secondary" : null;
  const rest = s.replace(/ثانوي|ثانويه/g," # ");                    // حتى لا تختلط «ثانوي» بـ«الثاني»
  let nums = null;
  const rg = rest.match(/(\d{1,2})\s*[-–—]\s*(\d{1,2})/);
  if (rg) nums = range(Math.min(+rg[1],+rg[2]), Math.max(+rg[1],+rg[2]));
  else {
    const ds = rest.match(/\d{1,2}/g);
    if (ds) nums = ds.map(Number);
    else { const o = ordinalIn(rest.replace(/الصفوف|صفوف/g,"")); if (o) nums = [o]; }
  }
  return all.filter(id => {
    const g = GRADES[id];
    if (sec && g.sec !== sec) return false;
    if (st && g.st !== st) return false;
    if (!sec && !st && !nums) return false;
    if (nums && !nums.includes(g.n)) return false;
    return true;
  });
}
/* «الصف» في ورقتي الروابط والجدول يجب أن يحدد صفًا واحدًا */
function parseGrade(raw){ const ids = parseScope(raw); return ids.length === 1 ? ids[0] : null; }

/* الفصول: «أ / ب» = «أ/ب» = «أ و ب» */
function classKey(raw){
  return norm(raw).replace(/\s+و\s*/g,"/").replace(/[^a-z0-9ء-ي]/g,"");
}
function classLabel(raw){
  const parts = String(raw ?? "").split(/\s*[\/،,\-]\s*|\s+و\s*/).map(x=>x.trim()).filter(Boolean);
  return parts.join(" / ");
}

/* رقم الحصة أو «فسحة» */
/* اسم الاستراحة: الاسم المكتوب في ورقة التوقيت إن كان غير «الفسحة» (مثل صلاة الظهر) */
const isPrayer = r => /صلا|prayer/i.test(norm(r?.label || ""));
const brkName = r => (LANG === "ar" && r?.label && !/فسح/.test(norm(r.label))) ? r.label : (isPrayer(r) && LANG !== "ar" ? "Prayer" : t("brk"));
function parsePeriod(raw){
  const s = norm(raw);
  if (!s) return null;
  if (/فسح|استراح|راحه|صلاه|break|recess|prayer/.test(s)) return "break";
  if (/دوام|اليوم الدراسي|متاح|اتاح|school day|available|window/.test(s)) return "window";   // رابط متاح طوال اليوم
  const d = s.match(/\d{1,2}/);
  if (d) return +d[0];
  return ordinalIn(s);
}

/* اليوم: 0=الأحد … 4=الخميس، أو "all" */
const DAY_KEYS = [["احد","sun"],["اثنين","mon"],["ثلاثا","tue"],["اربعا","wed"],["خميس","thu"]];
function parseDay(raw){
  const s = norm(raw).replace(/ء/g,"");
  if (!s || /يومي|كل الايام|daily|every/.test(s)) return "all";
  for (let i=0;i<DAY_KEYS.length;i++){ const [ar,en] = DAY_KEYS[i]; if (s.includes(ar) || s.startsWith(en)) return i; }
  return "all";
}

/* الوقت ← دقائق منذ منتصف الليل */
function parseTime(raw){
  const s = norm(raw);
  if (!s) return null;
  const m = s.match(/(\d{1,2})(?:[:.٫](\d{2}))?/);
  if (!m) return null;
  let h = +m[1], min = +(m[2] || 0);
  const pm = /(\bpm\b|p\.m|مساء|(^|\s|\d)م(\s|$))/.test(s);
  const am = /(\bam\b|a\.m|صباح|(^|\s|\d)ص(\s|$))/.test(s);
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (!pm && !am && h >= 1 && h <= 5) h += 12;    // بدون ص/م: 1–5 تُفهم بعد الظهر
  if (h > 23 || min > 59) return null;
  return h*60 + min;
}
function fmtTime(mins){
  if (mins == null) return "";
  let h = Math.floor(mins/60); const m = mins % 60;
  const suf = h >= 12 ? t("pm") : t("am");
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,"0")} ${suf}`;
}
function fixUrl(u){
  u = String(u ?? "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)){
    if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) u = "https://" + u; else return "";
  }
  // روابط Meet المنسوخة من داخل حساب (مثل /meet/abc-defg-hij?authuser=0) ← الرابط المختصر
  const m = u.match(/^https?:\/\/meet\.google\.com\/(?:meet\/)?([a-z]{3}-[a-z]{4}-[a-z]{3})/i);
  return m ? "https://meet.google.com/" + m[1].toLowerCase() : u;
}
/* مفتاح المادة للمطابقة: بلا «ال» ولا أرقام ولا أقواس — «الرياضيات (1-1)» = «رياضيات» */
const stripAl = w => w.replace(/^(وال|بال|لل|ال)(?=..)/, "");
function subjectKey(s){ return norm(s).replace(/\([^)]*\)/g," ").split(/[^a-z\u0621-\u064A]+/).filter(Boolean).map(stripAl).join(" "); }
const findSubject = s => SUBJ_MAP.get(subjectKey(s)) || null;

/* التاريخ ← yyyy-mm-dd */
function normDate(raw){
  const s = norm(raw).replace(/\//g,"-");
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
const dsOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dateOf = ds => { const [y,m,d] = ds.split("-").map(Number); return new Date(y, m-1, d); };
const todayDs = () => dsOf(new Date());
/* الأيام الدراسية القادمة (الأحد–الخميس) بدءًا من اليوم */
function schoolDays(n, from){
  const out = []; const d = from ? dateOf(from) : new Date(); d.setHours(12,0,0,0);
  while (out.length < n){ if (d.getDay() <= 4) out.push(dsOf(d)); d.setDate(d.getDate()+1); }
  return out;
}
function dayLabel(ds){
  const td = todayDs(), tm = dsOf(new Date(Date.now()+86400000));
  if (ds === td) return t("today");
  if (ds === tm) return t("tomorrow");
  const d = dateOf(ds);
  const wd = LANG === "ar" ? ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][d.getDay()] : d.toLocaleDateString("en-US",{weekday:"short"});
  return `${wd} ${d.getDate()}/${d.getMonth()+1}`;
}

function telHref(p){ const d = norm(p).replace(/[^\d+]/g,""); return d ? "tel:" + d : ""; }

/* أعمدة كل ورقة — نتعرف عليها بالاسم لا بالترتيب */
const COLS = {
  scope:   ["ينطبق علي","الصف","المرحله","الفئه","grade","applies to"],
  cls:     ["الفصول","الفصل","الشعبه","classes","class","section"],
  link:    ["رابط الحصه","رابط الفصل","الرابط","link","url"],
  owner:   ["مسؤول الرابط","المسؤول","host","owner"],
  note:    ["ملاحظات","ملاحظه","notes","note"],
  period:  ["الحصه","رقم الحصه","period"],
  subject: ["الماده","subject"],
  teacher: ["المعلم","المعلمه","teacher"],
  day:     ["اليوم","day"],
  start:   ["من","وقت البدايه","البدايه","start","from"],
  end:     ["الي","وقت النهايه","النهايه","end","to"],
  role:    ["المسمي","الصفه","role","title"],
  name:    ["الاسم","name"],
  phone:   ["الجوال","رقم الجوال","الهاتف","التواصل","phone","mobile"],
  date:    ["التاريخ","date"]
};
function reader(table){
  const H = table.headers.map(norm);
  const idx = {};
  for (const [k, names] of Object.entries(COLS)){
    const nn = names.map(norm);
    let i = H.findIndex(h => nn.includes(h));
    if (i < 0) i = H.findIndex(h => nn.some(n => n.length > 3 && h.includes(n)));
    idx[k] = i;
  }
  const has = (...ks) => ks.every(k => idx[k] >= 0);
  const rows = table.rows.filter(r => r.some(c => String(c ?? "").trim()))
    .map(r => new Proxy({}, { get: (_,k) => idx[k] >= 0 ? String(r[idx[k]] ?? "").trim() : "" }));
  return { has, rows };
}

/* ---------- البيانات بعد التفسير ---------- */
let GROUPS = [];        // [{grade, key, label, link, owner, note, periods:[{p, day, subject, teacher}]}]
let TIMING = [];        // [{ids:Set, size, p, start, end}]
let SUPS = [];          // [{ids:Set, size, role, name, phone}]
let UNMATCHED = [];
let LAST_LOAD = null;
let LOAD_STATE = "idle"; // idle | login | loading | ok | error | setup | demo

function buildData(D){
  const groups = new Map(); const bad = [];
  const getGroup = (gid, clsRaw) => {
    const key = gid + "|" + classKey(clsRaw);
    if (!groups.has(key)) groups.set(key, { grade:gid, key, label:classLabel(clsRaw), link:"", owner:"", note:"", periods:[], dated:{} });
    return groups.get(key);
  };

  const Lk = reader(D.links || {headers:[],rows:[]});
  if (Lk.has("scope","link")) Lk.rows.forEach(r=>{
    const gid = parseGrade(r.scope); if (!gid){ bad.push(r.scope); return; }
    const g = getGroup(gid, r.cls);
    g.fixed = true; g.link = fixUrl(r.link) || g.link; g.owner = r.owner || g.owner; g.note = r.note || g.note;
  });

  const Sc = reader(D.schedule || {headers:[],rows:[]});
  if (Sc.has("scope","period","subject")) Sc.rows.forEach(r=>{
    const gid = parseGrade(r.scope); if (!gid){ bad.push(r.scope); return; }
    const p = parsePeriod(r.period); if (typeof p !== "number") return;
    const g = getGroup(gid, r.cls); g.fixed = true;
    g.periods.push({ p, day:parseDay(r.day), subject:r.subject, teacher:r.teacher });
  });

  // حصص مُدخلة بتاريخ محدد (تحل محل الجدول الأسبوعي في ذلك اليوم)
  const Dt = reader(D.dated || {headers:[],rows:[]});
  if (Dt.has("date","scope","period","subject")) Dt.rows.forEach(r=>{
    const gid = parseGrade(r.scope); if (!gid) return;
    const ds = normDate(r.date); const p = parsePeriod(r.period);
    if (!ds || typeof p !== "number") return;
    const g = getGroup(gid, r.cls);
    (g.dated[ds] = g.dated[ds] || []).push({ p, subject:r.subject, teacher:r.teacher, start:parseTime(r.start), end:parseTime(r.end), link:fixUrl(r.link) });
  });
  // مشرف المادة: أيام لها جدول خاص بالتاريخ لهذا الفصل (ولو بدون حصص من مواده) — لا نعرض فيها الجدول الأسبوعي
  (D.datedDays || []).forEach(([sc, cls, d]) => {
    const gid = parseGrade(sc), ds = normDate(d); if (!gid || !ds) return;
    const key = gid + "|" + classKey(cls); if (!groups.has(key)) return;
    const g = groups.get(key); g.dated[ds] = g.dated[ds] || [];
  });

  const Tm = reader(D.timing || {headers:[],rows:[]});
  TIMING = Tm.has("scope","period","start") ? Tm.rows.map(r=>{
    const ids = parseScope(r.scope);
    const p = parsePeriod(r.period);
    // اسم الاستراحة كما في الجدول (الفسحة / صلاة الظهر) — يظهر في جدول الفصل
    return { ids:new Set(ids), size:ids.length, p, label: p === "break" ? String(r.period || "").trim() : "", start:parseTime(r.start), end:parseTime(r.end) };
  }).filter(x => x.size && x.p != null && x.start != null) : [];

  const Sp = reader(D.supervisors || {headers:[],rows:[]});
  SUPS = Sp.has("name") && !Sp.has("link") && !Sp.has("subject") ? Sp.rows.map(r=>{
    const ids = parseScope(r.scope);
    return { ids:new Set(ids), size:ids.length, role:r.role, name:r.name, phone:r.phone };
  }).filter(x => x.size && x.name) : [];

  GROUPS = [...groups.values()].sort((a,b)=> a.grade.localeCompare(b.grade) || a.label.localeCompare(b.label, "ar"));
  UNMATCHED = [...new Set(bad)];
}

/* توقيت حصص صف معيّن: لكل حصة نأخذ أدق نطاق ينطبق عليه */
function timingFor(gid){
  const best = new Map();
  const mine = TIMING.filter(x => x.ids.has(gid));
  mine.filter(x => x.p !== "break").forEach(x=>{
    const k = String(x.p), cur = best.get(k);
    if (!cur || x.size < cur.size) best.set(k, x);
  });
  // الاستراحات (الفسحة، صلاة الظهر…): كلها من أدق نطاق فيه استراحات لهذا الصف
  const brks = mine.filter(x => x.p === "break");
  const sz = Math.min(...brks.map(x => x.size));
  return [...best.values(), ...brks.filter(x => x.size === sz)].sort((a,b)=> a.start - b.start);
}
function supsFor(gid){
  const list = SUPS.filter(s => s.ids.has(gid));
  if (!list.length) return [];
  const min = Math.min(...list.map(s => s.size));
  return list.filter(s => s.size === min);
}

function callServer(code){
  return new Promise((resolve, reject)=>{
    const cb = "__olcb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, 20000);
    function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); }
    window[cb] = res => { cleanup(); resolve(res); };
    s.src = `${SCRIPT_URL}?code=${encodeURIComponent(code)}&callback=${cb}&_=${Date.now()}`;
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    document.head.appendChild(s);
  });
}

const isDemo = () => new URLSearchParams(location.search).has("demo");
let REFRESHING = false, RETRYING = false, FALLBACK = false, REFRESH_AGAIN = false;   // REFRESHING = الرمز الجاري تحميله
const normCode = c => norm(c).toUpperCase().replace(/[^A-Z0-9]/g, "");   // نفس تطبيع الخادم (الأرقام العربية ← لاتينية)

async function refresh(){
  const btn = document.getElementById("refreshBtn");
  if (isDemo()){
    applyResponse(demoData()); LOAD_STATE = "demo"; LAST_LOAD = new Date(); renderAll(); return;
  }
  if (!SCRIPT_URL){ LOAD_STATE = "setup"; renderAll(); return; }
  if (!CODE){ LOAD_STATE = "login"; renderAll(); return; }
  if (REFRESHING === CODE){ REFRESH_AGAIN = true; return; }   // نفس الرمز قيد التحميل: نحدّث مرة أخرى بعده (مثلًا بعد حفظ تعديل)
  const myCode = CODE; REFRESHING = CODE;
  if (!GROUPS.length) LOAD_STATE = "loading";
  btn.classList.add("spin"); renderAll();
  try{
    // عند الضغط العالي: نعيد المحاولة تلقائيًا بفواصل عشوائية متزايدة حتى لا ترجع كل الأجهزة في نفس اللحظة
    const waits = GROUPS.length && !FALLBACK ? [0, 3000] : [0, 2500, 6000, 12000, 20000];
    let res, lastErr;
    for (let i = 0; i < waits.length; i++){
      if (waits[i]){ RETRYING = true; renderGate(); await new Promise(r => setTimeout(r, waits[i] * (0.6 + Math.random() * 0.8))); }
      try { res = await callServer(CODE); if (res && (res.ok || res.error === "invalid" || res.error === "busy")) break; }
      catch(e){ lastErr = e; res = null; }
    }
    RETRYING = false;
    if (CODE !== myCode) return;   // تغيّر الرمز أثناء التحميل (دخول برمز آخر): نتجاهل هذا الرد
    if (!res) throw lastErr || new Error("no response");
    if (res && res.ok){
      FALLBACK = false;
      applyResponse(res); LOAD_STATE = "ok"; LAST_LOAD = new Date(); LOGIN_ERR = "";
      LS.set("ol-cache", JSON.stringify({ code:CODE, at:LAST_LOAD.getTime(), res }));
      flushJoins();
    } else if (res && res.error === "invalid"){
      logout(GROUPS.length ? "expired" : "invalid"); return;
    } else if (res && res.error === "busy"){
      // محاولات خاطئة كثيرة على الخادم: من دخل سابقًا تبقى بياناته ظاهرة
      if (!GROUPS.length){ CODE = ""; LS.set("ol-code", ""); LOGIN_ERR = "busy"; LOAD_STATE = "login"; }
    } else {
      throw new Error(res && res.error || "bad response");
    }
  }catch(e){
    console.error("[online-learning]", e);
    if (CODE !== myCode) return;
    if (!GROUPS.length || FALLBACK){
      // الخادم لا يرد ولا توجد بيانات محفوظة: رابط الفصل الاحتياطي (مشفّر برمز الفصل)
      if (await tryFallback()){ LOAD_STATE = "ok"; FALLBACK = true; setTimeout(refresh, 60000 * (0.7 + Math.random() * 0.6)); }
      else LOAD_STATE = "error";
    }
  }finally{
    if (REFRESHING === myCode) REFRESHING = false;
    RETRYING = false;
    if (REFRESH_AGAIN && CODE === myCode){ REFRESH_AGAIN = false; setTimeout(refresh, 0); }
    btn.classList.remove("spin");
    renderAll();
  }
}

/* روابط احتياطية ثابتة على GitHub (بدون الخادم): كل رابط مشفّر برمز فصله، فلا يُفتح إلا بالرمز الصحيح */
async function tryFallback(){
  try{
    if (!crypto?.subtle) return false;
    const F = await fetch("online-learning-fallback.json?v=" + Math.floor(Date.now() / 3600000), { cache:"no-cache" }).then(r => r.json());
    const enc = new TextEncoder(), code = normCode(CODE);
    const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
    const id = hex(await crypto.subtle.digest("SHA-256", enc.encode(F.salt + ":" + code))).slice(0, 24);
    const it = F.items[id]; if (!it) return false;
    const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:enc.encode(F.salt), iterations:F.iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
    const plain = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(it.iv) }, key, b64(it.ct))));
    applyResponse({ ok:true, mode:"class", label:"", grades:[], editor:false,
      links:{ headers:["الصف","الفصول","رابط الحصة","مسؤول الرابط","ملاحظات"], rows:[[plain.g, plain.c, plain.l, "", ""]] },
      schedule:{ headers:[], rows:[] }, timing:{ headers:[], rows:[] }, supervisors:{ headers:[], rows:[] }, dated:{ headers:[], rows:[] } });
    const gid = parseGrade(plain.g); ALLOWED = gid ? [gid] : []; SEL = ALLOWED[0] || null;
    return !!ALLOWED.length;
  }catch(e){ console.error("[fallback]", e); return false; }
}

function applyResponse(res){
  buildData(res);
  WHO = res.label || "";
  MODE = res.mode || "";
  EDITOR = !!res.editor;
  SUBJECTS = Array.isArray(res.subjects) ? res.subjects : [];
  SUBJ_MAP = new Map();
  SUBJECTS.forEach(x => [x.name, ...(x.aliases || [])].forEach(n => { const k = subjectKey(n); if (k && !SUBJ_MAP.has(k)) SUBJ_MAP.set(k, x); }));
  ALLOWED = (res.grades || []).filter(id => GRADES[id]);
  // ترتيب الصفوف حسب ترتيبها في هيكل المدرسة
  const order = Object.keys(GRADES);
  ALLOWED.sort((a,b)=> order.indexOf(a) - order.indexOf(b));
  if (!ALLOWED.includes(SEL)) { SEL = ALLOWED[0] || null; DAY = null; }
}

async function login(code){
  CODE = String(code || "").trim();
  if (!CODE) return;
  LOGIN_ERR = "";
  LS.set("ol-code", CODE);
  GROUPS = []; ALLOWED = []; SEL = null;
  await refresh();
}
function logout(reason){
  CODE = ""; LS.set("ol-code", ""); LS.set("ol-cache", "");
  GROUPS = []; TIMING = []; SUPS = []; ALLOWED = []; SEL = null; WHO = ""; EDITOR = false; closeEditor(); closeReport(); RP.data = null;
  LOGIN_ERR = reason || "";
  LOAD_STATE = SCRIPT_URL ? "login" : "setup";
  renderAll();
}

const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

let SEL = null;    // الصف المختار
let GATE_DS = null; // اليوم المختار في الصفحة الرئيسية للمشرفين (null = اليوم)
let DAY = null;    // التاريخ المختار yyyy-mm-dd (أزرار الأيام تظهر عند وجود جدول يختلف من يوم لآخر أو حصص بالتاريخ)

const todayIdx = () => { const d = new Date().getDay(); return d <= 4 ? d : null; };   // الجمعة والسبت: لا دوام
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const hasDays = gid => GROUPS.some(g => g.grade === gid && (g.periods.some(p => p.day !== "all") || Object.keys(g.dated).length));
/* التاريخ الافتراضي: اليوم إن كان يوم دراسة أو فيه حصص بالتاريخ، وإلا أول يوم دراسي قادم */
function defaultDs(gid){
  const td = todayDs();
  if (dateOf(td).getDay() <= 4 || GROUPS.some(g => g.grade === gid && g.dated[td])) return td;
  return schoolDays(1)[0];
}

/* صفوف جدول فصل ما لليوم المختار، مع الفسحة، مرتبة بالوقت */
function timetable(group, ds){
  const T = timingFor(group.grade);
  const tmap = new Map(T.filter(x => typeof x.p === "number").map(x => [x.p, x]));
  let rows;
  if (group.dated[ds]){
    // حصص مُدخلة لهذا التاريخ: تحل محل الجدول الأسبوعي (ولكل حصة رابطها إن وُجد)
    rows = group.dated[ds].map(p => ({ kind:"p", p:p.p, subject:p.subject, teacher:p.teacher, link:p.link,
      start: p.start ?? tmap.get(p.p)?.start ?? null, end: p.end ?? tmap.get(p.p)?.end ?? null }));
  } else {
    const wd = dateOf(ds).getDay();
    if (wd > 4) return [];
    const per = group.periods.filter(p => p.day === "all" || p.day === wd);
    const byP = new Map(); per.forEach(p => { if (!byP.has(p.p) || p.day !== "all") byP.set(p.p, p); });
    rows = [...byP.values()].map(p => ({ kind:"p", p:p.p, subject:p.subject, teacher:p.teacher, start:tmap.get(p.p)?.start ?? null, end:tmap.get(p.p)?.end ?? null }));
  }
  // الفسحة تظهر في جدول الفصل الكامل فقط، لا في عرض مشرف المادة (حصص مادته فقط)
  if (rows.length && MODE !== "subject") T.filter(x => x.p === "break").forEach(b => rows.push({ kind:"b", label:b.label, start:b.start, end:b.end }));
  return rows.sort((a,b)=> (a.start ?? (a.p ?? 0)*1000) - (b.start ?? (b.p ?? 0)*1000) || (a.p ?? 0) - (b.p ?? 0));
}

const windowFor = gid => timingFor(gid).find(x => x.p === "window") || null;

/* حالة الفصل الآن */
function groupNow(rows, ds, gid){
  if (ds !== todayDs()) return null;
  if (!rows.length && dateOf(ds).getDay() > 4) return null;
  const n = nowMin();
  const timed = rows.filter(r => r.start != null);
  if (!timed.length){
    // لا يوجد جدول حصص: نعتمد على فترة إتاحة الرابط (مثل 6:30 ص – 2:30 م)
    const w = gid ? windowFor(gid) : null;
    if (!w) return null;
    const wEnd = w.end ?? 24*60;
    if (n >= w.start && n < wEnd) return { k:"open", w };
    if (n < w.start) return { k:"opens", m:w.start - n, w };
    return { k:"over" };
  }
  const cur = timed.find(r => n >= r.start && n < (r.end ?? r.start + 30));
  if (cur) return cur.kind === "b" ? { k:"brk", row:cur, next: timed.find(r => r.start >= (cur.end ?? 0) && r.kind === "p") } : { k:"live", row:cur };
  const first = timed[0], last = timed[timed.length-1];
  if (n < first.start) return { k:"before", m:first.start - n, row:first };
  if (n >= (last.end ?? last.start + 30)) return { k:"over" };
  const next = timed.find(r => r.start > n);
  return next ? { k:"gap", row:next, m:next.start - n } : null;
}

function renderNotices(){
  const box = document.getElementById("notices");
  const parts = [];
  if (LOAD_STATE === "setup") parts.push(notice("info", t("setupT"), t("setupD"), "#0EA5D6"));
  if (LOAD_STATE === "error") parts.push(notice("alert", t("errT"), t("errD"), "#E5383B", true));
  if (LOAD_STATE === "demo")  parts.push(notice("info", t("demo"), "", "#E8790A"));
  if (FALLBACK && LOAD_STATE === "ok") parts.push(notice("info", t("fbT"), t("fbD"), "#E8790A", true));
  box.innerHTML = parts.join("");
  box.querySelector("[data-retry]")?.addEventListener("click", refresh);
}
function notice(icon, title, desc, c, retry){
  return `<div class="notice" style="--c:${c}">${svg(icon)}<div><b>${esc(title)}</b>${desc ? `<p>${esc(desc)}</p>` : ""}${retry ? `<button type="button" data-retry>${esc(t("retry"))}</button>` : ""}</div></div>`;
}
function renderStatus(){
  const el = document.getElementById("updated");

  if (LOAD_STATE === "loading") el.textContent = t("loading");
  else if (signedIn && LAST_LOAD) el.textContent = t("updated") + LAST_LOAD.toLocaleTimeString(LANG === "ar" ? "ar-SA-u-nu-latn" : "en-US", {hour:"numeric", minute:"2-digit"});
  else el.textContent = "";
  document.getElementById("refreshBtn").hidden = !signedIn;
  document.getElementById("logoutBtn").hidden = !(signedIn && CODE);
}

/* كل الفصول التي فيها حصة جارية الآن (لمن يرى أكثر من صف) */
function liveNow(){
  const td = todayDs();
  const out = [];
  GROUPS.forEach(g=>{
    if (!ALLOWED.includes(g.grade)) return;
    const st = groupNow(timetable(g, td), td, g.grade);
    if (st && (st.k === "live" || st.k === "open")) out.push({ g, row: st.k === "live" ? st.row : null });
  });
  const order = Object.keys(GRADES);
  return out.sort((a,b)=> order.indexOf(a.g.grade) - order.indexOf(b.g.grade) || a.g.label.localeCompare(b.g.label, "ar"));
}
/* «الصف الأول الثانوي» / «Grade 7» — لتمييز الصفوف المتشابهة في قائمة الحصص الجارية */
function gradeFull(g){
  if (g.track.key === "american") return LANG === "ar" ? `${gradeName(g)} (Grade ${g.n})` : `Grade ${g.n}`;
  const adj = { primary:["الابتدائي","Primary"], middle:["المتوسط","Intermediate"], secondary:["الثانوي","Secondary"] }[g.stage.key] || ["",""];
  const sec = g.section.key === "girls" ? (LANG === "ar" ? " (بنات)" : " (Girls)") : "";
  return LANG === "ar" ? `${gradeName(g)} ${adj[0]}${sec}` : `${gradeName(g)} ${adj[1]}${sec}`;
}
/* صياغة العدد بالعربية: حصة واحدة / حصتان / 3 حصص / 11 حصة */
function liveCountText(n){
  if (LANG !== "ar") return t("liveCount",{n});
  if (n === 1) return "حصة واحدة جارية الآن";
  if (n === 2) return "حصتان جاريتان الآن";
  if (n % 100 >= 3 && n % 100 <= 10) return `${n} حصص جارية الآن`;
  return `${n} حصة جارية الآن`;
}
function groupTitlePlain(label){
  const m = label.match(/^([^:]+):\s*(.+)$/);
  return esc(m ? m[1].trim() : `${t("classes")} ${label}`);
}

/* بوابة الدخول: نموذج الرمز، أو (بعد الدخول) أزرار الصفوف المسموحة فقط */
function renderGate(){
  const box = document.getElementById("gate");
  const loginState = LOAD_STATE === "login" || (LOAD_STATE === "loading" && !GROUPS.length);
  if (loginState){
    const busy = LOAD_STATE === "loading";
    box.innerHTML = `
      <form class="login" id="loginForm" autocomplete="off">
        <span class="lock">${svg("lock")}</span>
        <h2>${esc(t("loginT"))}</h2>
        <p>${esc(t("loginD"))}</p>
        <div class="code-row">
          <input id="codeInput" inputmode="numeric" autocomplete="off" spellcheck="false" dir="ltr" maxlength="12"
            placeholder="• • • •" aria-label="${esc(t("loginT"))}" value="${esc(busy ? CODE : "")}" ${busy ? "disabled" : ""}>
          <button type="submit" ${busy ? "disabled" : ""}>${esc(busy ? t("checking") : t("enter"))}</button>
        </div>
        ${busy && RETRYING ? `<p class="login-note">${esc(t("retrying"))}</p>` : ""}
        ${LOGIN_ERR ? `<p class="login-err">${esc(t({expired:"errExpired", busy:"errBusy"}[LOGIN_ERR] || "errInvalid"))}</p>` : ""}
        <p class="login-note">${esc(t("loginNote"))}</p>
      </form>`;
    box.querySelector("#loginForm").addEventListener("submit", ev => { ev.preventDefault(); login(box.querySelector("#codeInput").value); });
    if (!busy) setTimeout(()=> box.querySelector("#codeInput")?.focus({preventScroll:true}), 0);
    return;
  }
  if (ALLOWED.length > 1){
    // تجميع الصفوف المسموحة حسب المسار/القسم/المرحلة، بأزرار صغيرة
    const groups = [];
    ALLOWED.forEach(id=>{
      const g = GRADES[id];
      const key = g.track.key + "|" + g.section.key + "|" + g.stage.key;
      let grp = groups.find(x => x.key === key);
      if (!grp){
        grp = { key, color:g.color, label: g.track.key === "american" ? L(g.track) : `${L(g.section)} · ${L(g.stage)}`, ids:[] };
        groups.push(grp);
      }
      grp.ids.push(id);
    });
    // اختيار اليوم: اليوم الحالي (الحصص الجارية الآن) أو يوم قادم (مراجعة الجداول المُدخلة)
    const td = todayDs();
    if (GATE_DS && GATE_DS < td) GATE_DS = null;
    const gds = GATE_DS || td, isToday = gds === td;
    const gChips = [...new Set([td, ...schoolDays(6).filter(d => d > td), gds])].sort().slice(0, 7);
    const dayBar = `<div class="gate-days"><span class="gd-l">${svg("cal")}${esc(t("gateDay"))}</span>
      <div class="gd-chips">${gChips.map(d => `<button type="button" class="chip${d === gds ? " on" : ""}${d === td ? " today" : ""}" data-gd="${d}">${esc(dayLabel(d))}</button>`).join("")}
      <input type="date" id="gateDate" value="${esc(gds)}" min="${esc(td)}" aria-label="${esc(t("gateDay"))}"></div></div>`;
    // الحصص الجارية الآن (لكل مرحلة ولكل صف)
    const live = isToday ? liveNow() : [];
    const liveIn = ids => live.filter(x => ids.includes(x.g.grade)).length;
    // مراجعة يوم قادم: لكل صف كم فصلًا له جدول في ذلك اليوم
    const plan = {}; const missing = [];
    if (!isToday) GROUPS.forEach(g => {
      if (!ALLOWED.includes(g.grade) || !(g.fixed || g.dated[gds])) return;
      const n = timetable(g, gds).filter(r => r.kind === "p").length;
      const P = plan[g.grade] = plan[g.grade] || { rooms:0, ready:0, periods:0, dated:0 };
      P.rooms++; P.periods += n; if (n) P.ready++; if (g.dated[gds]) P.dated++;
      if (!n) missing.push(g);
    });
    const planOf = ids => ids.reduce((a, id) => { const P = plan[id]; if (P){ a.rooms += P.rooms; a.ready += P.ready; a.periods += P.periods; a.dated += P.dated; } return a; }, { rooms:0, ready:0, periods:0, dated:0 });
    const stageBadge = ids => {
      const P = planOf(ids);
      if (!P.rooms) return `<span class="live-badge none">${esc(t("planNone"))}</span>`;
      if (P.ready === P.rooms) return `<span class="plan-badge ok">${esc(t("planReady",{n:P.periods}))}</span>`;
      return `<span class="plan-badge miss">${esc(t("planMissing",{n:P.rooms - P.ready, r:P.rooms}))}</span>`;
    };
    const gradeBadge = id => {
      const P = plan[id]; if (!P || !P.rooms) return "";
      return P.ready === P.rooms ? `<span class="n plan-n">${P.periods}</span>` : `<span class="n miss-n" title="${esc(t("planMissing",{n:P.rooms - P.ready, r:P.rooms}))}">!</span>`;
    };
    box.innerHTML = `<div class="picker"><div class="picker-top">${WHO ? `<div class="who">${svg("user")}<bdi>${esc(WHO)}</bdi></div>` : ""}
      ${EDITOR ? `<div class="pt-btns"><button type="button" class="ed-open rp-open" id="rpOpen">${svg("chart")}<span>${esc(t("rpOpen"))}</span></button><button type="button" class="ed-open" id="edOpen">${svg("edit")}<span>${esc(t("edOpen"))}</span></button></div>` : ""}</div>
      ${dayBar}
      <div class="pgroups">${groups.map(grp=>{ const n = liveIn(grp.ids); return `
        <div class="pgroup${n ? " has-live" : ""}" style="--c:${grp.color}">
          <div class="pg-name"><i aria-hidden="true"></i>${esc(grp.label)}
            ${isToday ? `<span class="live-badge${n ? "" : " none"}">${esc(n ? liveCountText(n) : t("noLive"))}</span>` : stageBadge(grp.ids)}</div>
          <div class="grades">${grp.ids.map(id=>{ const k = liveIn([id]); return `<button type="button" class="grade${SEL === id ? " on" : ""}" data-g="${id}" style="--c:${GRADES[id].color}" aria-pressed="${SEL === id}">${esc(gradeShort(GRADES[id]))}${isToday ? (k ? `<span class="n live-n">${k}</span>` : "") : gradeBadge(id)}</button>`; }).join("")}</div>
        </div>`; }).join("")}
      </div>
      ${!isToday ? (missing.length ? `<div class="now-list miss-list"><div class="now-h">${svg("alert")}${esc(t("planMissTitle",{d:dayLabel(gds), n:missing.length}))}</div>
        ${missing.sort((a,b)=> Object.keys(GRADES).indexOf(a.grade) - Object.keys(GRADES).indexOf(b.grade) || a.label.localeCompare(b.label,"ar")).map(x=>{ const g = GRADES[x.grade]; return `<div class="now-item" style="--c:${g.color}">
          <button type="button" class="now-main" data-g="${g.id}"><b>${esc(gradeFull(g))}</b>${x.label ? ` · ${groupTitlePlain(x.label)}` : ""}<span>${esc(t("planNoTT"))}</span></button></div>`; }).join("")}</div>`
        : `<div class="now-list ok-list"><div class="now-h">${esc(t("planAllReady",{d:dayLabel(gds)}))}</div></div>`) : ""}
      ${live.length ? `<div class="now-list"><div class="now-h"><i class="dot" aria-hidden="true"></i>${esc(t("liveNowTitle",{n:live.length}))}</div>
        ${live.map(x=>{ const g = GRADES[x.g.grade]; return `<div class="now-item" style="--c:${g.color}">
          <button type="button" class="now-main" data-g="${g.id}"><b>${esc(gradeFull(g))}</b>${x.g.label ? ` · ${groupTitlePlain(x.g.label)}` : ""}
            <span>${x.row ? `${esc(t("period",{n:x.row.p}))} — <bdi>${esc(x.row.subject || "")}</bdi>${x.row.teacher ? ` · <bdi>${esc(x.row.teacher)}</bdi>` : ""}` : esc(t("openNow"))}</span></button>
          ${(x.row?.link || x.g.link) ? `<a class="now-join" href="${esc(x.row?.link || x.g.link)}" target="_blank" rel="noopener">${svg("video")}<span>${esc(t("joinShort"))}</span></a>` : ""}
        </div>`; }).join("")}</div>` : ""}
      </div>`;
    box.querySelector("#edOpen")?.addEventListener("click", openEditor);
    box.querySelector("#rpOpen")?.addEventListener("click", openReport);
    box.querySelectorAll("[data-gd]").forEach(b => b.addEventListener("click", ()=>{ GATE_DS = b.dataset.gd === td ? null : b.dataset.gd; DAY = GATE_DS; renderGate(); renderPanel(); }));
    box.querySelector("#gateDate")?.addEventListener("change", e => { const v = normDate(e.target.value); if (v && v >= td){ GATE_DS = v === td ? null : v; DAY = GATE_DS; renderGate(); renderPanel(); } });
    box.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", ()=>{
      SEL = b.dataset.g; DAY = GATE_DS; renderGate(); renderPanel();
      document.getElementById("panel").scrollIntoView({ behavior:"smooth", block:"start" });
    }));
  } else box.innerHTML = "";
}

function renderPanel(){
  const p = document.getElementById("panel");
  p.hidden = !SEL || !GRADES[SEL];
  if (p.hidden){ p.innerHTML = ""; return; }
  const g = GRADES[SEL];
  p.style.setProperty("--c", g.color);
  const mine = GROUPS.filter(x => x.grade === SEL);
  const td = todayDs();
  const multiDay = hasDays(SEL);
  const day = DAY || defaultDs(SEL);
  // أزرار الأيام: 5 أيام دراسية قادمة + أي تاريخ فيه حصص مُدخلة
  const extra = [...new Set(mine.flatMap(x => Object.keys(x.dated)))].filter(d => d >= td);
  const chips = [...new Set([...schoolDays(5, day < td ? day : td), ...extra, day])].sort();
  const crumbs = [L(g.track), L(g.section), L(g.stage)].filter(Boolean);
  const sups = supsFor(SEL);

  p.innerHTML = `
    <div class="p-head">
      <div><div class="crumbs">${crumbs.map(esc).join(' <i>›</i> ')}</div><h2>${esc(gradeName(g))}</h2></div>
    </div>
    ${sups.length ? `<div class="contacts">${sups.map(s => `<div class="contact">${svg(s.phone ? "phone" : "user")}<span><bdi>${esc(s.role || "")}</bdi></span><b><bdi>${esc(s.name)}</bdi></b>${s.phone ? `<a href="${esc(telHref(s.phone))}">${esc(norm(s.phone))}</a>` : ""}</div>`).join("")}</div>` : ""}
    ${multiDay ? `<div class="chips" role="group">${chips.map(d=>`<button type="button" class="chip${day === d ? " on" : ""}${td === d ? " today" : ""}${mine.some(x => x.dated[d]) ? " has-dated" : ""}" data-day="${d}">${esc(dayLabel(d))}</button>`).join("")}</div>` : ""}
    ${mine.length ? `<div class="groups" id="groups"></div>` : `<div class="empty-state">${svg("cal")}<b>${esc(t("emptyT"))}</b><p>${esc(t("emptyD"))}</p></div>`}
  `;
  p.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", ()=>{ DAY = b.dataset.day; renderPanel(); }));
  renderGroups(day);
}

/* عنوان بطاقة الفصل: «أ / ب» ← «فصل أ / ب»، و«مستوى B: 1 / 2 / 3» ← «مستوى B» وتحته «الفصول: 1، 2، 3» */
function groupTitle(label){
  if (!label) return esc(t("allClasses"));
  const m = label.match(/^([^:]+):\s*(.+)$/);
  const list = parts => parts.split(/\s*\/\s*/).filter(Boolean).map(x => `<bdi>${esc(x)}</bdi>`).join("، ");
  if (m) return `<bdi>${esc(m[1].trim())}</bdi><small>${esc(t("classesList"))} ${list(m[2])}</small>`;
  return `${esc(t("classes"))} ${list(label).replace(/، /g, " / ")}`;
}

function renderGroups(dayArg){
  const box = document.getElementById("groups");
  if (!box) return;
  const td = todayDs();
  const day = dayArg || DAY || defaultDs(SEL);
  const n = nowMin();
  const g = GRADES[SEL];

  // فصل لم يعد موجودًا (ليس في الروابط ولا الجدول الأسبوعي) يظهر فقط في الأيام التي له فيها حصص مُدخلة
  box.innerHTML = GROUPS.filter(x => x.grade === SEL && (x.fixed || (x.dated[day] && x.dated[day].length)) && (MODE !== "subject" || timetable(x, day).length)).map(gr=>{
    const rows = timetable(gr, day);
    const st = groupNow(rows, day, gr.grade);
    const win = windowFor(gr.grade);
    const isToday = day === td;
    let badge = "", line = "";
    // الحصص المتوازية (نفس رقم الحصة — مثل المسارات الاختيارية) تظهر كلها
    const par = row => row ? rows.filter(r => r.kind !== "b" && r.p === row.p && r.start === row.start) : [];
    // مع الحصص المتوازية يبقى الزر الكبير على رابط الفصل الثابت، ولكل مادة زر «دخول» خاص بها
    const joinLink = (st?.k === "live" && par(st.row).length < 2 && st.row.link) || gr.link;
    // وقت الحصص المتوازية: يتقسم الزر الكبير لزر لكل مادة (برابطها، أو رابط الفصل إن لم يكن لها رابط)
    const liveSplit = st?.k === "live" ? par(st.row).filter(r => r.link || gr.link) : [];
    const subjs = row => { const l = par(row); return (l.length ? l : [row]).map(r => esc(r.subject || "")).join(" / "); };
    if (st?.k === "live"){
      badge = `<span class="badge live">${esc(t("live"))}</span>`;
      const ps = par(st.row);
      line = ps.length > 1
        ? `${esc(t("nowP"))}<b>${esc(t("period",{n:st.row.p}))}</b>${ps.map(r => `<span class="now-par"><b><bdi>${esc(r.subject || "—")}</bdi></b>${r.teacher ? ` · <bdi>${esc(r.teacher)}</bdi>` : ""}</span>`).join("")}`
        : `${esc(t("nowP"))}<b>${esc(t("period",{n:st.row.p}))} — <bdi>${esc(st.row.subject)}</bdi></b>${st.row.teacher ? ` · <bdi>${esc(st.row.teacher)}</bdi>` : ""}`;
    } else if (st?.k === "brk"){
      badge = `<span class="badge brk">${esc(isPrayer(st.row) ? brkName(st.row) : t("brkNow"))}</span>`;
      line = esc(isPrayer(st.row) ? t("brkUntilX",{n:brkName(st.row), t:fmtTime(st.row.end)}) : t("brkUntil",{t:fmtTime(st.row.end)})) + (st.next ? ` · ${esc(t("nextP"))}<b>${subjs(st.next)}</b>` : "");
    } else if (st?.k === "before"){
      if (st.m <= 60) badge = `<span class="badge soon">${esc(t("startsIn",{m:st.m}))}</span>`;
      line = esc(t("firstAt",{t:fmtTime(st.row.start)})) + ` — <b>${subjs(st.row)}</b>`;
    } else if (st?.k === "gap"){
      badge = `<span class="badge soon">${esc(t("startsIn",{m:st.m}))}</span>`;
      line = `${esc(t("nextP"))}<b>${subjs(st.row)}</b>`;
    } else if (st?.k === "open"){
      badge = `<span class="badge live">${esc(t("openNow"))}</span>`;
      line = esc(t("openUntil",{t:fmtTime(st.w.end)}));
    } else if (st?.k === "opens"){
      if (st.m <= 60) badge = `<span class="badge soon">${esc(t("opensIn",{m:st.m}))}</span>`;
      line = esc(t("opensAt",{t:fmtTime(st.w.start)}));
    } else if (st?.k === "over"){
      badge = `<span class="badge">${esc(t("dayOver"))}</span>`;
    }

    const tt = rows.length ? `<ol class="tt">${rows.map(r=>{
      const end = r.end ?? (r.start != null ? r.start + 30 : null);
      const cls = isToday && r.start != null ? (n >= end ? " past" : (n >= r.start ? " cur" : "")) : "";
      const tm = r.start != null ? `${fmtTime(r.start)}${r.end != null ? `<br>${fmtTime(r.end)}` : ""}` : "";
      return r.kind === "b"
        ? `<li class="brk${cls}"><span class="pn">${svg("cup")}</span><span class="sub"><b>${esc(brkName(r))}</b></span><span class="tm" data-now="${esc(t("now"))}">${tm}</span></li>`
        : `<li class="${cls.trim()}"><span class="pn">${r.p}</span><span class="sub"><b>${esc(r.subject || "—")}</b>${r.teacher ? `<span>${esc(r.teacher)}</span>` : ""}${r.link && r.link !== gr.link ? `<a class="row-link" data-room="${esc(gr.key)}" href="${esc(r.link)}" target="_blank" rel="noopener">${svg("video")}${esc(t("joinShort"))}</a>` : ""}</span><span class="tm" data-now="${esc(t("now"))}">${tm}</span></li>`;
    }).join("")}</ol>`
      : (win && dateOf(day).getDay() <= 4) ? `<p class="tt-empty tt-win">${svg("cal")}<span>${esc(t("winLine",{d:`${I18N[LANG].days[0]} – ${I18N[LANG].days[4]}`, a:fmtTime(win.start), b:fmtTime(win.end)}))}</span></p>`
      : `<p class="tt-empty">${esc(t("noTT"))}</p>`;

    return `<article class="group${["live","open"].includes(st?.k) ? " is-live" : ""}" style="--c:${g.color}">
      <div class="g-head">
        <div class="g-top"><h3 class="g-title">${groupTitle(gr.label)}</h3>${badge}</div>
        ${line ? `<p class="now-line">${line}</p>` : ""}
        ${gr.owner ? `<div class="meta"><span>${svg("user")}${esc(t("owner"))}: <bdi>${esc(gr.owner)}</bdi></span></div>` : ""}
        ${gr.note ? `<p class="note">${esc(gr.note)}</p>` : ""}
        ${liveSplit.length > 1
          ? `<div class="joins" style="--n:${Math.min(liveSplit.length,4)}">${liveSplit.map(r => `<a class="join" data-room="${esc(gr.key)}" href="${esc(r.link || gr.link)}" target="_blank" rel="noopener" title="${esc(r.teacher || "")}">${svg("video")}<bdi>${esc(r.subject || t("join"))}</bdi></a>`).join("")}</div>`
          : joinLink
          ? `<a class="join" data-room="${esc(gr.key)}" href="${esc(joinLink)}" target="_blank" rel="noopener">${svg("video")}${esc(t("join"))}</a>`
          : `<span class="join off">${esc(t("noLink"))}</span>`}
      </div>
      ${tt}
    </article>`;
  }).join("") || (MODE === "subject" ? `<div class="empty-state">${svg("cal")}<b>${esc(t("subjNone"))}</b></div>` : "");
}

/* ==================================================================
   نموذج إدخال الجداول والروابط (مديرو المراحل ومدير التعليم)
   ================================================================== */
const ED = { date:"", rows:[], loaded:new Set(), copy:new Set(), busy:false, msg:"", err:"", filter:"", tab:"periods", links:null };

async function postServer(body){
  const r = await fetch(SCRIPT_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return r.json();
}
// فصول المحرر: الفصول الثابتة (لها رابط أو جدول أسبوعي) + أي فصل له حصص مُدخلة في اليوم المفتوح في المحرر
// (الفصول المدموجة القديمة مثل «أ / ب» لا تظهر إلا في الأيام التي أُدخلت لها حصص فعلًا)
const edRooms = () => GROUPS.filter(g => ALLOWED.includes(g.grade) && (g.fixed || (ED.tab !== "links" && ED.date && g.dated[ED.date]?.length)))
  .sort((a,b)=> Object.keys(GRADES).indexOf(a.grade) - Object.keys(GRADES).indexOf(b.grade) || a.label.localeCompare(b.label,"ar"));
const roomName = g => `${gradeFull(GRADES[g.grade])}${g.label ? " · " + (g.label.match(/^([^:]+):/)?.[1] || g.label) : ""}`;
const hhmm = m => m == null ? "" : `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;

function openEditor(){
  ED.date = ED.date || defaultDs(ALLOWED[0]); ED.copy = new Set(); ED.msg = ""; ED.err = "";
  document.getElementById("editor").hidden = false; document.body.classList.add("ed-lock");
  loadDay(ED.date);
}
function closeEditor(){
  const e = document.getElementById("editor"); if (!e) return;
  e.hidden = true; document.body.classList.remove("ed-lock");
}
async function loadDay(ds){
  ED.date = ds; ED.busy = true; ED.rows = []; ED.loaded = new Set(); ED.err = ""; renderEditor();
  try{
    const r = await postServer({ action:"listDay", code:CODE, date:ds });
    if (!r.ok) throw new Error(r.error || "server");
    ED.rows = r.entries.map(x => ({ ...x }));
    ED.loaded = new Set(r.entries.map(x => x.room));
    ED.rows.sort((a,b)=> a.room.localeCompare(b.room) || (+a.p) - (+b.p));
  }catch(e){ ED.err = t("edLoadErr"); }
  ED.busy = false; renderEditor();
}
function defaultTimes(room, p){
  const g = GROUPS.find(x => x.key === room); if (!g) return {};
  const tm = timingFor(g.grade).find(x => x.p === +p);
  return tm ? { start:hhmm(tm.start), end:hhmm(tm.end) } : {};
}
function addRow(room){
  const rooms = edRooms(); room = room || ED.rows.at(-1)?.room || rooms[0]?.key || "";
  const used = ED.rows.filter(r => r.room === room).map(r => +r.p);
  const p = String(Math.max(0, ...used) + 1);
  ED.rows.push({ room, p, ...defaultTimes(room, p), subject:"", teacher:"", link:"" });
  renderEditor(); setTimeout(()=> { const rs = document.querySelectorAll(".ed-row"); rs[rs.length-1]?.querySelector("[data-f=subject]")?.focus(); }, 0);
}
/* إضافة كل حصص فصل دفعة واحدة حسب توقيت مرحلته */
function addFullDay(room){
  const g = GROUPS.find(x => x.key === room); if (!g) return;
  const periods = timingFor(g.grade).filter(x => typeof x.p === "number").map(x => x.p).sort((a,b)=>a-b);
  const list = periods.length ? periods : [1,2,3,4,5,6,7];
  const have = new Set(ED.rows.filter(r => r.room === room).map(r => +r.p));
  list.forEach(p => { if (!have.has(p)) ED.rows.push({ room, p:String(p), ...defaultTimes(room, p), subject:"", teacher:"", link:"" }); });
  ED.rows.sort((a,b)=> a.room.localeCompare(b.room) || (+a.p) - (+b.p));
  if (ED.filter) ED.filter = room;
  renderEditor();
}

function edTabs(){
  return `<div class="rp-tabs ed-tabs" role="tablist">
    <button type="button" class="rp-tab${ED.tab === "periods" ? " on" : ""}" data-tab="periods">${esc(t("edTabPeriods"))}</button>
    <button type="button" class="rp-tab${ED.tab === "links" ? " on" : ""}" data-tab="links">${esc(t("edTabLinks"))}</button></div>`;
}
function bindTabs(box){
  box.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", ()=>{
    ED.tab = b.dataset.tab; ED.msg = ""; ED.err = "";
    if (ED.tab === "links") ED.links = null;   // نبدأ من الروابط الحالية
    renderEditor();
  }));
}
/* ---- روابط الفصول الثابتة ---- */
function renderLinks(box){
  const rooms = edRooms();
  if (!ED.links) ED.links = Object.fromEntries(rooms.map(g => [g.key, { link:g.link || "", owner:g.owner || "", orig:(g.link || "") + "|" + (g.owner || "") }]));
  const changed = rooms.filter(g => { const x = ED.links[g.key]; return x && (x.link.trim() + "|" + x.owner.trim()) !== x.orig; }).length;
  box.innerHTML = edTabs() + `
    <p class="ed-hint">${esc(t("lkHint"))}</p>
    ${ED.err ? `<p class="login-err">${esc(ED.err)}</p>` : ""}
    <div class="ed-filter"><label>${esc(t("lkFilter"))}<select id="lkFilter"><option value="">${esc(t("lkAll",{n:rooms.length}))}</option>${rooms.map(g => `<option value="${esc(g.key)}"${ED.filter === g.key ? " selected" : ""}>${esc(roomName(g))}</option>`).join("")}</select></label></div>
    <div class="ed-rows">${rooms.filter(g => !ED.filter || g.key === ED.filter).map(g => { const x = ED.links[g.key]; const dirty = (x.link.trim() + "|" + x.owner.trim()) !== x.orig; return `
      <div class="ed-row lk-row${dirty ? " dirty" : ""}" data-room="${esc(g.key)}">
        <div class="ed-row-h"><b class="lk-name">${esc(roomName(g))}</b>${dirty ? `<span class="lk-badge">${esc(t("lkChanged"))}</span>` : ""}
          ${g.link ? `<a class="row-link" href="${esc(g.link)}" target="_blank" rel="noopener">${svg("video")}${esc(t("lkTest"))}</a>` : ""}</div>
        <label class="lk-link">${esc(t("lkLink"))}<input type="url" dir="ltr" data-f="link" value="${esc(x.link)}" placeholder="https://meet.google.com/..."></label>
        <label class="lk-owner">${esc(t("lkOwner"))}<input type="text" data-f="owner" value="${esc(x.owner)}" placeholder="${esc(t("lkOwnerPh"))}"></label>
      </div>`; }).join("")}</div>
    ${ED.msg ? `<p class="ed-ok">${esc(ED.msg)}</p>` : ""}`;
  bindTabs(box);
  box.querySelector("#lkFilter").addEventListener("change", e => { ED.filter = e.target.value; renderEditor(); });
  box.querySelectorAll(".lk-row").forEach(row => row.querySelectorAll("[data-f]").forEach(inp => inp.addEventListener("input", ()=>{
    const x = ED.links[row.dataset.room]; x[inp.dataset.f] = inp.value; ED.msg = "";
    const dirty = (x.link.trim() + "|" + x.owner.trim()) !== x.orig; row.classList.toggle("dirty", dirty); setSaveLabel();
  })));
  setSaveLabel(changed);
}
function setSaveLabel(){
  const sv = document.getElementById("edSave");
  if (ED.tab !== "links") return;
  const n = edRooms().filter(g => { const x = ED.links?.[g.key]; return x && (x.link.trim() + "|" + x.owner.trim()) !== x.orig; }).length;
  sv.disabled = ED.busy || !n;
  sv.querySelector("span").textContent = ED.busy ? t("checking") : (n ? t("lkSaveN",{n}) : t("lkSave"));
}
async function saveLinks(){
  const rooms = edRooms();
  const list = rooms.map(g => ({ g, x:ED.links[g.key] })).filter(({x}) => x && (x.link.trim() + "|" + x.owner.trim()) !== x.orig);
  if (!list.length) return;
  for (const {g, x} of list){
    const u = fixUrl(x.link);
    if (!u || !/^https:\/\/[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)){ ED.err = t("lkBad",{r:roomName(g)}); renderEditor(); return; }
    x.link = u;
  }
  ED.busy = true; ED.err = ""; ED.msg = ""; setSaveLabel();
  try{
    const r = await postServer({ action:"saveLinks", code:CODE, links: list.map(({g, x}) => ({ room:g.key, link:x.link.trim(), owner:x.owner.trim() })) });
    if (!r.ok) throw Object.assign(new Error(r.error), { res:r });
    ED.msg = t("lkSaved",{n:r.saved}); ED.links = null;
    await refresh();
  }catch(e){
    const r = e.res || {};
    ED.err = r.error === "link" ? t("lkBad",{r:r.room || ""}) : r.error === "invalid" ? t("errExpired") : r.error === "busy" ? t("edBusy") : t("edSaveErr");
  }
  ED.busy = false; renderEditor();
}

  if (ED.tab === "links"){ document.getElementById("edWho").textContent = WHO || ""; renderLinks(box); return; }
  const rooms = edRooms();

  document.getElementById("edWho").textContent = WHO || "";
  box.innerHTML = edTabs() + `
    <div class="ed-date">

      <select id="edFilter"><option value="">${esc(t("edFilterAll",{n:ED.rows.length}))}</option>${rooms.map(g => { const n = ED.rows.filter(r => r.room === g.key).length; return `<option value="${esc(g.key)}"${ED.filter === g.key ? " selected" : ""}>${esc(roomName(g))} (${n})</option>`; }).join("")}</select></label>
      ${ED.filter ? `<button type="button" class="ed-btn ghost sm" id="edFilterClear">${esc(t("edFilterClear"))}</button>` : ""}</div>` : ""}
    <datalist id="edSubjects">${SUBJECTS.map(x => `<option value="${esc(x.name)}"></option>`).join("")}</datalist>
    <div class="ed-rows">${ED.rows.length ? ED.rows.map((r,i)=> ED.filter && r.room !== ED.filter ? "" : `
      <div class="ed-row" data-i="${i}">
        <div class="ed-row-h"><b>${i+1}</b>
          <button type="button" class="ed-ic" data-act="dup" title="${esc(t("edDup"))}">${svg("copy2")}</button>
          <button type="button" class="ed-ic danger" data-act="del" title="${esc(t("edDel"))}">${svg("trash")}</button></div>
        <label class="w3">${esc(t("edRoom"))}<select data-f="room">${opts(r.room)}</select></label>
        <label class="w1 wp">${esc(t("edPeriod"))}<select data-f="p">${[1,2,3,4,5,6,7,8].map(n=>`<option${+r.p === n ? " selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="w1">${esc(t("edFrom"))}<input type="time" data-f="start" value="${esc(r.start || "")}"></label>
        <label class="w1">${esc(t("edTo"))}<input type="time" data-f="end" value="${esc(r.end || "")}"></label>
        <label>${esc(t("edSubject"))}<input type="text" data-f="subject" list="edSubjects" autocomplete="off" value="${esc(r.subject || "")}" placeholder="${esc(t("edSubjectPh"))}">${subjHint(r.subject)}</label>
        <label>${esc(t("edTeacher"))}<input type="text" data-f="teacher" value="${esc(r.teacher || "")}" placeholder="${esc(t("edTeacherPh"))}"></label>
        <label>${esc(t("edLink"))}<input type="url" dir="ltr" data-f="link" value="${esc(r.link || "")}" placeholder="https://meet.google.com/..."></label>
      </div>`).join("") + (ED.filter && !ED.rows.some(r => r.room === ED.filter) ? `<div class="empty-state">${svg("cal")}<b>${esc(t("edFilterNone"))}</b></div>` : "") : `<div class="empty-state">${svg("cal")}<b>${esc(t("edEmpty"))}</b></div>`}
    </div>
    <div class="ed-add">
      <button type="button" class="ed-btn" id="edAdd">${svg("plus")}${esc(t("edAdd"))}</button>
      <span class="ed-or">${esc(t("edOr"))}</span>
      <select id="edFullRoom"><option value="">${esc(t("edFullPick"))}</option>${opts("")}</select>

      <div class="ed-days">${nextDays.map(d => `<label class="ed-day"><input type="checkbox" data-copy="${d}"${ED.copy.has(d) ? " checked" : ""}>${esc(dayLabel(d))}</label>`).join("")}</div>
    </details>`}
    ${ED.msg ? `<p class="ed-ok">${esc(ED.msg)}</p>` : ""}`;

  // الأحداث
  bindTabs(box);
  box.querySelector("#edDate")?.addEventListener("change", e => { const v = normDate(e.target.value); if (v) { ED.copy.clear(); ED.msg = ""; loadDay(v); } });
  box.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", ()=>{ ED.copy.clear(); ED.msg = ""; loadDay(b.dataset.d); }));
  box.querySelectorAll(".ed-row").forEach(row=>{

    subj.addEventListener("change", ()=>{ const m = findSubject(subj.value); if (m && m.name !== subj.value.trim()){ subj.value = m.name; ED.rows[i].subject = m.name; } subj.parentNode.querySelector(".subj-hint").outerHTML = subjHint(subj.value); });
    row.querySelectorAll("[data-f]").forEach(inp => inp.addEventListener("input", ()=>{
      const f = inp.dataset.f; ED.rows[i][f] = inp.value; ED.msg = "";
      if (f === "subject"){ const h = inp.parentNode.querySelector(".subj-hint"); if (h) h.outerHTML = subjHint(inp.value); }
      if (f === "room" || f === "p"){ const d = defaultTimes(ED.rows[i].room, ED.rows[i].p); if (d.start){ ED.rows[i].start = d.start; ED.rows[i].end = d.end; renderEditor(); } }
    }));
    row.querySelector("[data-act=del]").addEventListener("click", ()=>{ ED.rows.splice(i,1); ED.msg = ""; renderEditor(); });
    row.querySelector("[data-act=dup]").addEventListener("click", ()=>{ const c = { ...ED.rows[i], p:String(+ED.rows[i].p + 1) }; Object.assign(c, defaultTimes(c.room, c.p)); ED.rows.splice(i+1, 0, c); renderEditor(); });
  });
  box.querySelector("#edAdd")?.addEventListener("click", ()=> addRow(ED.filter || undefined));
  box.querySelector("#edFilter")?.addEventListener("change", e => { ED.filter = e.target.value; renderEditor(); });
  box.querySelector("#edFilterClear")?.addEventListener("click", ()=>{ ED.filter = ""; renderEditor(); });
  box.querySelector("#edFullRoom")?.addEventListener("change", e => { if (e.target.value) addFullDay(e.target.value); });
  const sv = document.getElementById("edSave");
  const label = () => { sv.disabled = ED.busy; sv.querySelector("span").textContent = ED.busy ? t("checking") : (ED.copy.size ? t("edSaveN",{n:ED.copy.size+1}) : t("edSave")); };
  box.querySelectorAll("[data-copy]").forEach(c => c.addEventListener("change", ()=>{ c.checked ? ED.copy.add(c.dataset.copy) : ED.copy.delete(c.dataset.copy); label(); }));
  label();
}

/* تلميح تحت خانة المادة: لمن تتبع؟ */
function subjHint(v){
  v = String(v || "").trim();
  if (!v || !SUBJECTS.length) return `<span class="subj-hint"></span>`;
  const m = findSubject(v);
  if (!m) return `<span class="subj-hint warn">${esc(t("subjUnknown"))}</span>`;
  const alias = m.name !== v ? ` — ${esc(t("subjSaveAs",{n:m.name}))}` : "";
  return m.sup ? `<span class="subj-hint ok">${esc(t("subjOwner",{s:m.sup}))}${alias}</span>`
               : `<span class="subj-hint none">${esc(t("subjNoSup"))}${alias}</span>`;
}

async function saveEditor(){
  // تحقق سريع قبل الإرسال
  for (let i = 0; i < ED.rows.length; i++){
    const r = ED.rows[i];
    if (!r.room || !r.p || !String(r.subject || "").trim()){ ED.err = t("edNeed",{n:i+1}); renderEditor(); return; }
    if (r.link && !/^https:\/\/[\w.-]+\.[a-z]{2,}(\/|$)/i.test(r.link.trim())){ ED.err = t("edBadLink",{n:i+1}); renderEditor(); return; }
  }
  // توحيد أسماء المواد قبل الحفظ، والتنبيه على المواد غير الموجودة في القائمة
  ED.rows.forEach(r => { const m = findSubject(r.subject); if (m) r.subject = m.name; });
  const unknown = SUBJECTS.length ? [...new Set(ED.rows.filter(r => !findSubject(r.subject)).map(r => r.subject.trim()))] : [];
  if (unknown.length && !confirm(t("subjConfirm",{l:unknown.join("، ")}))) { renderEditor(); return; }
  const dates = [ED.date, ...[...ED.copy].sort()];
  const rooms = [...new Set([...ED.loaded, ...ED.rows.map(r => r.room)])];
  ED.busy = true; ED.err = ""; ED.msg = ""; renderEditor();
  try{
    const r = await postServer({ action:"saveDays", code:CODE, dates, rooms, entries: ED.rows.map(x => ({ room:x.room, p:x.p, start:x.start, end:x.end, subject:x.subject, teacher:x.teacher, link:(x.link||"").trim() })) });
    if (!r.ok) throw Object.assign(new Error(r.error), { res:r });
    ED.msg = t("edSaved",{n:ED.rows.length, d:r.dates}); ED.copy.clear(); ED.loaded = new Set(ED.rows.map(x => x.room));
    refresh();
  }catch(e){
    const r = e.res || {};
    ED.err = ({ link:t("edBadLink",{n:r.row}), subject:t("edNeed",{n:r.row}), period:t("edNeed",{n:r.row}), room:t("edRoomErr",{n:r.row}),
                invalid:t("errExpired"), busy:t("edBusy") })[r.error] || t("edSaveErr");
  }
  ED.busy = false; renderEditor();
}

/* ==================================================================
   تسجيل الدخول إلى الحصة (للتقرير اليومي) — من رمز فصل فقط
   كل جهاز له معرّف عشوائي لا يحمل أي بيانات شخصية؛ يُرسل مرة كل 10 دقائق لكل فصل على الأكثر
   ================================================================== */
function deviceId(){
  let d = LS.get("ol-dev");
  if (!/^[a-z0-9]{6,32}$/i.test(d || "")){ d = Array.from(crypto.getRandomValues(new Uint8Array(10)), b => (b % 36).toString(36)).join(""); LS.set("ol-dev", d); }
  return d;
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-room]");
  if (!a || MODE !== "class" || !CODE || !SCRIPT_URL || isDemo()) return;
  // التقرير يحسب كل جهاز مرة واحدة لكل فصل في اليوم: نرسل الدخول مرة واحدة فقط يوميًا لكل فصل
  const k = "ol-j-" + a.dataset.room, day = todayDs();
  if (LS.get(k) === day) return;
  LS.set(k, day);
  const q = joinQueue(); q.push({ code:CODE, room:a.dataset.room, day, at:Date.now() }); LS.set("ol-jq", JSON.stringify(q));
  // يُرسل بعد لحظات، أو فورًا عند انتقال الطالب إلى Meet (اختفاء الصفحة) — ويبقى محفوظًا إن انقطع الاتصال
  setTimeout(flushJoins, 1500 + Math.random() * 3000);
});
document.addEventListener("visibilitychange", ()=>{ if (document.hidden) flushJoins(true); });
window.addEventListener("pagehide", ()=> flushJoins(true));
function joinQueue(){ try{ const q = JSON.parse(LS.get("ol-jq") || "[]"); return Array.isArray(q) ? q : []; }catch(e){ return []; } }
function flushJoins(now){
  if (!SCRIPT_URL || isDemo()) return;
  const td = todayDs(), all = joinQueue().filter(x => x.day === td);   // ضغطات أيام سابقة لا تُحسب
  const q = all.filter(x => now || Date.now() - x.at > 1000), keep = all.filter(x => !q.includes(x));
  q.forEach(x => {
    const body = JSON.stringify({ action:"join", code:x.code, room:x.room, dev:deviceId() });
    try{
      if (!(navigator.sendBeacon && navigator.sendBeacon(SCRIPT_URL, new Blob([body], { type:"text/plain;charset=utf-8" }))))
        fetch(SCRIPT_URL, { method:"POST", mode:"no-cors", keepalive:true, headers:{ "Content-Type":"text/plain;charset=utf-8" }, body });
    }catch(err){}
  });
  LS.set("ol-jq", JSON.stringify(keep));
  if (keep.length) setTimeout(flushJoins, 6000);
}

const RP = { date:"", data:null, stage:"", open:"", busy:false, err:"" };
function openReport(){
  RP.date = RP.date || todayDs(); RP.err = "";
  document.getElementById("report").hidden = false; document.body.classList.add("ed-lock");
  loadReport(RP.date);
}
function closeReport(){
  const e = document.getElementById("report"); if (!e) return;
  e.hidden = true; document.body.classList.remove("ed-lock");
}
async function loadReport(ds, force){
  RP.date = ds; RP.busy = true; RP.err = ""; renderReport();
  try{
    const r = await postServer({ action:"report", code:CODE, date:ds, force:!!force });
    if (!r.ok) throw Object.assign(new Error(r.error), { res:r });
    RP.data = r;
    if (!r.stages.some(s => s.key === RP.stage)) RP.stage = r.stages[0]?.key || "";
  }catch(e){ RP.data = null; RP.err = e.res?.error === "invalid" ? t("errExpired") : t("rpErr"); }
  RP.busy = false; renderReport();
}
/* الأيام الدراسية الماضية (الأحد–الخميس) حتى اليوم */
function pastSchoolDays(n){
  const out = []; const d = new Date(); d.setHours(12,0,0,0);
  while (out.length < n){ if (d.getDay() <= 4) out.push(dsOf(d)); d.setDate(d.getDate()-1); }
  return out.reverse();
}

      ${D.source !== "meet" ? `<br><span>${esc(t("rpClicksNote"))}</span>` : ""}</p>

      ${card("t", "#E8790A", "users", t("rpTeachers"), S.teachers, S.teachersPlanned, t("rpTeachersSub"), S.byTeacher.map(x => row(x.name, x.done, x.planned)).join(""))}

function bindReport(box){
  box.querySelector("#rpDate")?.addEventListener("change", e => { const v = normDate(e.target.value); if (v && v <= todayDs()) loadReport(v); });

  box.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", ()=>{ RP.open = RP.open === b.dataset.open ? "" : b.dataset.open; renderReport(); }));
  box.querySelector("#rpRe")?.addEventListener("click", ()=> loadReport(RP.date, true));
  box.querySelector("#rpPdf")?.addEventListener("click", exportReportPdf);
}

  const w = window.open("", "_blank");

  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  return decodeURIComponent(m[1]).trim();
}

  LANG = [q, LS.get("lang")].find(v => v === "ar" || v === "en") || "ar";
  // رابط الدخول المباشر من رسالة واتساب: ...online-learning.html#c=1234
  // يُحفظ الرمز ثم يُحذف من شريط العنوان فورًا حتى لا يبقى ظاهرًا أو يُنسخ مع الرابط
  const hc = takeHashCode();
  if (hc && hc !== CODE){ CODE = hc; LS.set("ol-code", CODE); LS.set("ol-cache", ""); }
  LOAD_STATE = (CODE && SCRIPT_URL) ? "loading" : "login";
  // عرض آخر بيانات محفوظة على الجهاز فورًا، ثم تحديثها من الخادم
  try{
    const c = JSON.parse(LS.get("ol-cache") || "null");
    if (CODE && c && c.code === CODE && c.res && c.res.ok){ applyResponse(c.res); LOAD_STATE = "ok"; LAST_LOAD = new Date(c.at); }
  }catch(e){}
  applyLang(LANG);
  refresh();
  const every = (AUTO_REFRESH_MIN + Math.random() * 2) * 60000;
  setInterval(()=>{ if ((CODE || isDemo()) && !document.hidden) refresh(); }, every);
  document.addEventListener("visibilitychange", ()=>{
    if (!document.hidden && (CODE || isDemo()) && (!LAST_LOAD || Date.now() - LAST_LOAD.getTime() > every)) refresh();
  });
  flushJoins();
  setInterval(()=>{ renderGroups(); if (ALLOWED.length > 1 && (LOAD_STATE === "ok" || LOAD_STATE === "demo")) renderGate(); }, 30000);   // تحديث «مباشر الآن» والحصة الحالية
})();
</script>
</body>
</html>
