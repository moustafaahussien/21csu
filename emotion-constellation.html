","strength":0.4}]},{"id":"joy","label":"Joy","links":[{"needId":"growth","inquiry":"Am I noticing my own expansion or aliveness?","strength":0.7},{"needId":"meaning","inquiry":"What makes life feel worth living right now?","strength":0.5}]},{"id":"impatience","label":"Impatience","links":[{"needId":"growth","inquiry":"What's holding me back?","strength":0.7},{"needId":"achievement","inquiry":"Why isn't progress happening faster?","strength":0.5}]},{"id":"depression","label":"Depression","links":[{"needId":"growth","inquiry":"Do I really want to move forward?","strength":0.7},{"needId":"meaning","inquiry":"What has lost its purpose?","strength":0.6}]},{"id":"boredom","label":"Boredom","links":[{"needId":"growth","inquiry":"Is it time to learn or explore?","strength":0.8}]},{"id":"sadness","label":"Sadness","links":[{"needId":"belonging","inquiry":"What connection has been lost or is missing?","strength":0.8},{"needId":"meaning","inquiry":"What do I care about so much that losing it hurts?","strength":0.6}]},{"id":"anxiety","label":"Anxiety","links":[{"needId":"safety","inquiry":"What do I care about that feels at risk?","strength":0.8},{"needId":"achievement","inquiry":"Am I prepared enough for what's ahead?","strength":0.5}]},{"id":"gratitude","label":"Gratitude","links":[{"needId":"belonging","inquiry":"What connections and gifts have I been given?","strength":0.7},{"needId":"meaning","inquiry":"What richness is already present in my life?","strength":0.6}]},{"id":"hope","label":"Hope","links":[{"needId":"meaning","inquiry":"What opportunities do I see to move toward what I want?","strength":0.7},{"needId":"growth","inquiry":"What am I ready to grow into?","strength":0.6}]},{"id":"compassion","label":"Compassion","links":[{"needId":"belonging","inquiry":"How can I stay present with suffering — mine or others'?","strength":0.7},{"needId":"growth","inquiry":"What is this pain teaching me about what matters?","strength":0.5}]},{"id":"grief","label":"Grief","links":[{"needId":"belonging","inquiry":"What bond has been broken or transformed?","strength":0.9},{"needId":"meaning","inquiry":"How do I make sense of this loss?","strength":0.7}]},{"id":"stress","label":"Stress","links":[{"needId":"safety","inquiry":"Are my challenges greater than my resources?","strength":0.7},{"needId":"achievement","inquiry":"What do I need to prioritize or let go of?","strength":0.5}]},{"id":"overwhelm","label":"Overwhelm","links":[{"needId":"safety","inquiry":"What is too much right now?","strength":0.7},{"needId":"autonomy","inquiry":"Where have I lost the ability to choose?","strength":0.6}]},{"id":"contentment","label":"Contentment","links":[{"needId":"safety","inquiry":"What is settled and at peace right now?","strength":0.6},{"needId":"meaning","inquiry":"Am I aligned with what matters?","strength":0.6}]},{"id":"courage","label":"Courage","links":[{"needId":"safety","inquiry":"What am I willing to risk for what I care about?","strength":0.6},{"needId":"growth","inquiry":"What becomes possible if I move through this fear?","strength":0.7}]},{"id":"disgust","label":"Disgust","links":[{"needId":"safety","inquiry":"What rules have been violated? Is this situation safe?","strength":0.8},{"needId":"belonging","inquiry":"Does this align with the values of my community?","strength":0.4}]},{"id":"exhaustion","label":"Exhaustion","links":[{"needId":"achievement","inquiry":"Have I been pushing too hard without return?","strength":0.7},{"needId":"meaning","inquiry":"Has the purpose behind my effort disappeared?","strength":0.6},{"needId":"belonging","inquiry":"Am I trying to do this alone?","strength":0.4}]}]}</script><script type="application/json" id="data-more-info">{"version":"1.0","source":"Emotion Rules by Joshua Freedman (2026)","sourceUrl":"https://emotionrules.com","needs":[{"id":"safety","label":{"en":"Safety","ar":"الأمان"},"description":{"en":"Deep in our neural architecture, the drive for safety is primary. Our brains are wired to detect and respond to threats, often before we're consciously aware of them.","ar":"أشعر بالأمان عندما أعرف أنني محميّ ومدعوم، وأستطيع أن أواجه الموقف دون أن أشعر بأنني في خطر."},"color":"#1a3a6b","colorSecondary":"#3366cc"},{"id":"belonging","label":{"en":"Belonging","ar":"الانتماء"},"description":{"en":"These social emotions run deep. They shape behavior, values, even self-image. They invite reflection on how and where we seek connection.","ar":"أحتاج إلى الشعور بأنني مقبول ومهمّ، وأن لديّ أشخاصًا أستطيع التواصل معهم وأكون معهم على طبيعتي."},"color":"#8b6914","colorSecondary":"#d4a832"},{"id":"autonomy","label":{"en":"Autonomy","ar":"الاستقلالية"},"description":{"en":"Autonomy is a quiet need, until it's taken away; then emotions flare. These signals push us to reclaim authorship of our own lives.","ar":"أحتاج إلى مساحة لأختار وأعبّر عن رأيي وأشارك في قرارات تخصني، مع تحمّل مسؤولية اختياراتي."},"color":"#0d6b6e","colorSecondary":"#2cc4c9"},{"id":"achievement","label":{"en":"Achievement","ar":"الإنجاز"},"description":{"en":"This family of emotions energizes action and asks us to recalibrate. They guide us through ambition, readiness, and challenge.","ar":"أحتاج إلى الشعور بأنني أتقدّم وأتعلم وأبذل جهدًا له قيمة، وأستطيع مواجهة التحديات وتحقيق أهدافي."},"color":"#8b3a1a","colorSecondary":"#e06030"},{"id":"meaning","label":{"en":"Meaning","ar":"المعنى"},"description":{"en":"These emotions reflect the search for something beyond survival, for what makes life feel meaningful. They orient us toward values and vision.","ar":"أحتاج إلى أن أشعر بأن ما أفعله له قيمة وهدف، وأنه يرتبط بما أؤمن به وما أريد أن أصنعه في حياتي."},"color":"#4a1a6b","colorSecondary":"#8844bb"},{"id":"growth","label":{"en":"Growth","ar":"النمو"},"description":{"en":"Growth is rarely linear. These feelings often come in waves, pointing us toward discomfort that precedes insight.","ar":"أحتاج إلى أن أتعلم وأتطور وأجرب أشياء جديدة، حتى لو كان التعلم أحيانًا مصحوبًا بصعوبة أو عدم ارتياح."},"color":"#1a6b2a","colorSecondary":"#33cc55"}],"emotions":[{"id":"trust","label":{"en":"Trust","ar":"الثقة"},"needs":[{"needId":"safety","inquiry":{"en":"Do I have support and protection?","ar":"هل أشعر أنني آمن ومدعوم؟"},"strength":0.9},{"needId":"belonging","inquiry":{"en":"Are the bonds around me reliable?","ar":"هل أشعر أن الأشخاص من حولي جديرون بالثقة؟"},"strength":0.5}],"readMore":{"essence":{"en":"A feeling of security and confidence in people, systems, or yourself — a signal that the rules are in place and you are accepted.","ar":"شعور بالأمان والثقة بالناس أو بالأنظمة أو بنفسك — إشارة إلى أن القواعد قائمة وأنك مقبول."},"signal":{"en":"Trust is your system saying: it's safe here. When trust is present, you can open up, collaborate, and invest in relationships. Trust tells us about safety — the rules are in place, and we feel accepted as part of the system. It's also the foundation of belonging; without it, connection stays shallow.","ar":"الثقة رسالة من داخلك تقول: أنت في أمان هنا. وحين تحضر الثقة يمكنك أن تنفتح وتتعاون وتستثمر في علاقاتك. فهي تخبرنا عن الأمان — القواعد قائمة، ونشعر بأننا مقبولون جزءًا من المنظومة. والثقة كذلك أساس الانتماء؛ فبدونها يبقى التواصل سطحيًا."},"reflection":{"en":"Where in your life is trust present — and where might you be withholding it?","ar":"أين تحضر الثقة في حياتك — وأين قد تحجبها؟"},"bookRef":{"en":"Emotion Rules, pp. 75, 81","ar":"Emotion Rules، ص. 75، 81"}}},{"id":"fear","label":{"en":"Fear","ar":"الخوف"},"needs":[{"needId":"safety","inquiry":{"en":"What is it that I care about, and what is the risk?","ar":"ما الشيء المهم الذي أخشى أن يتأذى أو يضيع؟"},"strength":0.9}],"readMore":{"essence":{"en":"An alert that something you care about may be at risk — your system's way of sharpening your attention toward what matters most.","ar":"تنبيه بأن شيئًا يهمّك قد يكون في خطر — طريقة نظامك الداخلي في توجيه انتباهك نحو ما يهمّ أكثر."},"signal":{"en":"Fear is not a sign of weakness; it's a sign of caring. Fear sharpens your attention and prepares you to protect. The deeper question isn't 'how do I stop being afraid?' but 'what do I love enough to feel afraid about losing?' Fear and love are two sides of commitment — love deepens it, fear occurs when we perceive risk to what we love.","ar":"الخوف ليس علامة ضعف، بل علامة اهتمام؛ فهو يشحذ انتباهك ويهيّئك للحماية. والسؤال الأعمق ليس «كيف أتوقف عن الخوف؟» بل «ما الذي أحبه إلى حدّ أن أخاف فقدانه؟». الخوف والحب وجهان للالتزام: الحب يعمّق التزامنا، والخوف ينشأ حين نستشعر خطرًا يهدّد ما نحب."},"reflection":{"en":"What would it look like to stay with this fear and listen to what it's protecting?","ar":"كيف يكون الأمر لو بقيت مع هذا الخوف واستمعت إلى ما يحميه؟"},"bookRef":{"en":"Emotion Rules, pp. 51, 75, 81","ar":"Emotion Rules، ص. 51، 75، 81"}}},{"id":"vigilance","label":{"en":"Vigilance","ar":"اليقظة"},"needs":[{"needId":"safety","inquiry":{"en":"What's coming next?","ar":"ما الذي أحتاج إلى الانتباه إليه الآن؟"},"strength":0.8}],"readMore":{"essence":{"en":"A heightened state of alertness and watchfulness — your mind scanning for what might be changing around you.","ar":"حالة من التيقّظ والترقّب المتزايدين — عقلك يرصد ما قد يتغيّر من حولك."},"signal":{"en":"Vigilance is an intense form of anticipation focused on safety. It's your brain in active monitoring mode, looking for signals of change. While it can be exhausting if sustained, it serves a purpose: keeping you one step ahead. The question is whether the scanning is helping you prepare or keeping you stuck in reactive mode.","ar":"اليقظة شكل مكثّف من الترقّب يتمحور حول الأمان؛ إنها دماغك في وضع المراقبة النشطة، يبحث عن إشارات التغيير. وقد تصبح مُتعِبة إذا طالت، لكنها تؤدي غرضًا: أن تبقيك متقدّمًا بخطوة. والسؤال هو: هل يساعدك هذا الرصد على الاستعداد، أم يُبقيك عالقًا في ردّ الفعل؟"},"reflection":{"en":"Is your vigilance helping you prepare, or is it keeping you from being present?","ar":"هل تساعدك يقظتك على الاستعداد، أم تمنعك من أن تكون حاضرًا؟"},"bookRef":{"en":"Emotion Rules, pp. 52, 81","ar":"Emotion Rules، ص. 52، 81"}}},{"id":"surprise","label":{"en":"Surprise","ar":"المفاجأة"},"needs":[{"needId":"safety","inquiry":{"en":"What just changed, and how do I need to adapt?","ar":"ما الذي تغيّر فجأة، وما الذي يساعدني على التكيف؟"},"strength":0.7},{"needId":"growth","inquiry":{"en":"What is new here for me to learn?","ar":"ما الشيء الجديد الذي يمكنني أن أتعلمه؟"},"strength":0.4}],"readMore":{"essence":{"en":"A sudden jolt of recognition that something unexpected has happened — your brain's rapid-response system to novelty.","ar":"هزّة مفاجئة من الإدراك بأن أمرًا غير متوقع قد حدث — نظام الاستجابة السريعة في دماغك لكل ما هو جديد."},"signal":{"en":"Surprise interrupts your current mental model and forces an update. It serves both safety (something changed — adapt!) and growth (something new — learn!). Surprise is the emotion that bridges the familiar and the unknown. It's brief, but it opens a window where you're especially receptive to new information.","ar":"المفاجأة تقطع تصوّرك الذهني الحالي وتفرض عليك تحديثه. وهي تخدم الأمان (شيء تغيّر — تكيّف!) والنمو (شيء جديد — تعلّم!). إنها العاطفة التي تصل المألوف بالمجهول؛ قصيرة، لكنها تفتح نافذة تكون فيها أكثر تقبّلًا للمعلومات الجديدة."},"reflection":{"en":"When you're surprised, what does your first reaction tell you about what you were expecting?","ar":"حين تُفاجأ، ماذا يخبرك ردّ فعلك الأول عمّا كنت تتوقعه؟"},"bookRef":{"en":"Emotion Rules, pp. 51, 81","ar":"Emotion Rules، ص. 51، 81"}}},{"id":"loneliness","label":{"en":"Loneliness","ar":"الوحدة"},"needs":[{"needId":"belonging","inquiry":{"en":"Am I disconnected from others or myself?","ar":"مع من أحتاج إلى تواصل أو قرب أكبر؟"},"strength":0.9}],"readMore":{"essence":{"en":"An aching sense of disconnection — a signal that your need for meaningful human contact is unmet.","ar":"شعور مؤلم بالانفصال — إشارة إلى أن حاجتك إلى تواصل إنساني حقيقي وعميق لم تُلبَّ."},"signal":{"en":"Loneliness is not the same as being alone. You can be surrounded by people and feel lonely, or be by yourself and feel connected. Loneliness is a signal about the quality of connection, not the quantity. It's checking: do I belong? Am I seen? Sometimes it's pointing to disconnection from others; sometimes it's about disconnection from yourself.","ar":"الشعور بالوحدة يختلف عن الانفراد الجسدي؛ فقد تكون محاطًا بالناس وتشعر بالوحدة، وقد تكون بمفردك وتشعر بالتواصل. الوحدة إشارة إلى جودة التواصل لا كمّيّته، وهي تسأل: هل أنتمي؟ هل يراني أحد؟ وقد تدلّ أحيانًا على انفصال عن الآخرين، وأحيانًا على انفصال عن ذاتك."},"reflection":{"en":"Is this loneliness about needing more people, or about needing deeper connection with the people — or the person — already here?","ar":"هل تتعلّق هذه الوحدة بحاجتك إلى مزيد من الناس، أم بحاجتك إلى تواصل أعمق مع مَن هم هنا بالفعل — ناسًا كانوا أو شخصًا واحدًا؟"},"bookRef":{"en":"Emotion Rules, p. 82","ar":"Emotion Rules، ص. 82"}}},{"id":"love","label":{"en":"Love","ar":"الحب"},"needs":[{"needId":"belonging","inquiry":{"en":"What bonds are worth cherishing and strengthening?","ar":"من أو ما الذي أقدّره وأريد أن أحافظ على علاقتي به؟"},"strength":0.9},{"needId":"safety","inquiry":{"en":"What do I care so much about that I fear losing it?","ar":"ما الشيء المهم الذي أخشى فقدانه؟"},"strength":0.4}],"readMore":{"essence":{"en":"A deep feeling of connection, care, and warmth — a signal that something or someone truly matters to you.","ar":"شعور عميق بالتواصل والرعاية والدفء — إشارة إلى أن شيئًا أو شخصًا ما يهمّك حقًّا."},"signal":{"en":"Love is your system saying: invest here. It deepens commitment and creates bonds worth protecting. Love isn't just warmth — it's also what makes fear, grief, and jealousy possible, because we only fear losing what we love. Love and fear are both about commitment; love deepens our commitment, and fear occurs when we perceive risk to what we love.","ar":"الحب رسالة من داخلك تقول: استثمر هنا. فهو يعمّق الالتزام ويصنع روابط تستحق الحماية. والحب ليس مجرد دفء؛ بل هو أيضًا ما يجعل الخوف والحزن والغيرة ممكنة، فنحن لا نخشى إلا فقدان ما نحب. الحب والخوف كلاهما يتعلّق بالالتزام: الحب يعمّق التزامنا، والخوف ينشأ حين نستشعر خطرًا يهدّد ما نحب."},"reflection":{"en":"What would change if you followed where this feeling leads? For more, try clicking one of Love's fellow messengers from the bottom of the screen.","ar":"ما الذي سيتغيّر لو اتّبعت هذا الشعور إلى حيث يقودك؟ وللمزيد، جرّب النقر على أحد المشاعر الشريكة للحب أسفل الشاشة."},"bookRef":{"en":"Emotion Rules, pp. 54, 75, 82","ar":"Emotion Rules، ص. 54، 75، 82"}}},{"id":"jealousy","label":{"en":"Jealousy","ar":"الغيرة"},"needs":[{"needId":"belonging","inquiry":{"en":"Do I want what others seem to have?","ar":"هل أتمنى أن أشعر بالقرب أو القبول مثل شخص آخر؟"},"strength":0.8},{"needId":"achievement","inquiry":{"en":"Am I falling behind where I want to be?","ar":"هل هناك هدف أتمنى أن أقترب منه؟"},"strength":0.4}],"readMore":{"essence":{"en":"A sharp awareness of what others have that you want — a signal about ownership, desire, and what you believe you deserve.","ar":"وعي حادّ بما يملكه الآخرون وتريده أنت — إشارة تتعلّق بالملكية والرغبة وما تؤمن بأنك تستحقه."},"signal":{"en":"Jealousy is often rejected as 'ugly,' but it carries real information. It asks: what do I want? What do I feel I'm missing? Grateful and jealous are both about ownership — what do we have? What are we working to have? What do we deserve? Instead of shaming yourself for jealousy, try listening to what it's pointing you toward.","ar":"كثيرًا ما يُنظر إلى الغيرة على أنها شعور «قبيح»، لكنها تحمل معلومات حقيقية؛ فهي تسأل: ماذا أريد؟ وما الذي أشعر بأنه ينقصني؟ الامتنان والغيرة كلاهما يتعلّق بالملكية: ماذا لدينا؟ وما الذي نسعى إليه؟ وماذا نستحق؟ فبدلًا من أن تخجل من غيرتك، حاول أن تصغي إلى ما تشير إليه."},"reflection":{"en":"What is this jealousy telling you about what you actually want — and is that something you can work toward?","ar":"ماذا تخبرك هذه الغيرة عمّا تريده حقًّا — وهل هو شيء يمكنك السعي إليه؟"},"bookRef":{"en":"Emotion Rules, pp. 76, 82","ar":"Emotion Rules، ص. 76، 82"}}},{"id":"shame","label":{"en":"Shame","ar":"الخزي"},"needs":[{"needId":"belonging","inquiry":{"en":"Have I fallen short of expectations?","ar":"هل أشعر أنني لم ألبِّ توقعًا مهمًا؟"},"strength":0.8},{"needId":"growth","inquiry":{"en":"Am I living up to my own standards?","ar":"ماذا يمكنني أن أتعلم أو أحسّن بدلًا من لوم نفسي؟"},"strength":0.5}],"readMore":{"essence":{"en":"A painful feeling of falling short — a signal about the gap between who you are and who you or your community expects you to be.","ar":"شعور مؤلم بالتقصير — إشارة إلى الفجوة بين ما أنت عليه وما تتوقعه أنت أو مجتمعك منك."},"signal":{"en":"Shame is often maligned. Yes, it can be deeply painful. It can lead to self-suppression or withdrawal. But it also plays a role in moral development. It alerts us to the question: Am I living up to the standards of my community? When used with awareness and compassion, that question becomes a compass toward integrity, not just conformity.","ar":"كثيرًا ما يُنتقد الخزي. نعم، قد يكون مؤلمًا بعمق، وقد يؤدي إلى كبت الذات أو الانسحاب. لكنه يؤدي أيضًا دورًا في النموّ الأخلاقي؛ إذ ينبّهنا إلى سؤال: هل أعيش وفق معايير مجتمعي؟ وحين نتعامل معه بوعي ورحمة، يصبح هذا السؤال بوصلة نحو النزاهة، لا مجرد امتثال."},"reflection":{"en":"Whose expectations are you measuring yourself against — and are they truly yours?","ar":"بتوقعات مَن تقيس نفسك — وهل هي توقعاتك أنت حقًّا؟"},"bookRef":{"en":"Emotion Rules, pp. 81, 82","ar":"Emotion Rules، ص. 81، 82"}}},{"id":"frustrated","label":{"en":"Frustration","ar":"الإحباط"},"needs":[{"needId":"autonomy","inquiry":{"en":"What is preventing me from making my own way?","ar":"ما الذي يمنعني من الاختيار أو التصرف بالطريقة التي أريدها؟"},"strength":0.9},{"needId":"achievement","inquiry":{"en":"Why can't I move forward?","ar":"ما الذي يمنعني من التقدم نحو هدفي؟"},"strength":0.5}],"readMore":{"essence":{"en":"A building tension when something is blocking your path — a signal that you want to move forward but something is in the way.","ar":"توتر متصاعد حين يعترض شيءٌ طريقك — إشارة إلى أنك تريد التقدّم لكن هناك ما يقف في وجهك."},"signal":{"en":"Frustration is the feeling of thwarted agency. It bridges autonomy (my ability to choose my own path is being blocked) and achievement (I can't make the progress I want). Rather than a sign to give up, frustration signals that what you're trying to do matters to you. It's energy looking for a channel.","ar":"الإحباط شعور بأن قدرتك على الفعل قد أُعيقت. وهو يربط بين الاستقلالية (قدرتي على اختيار طريقي مُعاقة) والإنجاز (لا أستطيع إحراز التقدّم الذي أريده). والإحباط ليس إشارة إلى الاستسلام، بل دليل على أن ما تحاول فعله يهمّك؛ إنه طاقة تبحث عن مسار."},"reflection":{"en":"What specifically is blocked — and is there another path you haven't considered?","ar":"ما الذي تعثّر تحديدًا — وهل هناك طريق آخر لم تفكّر فيه بعد؟"},"bookRef":{"en":"Emotion Rules, pp. 82, 107","ar":"Emotion Rules، ص. 82، 107"}}},{"id":"guilty","label":{"en":"Guilt","ar":"الشعور بالذنب"},"needs":[{"needId":"autonomy","inquiry":{"en":"Did I make a choice that violated my own standards?","ar":"هل فعلت شيئًا لا يتفق مع قيمي أو اختياراتي؟"},"strength":0.7},{"needId":"belonging","inquiry":{"en":"Have I damaged a relationship that matters to me?","ar":"هل أثّر تصرفي في شخص أو علاقة مهمة؟"},"strength":0.5},{"needId":"growth","inquiry":{"en":"Am I holding back from doing better?","ar":"ماذا أستطيع أن أتعلم وأفعل بشكل أفضل؟"},"strength":0.4}],"readMore":{"essence":{"en":"A nagging sense that you've done something misaligned with your values — a signal pointing toward accountability and repair.","ar":"شعور مُلحّ بأنك فعلت شيئًا لا يتّفق مع قيمك — إشارة توجّهك نحو المسؤولية والإصلاح."},"signal":{"en":"Guilt bridges three needs at once, which is why it can feel so complex. It asks about autonomy (did I betray my own standards?), belonging (did I harm a connection?), and growth (can I do better?). Growth and guilt both tell us about doing well — are we doing our best? Are we challenging ourselves to do better? Or are we holding back?","ar":"الشعور بالذنب يربط ثلاث حاجات في آن واحد، ولهذا يبدو معقّدًا. فهو يسأل عن الاستقلالية (هل خنتُ معاييري؟)، والانتماء (هل أضررت بعلاقة؟)، والنمو (هل يمكنني أن أفعل أفضل؟). والنمو والشعور بالذنب كلاهما يخبرنا عن مدى إحساننا فيما نفعل."},"reflection":{"en":"Is this guilt pointing toward something you need to repair, something you need to forgive yourself for, or something you need to change going forward?","ar":"هل يشير هذا الشعور بالذنب إلى شيء تحتاج إلى إصلاحه، أم إلى شيء تحتاج إلى مسامحة نفسك عليه، أم إلى شيء تحتاج إلى تغييره مستقبلًا؟"},"bookRef":{"en":"Emotion Rules, pp. 75, 82","ar":"Emotion Rules، ص. 75، 82"}}},{"id":"free","label":{"en":"Freedom","ar":"الشعور بالحرية"},"needs":[{"needId":"autonomy","inquiry":{"en":"What is the path I want to take?","ar":"ما الاختيار الذي أريد أن أتخذه؟"},"strength":0.9}],"readMore":{"essence":{"en":"A sense of openness and possibility — a signal that your power to choose and to act is alive.","ar":"شعور بالانفتاح والإمكانات — إشارة إلى أن قدرتك على الاختيار والفعل حيّة."},"signal":{"en":"Freedom and feeling trapped teach us about our own liberty or autonomy. They're both about the power to act. When freedom is present, you feel spacious, capable, self-directed. It's worth noticing, because freedom is easy to take for granted — until it's gone.","ar":"الشعور بالحرية والشعور بالحصار كلاهما يعلّمنا عن حريتنا واستقلاليتنا، وكلاهما يتعلّق بالقدرة على الفعل. وحين تحضر الحرية تشعر بالرحابة والاقتدار وتوجيه ذاتك. وهي تستحق الانتباه، لأن من السهل أن نعدّها أمرًا مسلّمًا به — حتى نفقدها."},"reflection":{"en":"What choices are available to you right now that you might not be seeing?","ar":"ما الخيارات المتاحة لك الآن، وربما لا تراها؟"},"bookRef":{"en":"Emotion Rules, p. 75","ar":"Emotion Rules، ص. 75"}}},{"id":"trapped","label":{"en":"Trapped","ar":"الشعور بالحصار"},"needs":[{"needId":"autonomy","inquiry":{"en":"What is limiting my power to act?","ar":"ما الذي يجعلني أشعر بأنني لا أستطيع الاختيار؟"},"strength":0.9}],"readMore":{"essence":{"en":"A constricting feeling that your options are gone — a signal that your autonomy needs attention.","ar":"شعور بالضيق بأن خياراتك قد نفدت — إشارة إلى أن استقلاليتك تحتاج إلى اهتمام."},"signal":{"en":"Feeling trapped is autonomy under threat. These feelings challenge us to see the limits of our own volition — but also to ask whether the walls are as solid as they seem. Sometimes we're trapped by circumstances; sometimes by assumptions. Either way, the feeling is calling you to reclaim agency, even in small ways.","ar":"الشعور بالحصار هو الاستقلالية حين تكون مهدّدة. هذه المشاعر تتحدّانا لنرى حدود إرادتنا — ولنسأل أيضًا: هل الجدران صلبة كما تبدو؟ فأحيانًا تحاصرنا الظروف، وأحيانًا تحاصرنا افتراضاتنا. وفي الحالتين يدعوك هذا الشعور إلى استعادة قدرتك على الفعل، ولو بخطوات صغيرة."},"reflection":{"en":"What one small choice could you make right now to reclaim even a little agency?","ar":"ما الخيار الصغير الذي يمكنك اتخاذه الآن لتستعيد ولو قليلًا من قدرتك على الفعل؟"},"bookRef":{"en":"Emotion Rules, p. 75","ar":"Emotion Rules، ص. 75"}}},{"id":"anger","label":{"en":"Anger","ar":"الغضب"},"needs":[{"needId":"achievement","inquiry":{"en":"What's blocking the way?","ar":"ما الذي يقف في طريقي؟"},"strength":0.8},{"needId":"autonomy","inquiry":{"en":"What boundary or value is being threatened?","ar":"ما الحد أو القيمة التي أشعر أنها لم تُحترم؟"},"strength":0.7}],"readMore":{"essence":{"en":"A surge of energy when something important is threatened or blocked — a mobilizing force that says: this matters, act.","ar":"اندفاع من الطاقة حين يُهدَّد أو يُعاق شيء مهم — قوة تعبئة تقول: هذا مهم، تحرّك."},"signal":{"en":"Anger is one of the most misunderstood emotions. We're taught to suppress it, but anger is energy for change. We feel drive to motivate us to move forward; anger comes when we want to move or break through, but we perceive our way is blocked. It serves both achievement (break through the obstacle) and autonomy (protect what's mine). Anger's feeling pair partner is compassion — both fight for freedom and dignity.","ar":"الغضب من أكثر المشاعر التي يُساء فهمها. نتعلّم أن نكبته، لكنه في الحقيقة طاقة للتغيير. نشعر بدافع يحثّنا على المضيّ قُدمًا، ويأتي الغضب حين نريد التقدّم أو تجاوز العائق فنجد طريقنا مسدودًا. وهو يخدم الإنجاز (تجاوَز العائق) والاستقلالية (احمِ ما يخصّك). وشريك الغضب هو الرحمة — كلاهما ينافح عن الحرية والكرامة."},"reflection":{"en":"What value or boundary is this anger protecting — and what would compassion add to your response?","ar":"ما القيمة أو الحدّ الذي يحميه هذا الغضب — وماذا يمكن أن تضيف الرحمة إلى استجابتك؟"},"bookRef":{"en":"Emotion Rules, pp. 51, 75, 76, 82","ar":"Emotion Rules، ص. 51، 75، 76، 82"}}},{"id":"excitement","label":{"en":"Excitement","ar":"الحماس"},"needs":[{"needId":"achievement","inquiry":{"en":"What's fueling me to move?","ar":"ما الذي يجعلني متحمسًا للتحرك؟"},"strength":0.8},{"needId":"growth","inquiry":{"en":"What new possibility am I sensing?","ar":"ما الشيء الجديد الذي أشعر أنني أستطيع تجربته؟"},"strength":0.4}],"readMore":{"essence":{"en":"A buzzing, forward-leaning energy — a signal that you sense progress or possibility ahead.","ar":"طاقة نابضة تدفعك إلى الأمام — إشارة إلى أنك تستشعر تقدّمًا أو إمكانية تلوح في الأفق."},"signal":{"en":"Excitement shows up when we sense progress — when something is working and there's momentum. As one of achievement's messengers, it asks: what's fueling me? But excitement also touches growth, because the thrill often comes from encountering something new. It's the emotional fuel that makes effort feel effortless.","ar":"يظهر الحماس حين نستشعر التقدّم — حين ينجح أمر ما ويتولّد زخم. وبوصفه أحد رُسل الإنجاز، فهو يسأل: ما الذي يدفعني؟ لكنه يلامس النمو أيضًا، لأن الحماس كثيرًا ما ينبع من مواجهة شيء جديد. إنه الوقود العاطفي الذي يجعل العمل الشاق يبدو سهلًا."},"reflection":{"en":"What is this excitement pointing you toward — and how can you channel it into action?","ar":"إلامَ يشير هذا الحماس — وكيف يمكنك أن تحوّله إلى فعل؟"},"bookRef":{"en":"Emotion Rules, pp. 79, 82, 108","ar":"Emotion Rules، ص. 79، 82، 108"}}},{"id":"urgency","label":{"en":"Urgency","ar":"الاستعجال"},"needs":[{"needId":"achievement","inquiry":{"en":"What do I need to prioritize?","ar":"ما أهم شيء أحتاج إلى التركيز عليه الآن؟"},"strength":0.8}],"readMore":{"essence":{"en":"A pressing feeling that time is running out — a signal to focus your energy on what matters most right now.","ar":"إحساس ضاغط بأن الوقت ينفد — إشارة إلى أن تركّز طاقتك على ما يهمّ أكثر الآن."},"signal":{"en":"Urgency is time slipping away while something important remains undone. It's a powerful mobilizer — but it can also become a trap. The Tyranny of Urgency compresses your timeline so you think in seconds or minutes, locking you into short-term reactions at the expense of long-term values. The key is to let urgency sharpen your focus without hijacking your perspective.","ar":"الاستعجال شعور بأن الوقت يتسرّب بينما يبقى أمر مهم دون إنجاز. إنه محفّز قوي، لكنه قد يتحوّل إلى فخّ أيضًا: فطغيان الاستعجال يضغط إطارك الزمني حتى تصبح تفكّر بالثواني والدقائق، أسيرًا لردود فعل قصيرة المدى على حساب القيم بعيدة المدى. والمفتاح أن تدع الاستعجال يشحذ تركيزك دون أن يسلبك رؤيتك الأوسع."},"reflection":{"en":"Is this truly urgent, or is urgency hijacking your attention from what matters most?","ar":"هل هذا الأمر عاجل حقًّا، أم أن الاستعجال يصرف انتباهك عمّا يهمّ أكثر؟"},"bookRef":{"en":"Emotion Rules, pp. 82, 226-227","ar":"Emotion Rules، ص. 82، 226-227"}}},{"id":"pride","label":{"en":"Pride","ar":"الفخر"},"needs":[{"needId":"achievement","inquiry":{"en":"Can I honor my own contribution?","ar":"ما الإنجاز الذي أستطيع أن أقدّر جهدي فيه؟"},"strength":0.8},{"needId":"belonging","inquiry":{"en":"Do others see my value?","ar":"هل أشارك إنجازي مع أشخاص يهمّونني؟"},"strength":0.3}],"readMore":{"essence":{"en":"A warm glow of self-recognition — a signal that you've reached a milestone or made a meaningful contribution.","ar":"توهّج دافئ من تقدير الذات — إشارة إلى أنك بلغت مرحلة فارقة أو قدّمت إسهامًا ذا معنى."},"signal":{"en":"Pride is the milestone marker of achievement. It says: you did something that matters. Pride also touches belonging — part of what makes accomplishment meaningful is being seen and valued by others. The question 'can I honor my own contribution?' is an invitation to self-recognition that many people struggle with.","ar":"الفخر علامة على الإنجازات المهمة؛ فهو يقول: لقد فعلت شيئًا ذا قيمة. ويلامس الفخر الانتماء أيضًا، فجزء مما يمنح الإنجاز معناه أن يراك الآخرون ويقدّروك. وسؤال «هل أستطيع أن أقدّر إسهامي؟» دعوة إلى تقدير الذات يجد كثيرون صعوبة في تلبيتها."},"reflection":{"en":"Can you let yourself feel this fully — without deflecting or minimizing?","ar":"هل يمكنك أن تسمح لنفسك بأن تعيش هذا الشعور كاملًا — دون أن تتهرّب منه أو تقلّل من شأنه؟"},"bookRef":{"en":"Emotion Rules, pp. 79, 82","ar":"Emotion Rules، ص. 79، 82"}}},{"id":"doubt","label":{"en":"Doubt","ar":"الشك"},"needs":[{"needId":"achievement","inquiry":{"en":"Am I prepared enough, or is something missing?","ar":"ما الذي أحتاج إلى الاستعداد له بشكل أفضل؟"},"strength":0.7},{"needId":"meaning","inquiry":{"en":"How open am I to what's new and possible?","ar":"ما الذي أريد أن أفهمه قبل أن أقرر؟"},"strength":0.5}],"readMore":{"essence":{"en":"A questioning hesitation — a signal that something may not be fully resolved or that you're at the edge of your certainty.","ar":"تردّد متسائل — إشارة إلى أن أمرًا ما قد لا يكون محسومًا تمامًا، أو أنك على حافة يقينك."},"signal":{"en":"Doubt is the emotion at the boundary between knowing and not-knowing. Wonder and doubt are both about seeing and limiting possibilities. Doubt checks your preparation and readiness, but it can also be an invitation to expand — to question assumptions and see what else might be true. As doubts creep in, our brains move more into a fear/protection response, automatically rejecting novelty. But staying with doubt can open doorways.","ar":"الشك عاطفة تقف على الحدّ الفاصل بين المعرفة وعدم المعرفة. والانبهار والشك كلاهما يتعلّق برؤية الإمكانات وتحديدها. فالشك يتحقّق من استعدادك وجاهزيتك، لكنه قد يكون أيضًا دعوة إلى التوسّع — إلى مساءلة الافتراضات ورؤية ما قد يكون صحيحًا كذلك. وحين تتسلّل الشكوك، تميل أدمغتنا إلى استجابة الخوف والحماية فترفض الجديد تلقائيًا. لكن البقاء مع الشك قد يفتح أبوابًا."},"reflection":{"en":"Is your doubt protecting you from a real risk, or keeping you from a growth opportunity?","ar":"هل يحميك شكّك من خطر حقيقي، أم يحرمك من فرصة للنمو؟"},"bookRef":{"en":"Emotion Rules, pp. 76, 82, 226","ar":"Emotion Rules، ص. 76، 82، 226"}}},{"id":"awe","label":{"en":"Awe","ar":"الانبهار"},"needs":[{"needId":"meaning","inquiry":{"en":"Where do I fit in the face of this greater whole?","ar":"ما الذي يجعلني أشعر بأن هناك شيئًا أكبر وأهم منّي؟"},"strength":0.9}],"readMore":{"essence":{"en":"A vast, breathtaking feeling in the presence of something greater than yourself — a signal that you're encountering the edge of what you can comprehend.","ar":"شعور رحب ومدهش في حضرة ما هو أعظم منك — إشارة إلى أنك تقف عند حدود ما يمكنك استيعابه."},"signal":{"en":"Awe is a complex, 'cognitively saturated' emotion — rich in meaning, not just a simple physiological reaction. Research by Dacher Keltner shows that awe helps regulate our nervous system, expand our sense of connection, and diminish the grip of ego. When we experience awe, we often feel smaller in a way that is expansive, not diminishing. It reorients us, helping us see ourselves as part of something larger.","ar":"الانبهار عاطفة مركّبة «غنية إدراكيًا» — مشبعة بالمعنى، وليست مجرد ردّ فعل جسدي بسيط. وتُظهر الأبحاث أنه يساعد على تنظيم جهازنا العصبي، ويوسّع إحساسنا بالتواصل، ويخفّف من سطوة الأنا. وحين نختبره نشعر غالبًا بأننا أصغر، لكن بطريقة توسّعنا لا تُنقصنا. إنه يعيد توجيهنا، ويساعدنا على رؤية أنفسنا جزءًا من شيء أكبر."},"reflection":{"en":"What becomes available when you allow yourself to feel small in the face of something vast?","ar":"ما الذي يصبح متاحًا حين تسمح لنفسك بأن تشعر بصغرك أمام شيء شاسع؟"},"bookRef":{"en":"Emotion Rules, pp. 55, 83","ar":"Emotion Rules، ص. 55، 83"}}},{"id":"despair","label":{"en":"Despair","ar":"اليأس"},"needs":[{"needId":"meaning","inquiry":{"en":"Has something I counted on disappeared?","ar":"ما الشيء الذي فقدت الأمل في الوصول إليه؟"},"strength":0.8},{"needId":"safety","inquiry":{"en":"Is there still a way forward?","ar":"ما الدعم أو الخطوة الصغيرة التي قد تساعدني على المضي قدمًا؟"},"strength":0.4}],"readMore":{"essence":{"en":"A sinking feeling that the path forward has vanished — a signal that something you deeply valued feels lost.","ar":"شعور بالغرق بأن الطريق إلى الأمام قد اختفى — إشارة إلى أن شيئًا تقدّره بعمق يبدو مفقودًا."},"signal":{"en":"Hope and despair are partners, not opposites. Hope rises when we see opportunities to move toward what we want, and despair means we don't see a way forward — but it still teaches us about the opportunity we crave. In the valley of despair, something is clarified. What truly matters becomes so vividly present. Despair is painful, but it carries the seed of clarity about what you most want.","ar":"الأمل واليأس شريكان لا نقيضان. فالأمل يرتفع حين نرى فرصًا للتحرّك نحو ما نريد، واليأس يعني أننا لا نرى طريقًا إلى الأمام — لكنه مع ذلك يعلّمنا عن الفرصة التي نتوق إليها. في وادي اليأس يتّضح أمر ما؛ إذ يصبح ما يهمّ حقًّا حاضرًا بوضوح شديد. اليأس مؤلم، لكنه يحمل بذرة الوضوح بشأن ما تريده أكثر من أي شيء."},"reflection":{"en":"Even in this dark moment — what does the intensity of this pain tell you about what you truly value?","ar":"حتى في هذه اللحظة المظلمة — ماذا تخبرك شدّة هذا الألم عمّا تقدّره حقًّا؟"},"bookRef":{"en":"Emotion Rules, pp. 69, 75, 83","ar":"Emotion Rules، ص. 69، 75، 83"}}},{"id":"inspiration","label":{"en":"Inspiration","ar":"الإلهام"},"needs":[{"needId":"meaning","inquiry":{"en":"What is calling me forward?","ar":"ما الفكرة أو القيمة التي تدفعني إلى الأمام؟"},"strength":0.9},{"needId":"growth","inquiry":{"en":"What am I ready to become?","ar":"ما الشيء الذي أريد أن أتعلم أو أصبحه؟"},"strength":0.5}],"readMore":{"essence":{"en":"A lifting, energizing pull toward something bigger — a signal that you've glimpsed a possibility that resonates with your deepest values.","ar":"جاذبية ترفعك وتمنحك طاقة نحو شيء أكبر — إشارة إلى أنك لمحت إمكانية تتّسق مع أعمق قيمك."},"signal":{"en":"Inspiration opens your mind to new learning and new becoming. Inspired and bored both teach us about our relationship with learning and growth — inspiration is the open, expansive side of that need. It's calling you toward something, even if you can't yet name it clearly. Follow the pull.","ar":"الإلهام يفتح عقلك لتعلّم جديد وتحوّل جديد. والإلهام والملل كلاهما يعلّمنا عن علاقتنا بالتعلّم والنمو — والإلهام هو الوجه المنفتح المتّسع لتلك الحاجة. إنه يناديك نحو شيء ما، حتى لو لم تستطع تسميته بوضوح بعد. اتبع هذا النداء."},"reflection":{"en":"What is this inspiration calling you toward — and what's one small step you could take today?","ar":"إلامَ يدعوك هذا الإلهام — وما الخطوة الصغيرة التي يمكنك أن تخطوها اليوم؟"},"bookRef":{"en":"Emotion Rules, pp. 75, 83","ar":"Emotion Rules، ص. 75، 83"}}},{"id":"emptiness","label":{"en":"Emptiness","ar":"الفراغ"},"needs":[{"needId":"meaning","inquiry":{"en":"What's missing?","ar":"ما الذي أشعر أنه ينقصني الآن؟"},"strength":0.8}],"readMore":{"essence":{"en":"A hollow, vacant feeling — a signal that something essential to your sense of purpose or connection has gone quiet.","ar":"شعور أجوف بالخواء — إشارة إلى أن شيئًا جوهريًا في إحساسك بالهدف أو التواصل قد خفت صوته."},"signal":{"en":"Emptiness is meaning's absence made felt. It's the emotional experience of a gap between where you are and where your values say you should be. While uncomfortable, emptiness is also an honest signal — it tells you that something is missing without pretending otherwise. Listening to emptiness can help you clarify what you need to find or rebuild.","ar":"الفراغ هو غياب الإحساس بالمعنى. إنه التجربة العاطفية للفجوة بين حيث أنت وحيث تقول قيمك إنه ينبغي أن تكون. ورغم أنه غير مريح، فإنه إشارة صادقة — يخبرك أن شيئًا مفقود دون أن يتظاهر بعكس ذلك. والإصغاء إلى الفراغ يساعدك على توضيح ما تحتاج إلى إيجاده أو إعادة بنائه."},"reflection":{"en":"What used to fill this space — and is it something to reclaim, or something new to create?","ar":"ما الذي كان يملأ هذه المساحة — وهل هو شيء تستعيده أم شيء جديد تصنعه؟"},"bookRef":{"en":"Emotion Rules, p. 83","ar":"Emotion Rules، ص. 83"}}},{"id":"delight","label":{"en":"Delight","ar":"البهجة"},"needs":[{"needId":"meaning","inquiry":{"en":"What's beyond what I could have imagined?","ar":"ما الشيء الجميل أو المفاجئ الذي أقدّره؟"},"strength":0.7},{"needId":"growth","inquiry":{"en":"Am I noticing my own aliveness?","ar":"ما الذي يجعلني أشعر بالحيوية والنشاط؟"},"strength":0.5}],"readMore":{"essence":{"en":"A sparkling, unexpected pleasure — a signal that life has surprised you with something wonderful.","ar":"متعة متلألئة غير متوقعة — إشارة إلى أن الحياة فاجأتك بشيء رائع."},"signal":{"en":"Delight sits at the intersection of meaning and growth. It often arrives when something exceeds your expectations — when reality is better than what you imagined. Delight is meaning made tangible: it says, this matters, and it's here. It bridges toward growth because delight expands your sense of what's possible.","ar":"تقع البهجة عند تقاطع المعنى والنمو. وغالبًا ما تأتي حين يفوق أمرٌ توقعاتك — حين يكون الواقع أجمل مما تخيّلت. البهجة هي المعنى حين تشعر به؛ فهي تقول: هذا مهم، وهو هنا الآن. وترتبط بالنمو لأنها توسّع إحساسك بما هو ممكن."},"reflection":{"en":"What just delighted you — and what does that reveal about what makes you come alive?","ar":"ما الذي أبهجك للتوّ — وماذا يكشف ذلك عمّا يجعلك تشعر بالحياة؟"},"bookRef":{"en":"Emotion Rules, p. 83","ar":"Emotion Rules، ص. 83"}}},{"id":"curiosity","label":{"en":"Curiosity","ar":"الفضول"},"needs":[{"needId":"growth","inquiry":{"en":"What is here for me to learn or discover?","ar":"ما الذي أريد أن أتعلمه أو أكتشفه؟"},"strength":0.9},{"needId":"meaning","inquiry":{"en":"What limits can I expand?","ar":"ما السؤال الذي أريد أن أفهمه أكثر؟"},"strength":0.4}],"readMore":{"essence":{"en":"An alert, open-minded pull toward something unknown — a signal that your brain is ready to learn.","ar":"انجذاب متيقّظ ومنفتح نحو المجهول — إشارة إلى أن دماغك مستعد للتعلّم."},"signal":{"en":"Curiosity and judging both ask us to learn and discover. While we might think it's 'bad to judge,' we're wired to evaluate, to assess, to find meaning and limits. Curiosity expands those limits. Curiosity is the lead emotion for growth — it's what moves you from 'I know' to 'I wonder.' In Taoism, curiosity is more effective than having the right answer.","ar":"الفضول وإصدار الأحكام كلاهما يدفعنا إلى التعلّم والاكتشاف. ورغم أننا قد نظن أن «إصدار الأحكام أمر سيئ»، فإننا مفطورون على التقييم وإيجاد المعنى ورسم الحدود. والفضول يوسّع تلك الحدود؛ فهو العاطفة التي تقود النمو — ينقلك من «أنا أعرف» إلى «أتساءل». وفي الفلسفة الطاوية، يُعدّ الفضول أجدى من امتلاك الإجابة الصحيحة."},"reflection":{"en":"What are you curious about right now — and what would it take to follow that thread?","ar":"ما الذي يثير فضولك الآن — وماذا يتطلّب الأمر لتتبّع هذا الخيط؟"},"bookRef":{"en":"Emotion Rules, pp. 75, 83, 247","ar":"Emotion Rules، ص. 75، 83، 247"}}},{"id":"joy","label":{"en":"Joy","ar":"الفرح"},"needs":[{"needId":"growth","inquiry":{"en":"Am I noticing my own expansion or aliveness?","ar":"ما الذي يجعلني أشعر بالحيوية والنمو؟"},"strength":0.7},{"needId":"meaning","inquiry":{"en":"What makes life feel worth living right now?","ar":"ما الذي يجعل هذه اللحظة ذات قيمة بالنسبة لي؟"},"strength":0.5}],"readMore":{"essence":{"en":"A bright, expansive feeling of things going well — a signal that something in your life is aligned and flourishing.","ar":"شعور مشرق ومتّسع بأن الأمور تسير على ما يرام — إشارة إلى أن شيئًا في حياتك متّسق ومزدهر."},"signal":{"en":"Joy says: can we do more of this? It energizes us to continue what matters. Joy and sorrow are partners — both help us understand what we care about. Joy expands your capacity for love, strengthens bonds, and fuels growth. It's not just 'feeling good' — it's a signal of alignment between your life and your values.","ar":"الفرح يقول: هل يمكننا أن نفعل المزيد من هذا؟ إنه يمنحنا الطاقة لنواصل ما يهمّ. والفرح والحزن شريكان، وكلاهما يساعدنا على فهم ما نهتمّ به. يوسّع الفرح قدرتك على الحب، ويقوّي الروابط، ويغذّي النمو. إنه ليس مجرد «شعور جميل»، بل إشارة إلى الانسجام بين حياتك وقيمك."},"reflection":{"en":"What conditions created this joy — and how can you create more of them?","ar":"ما الظروف التي صنعت هذا الفرح — وكيف يمكنك أن تصنع المزيد منها؟"},"bookRef":{"en":"Emotion Rules, pp. 51, 75, 83, 89","ar":"Emotion Rules، ص. 51، 75، 83، 89"}}},{"id":"impatience","label":{"en":"Impatience","ar":"نفاد الصبر"},"needs":[{"needId":"growth","inquiry":{"en":"What's holding me back?","ar":"ما الذي يبطئ تعلّمي أو تقدمي؟"},"strength":0.7},{"needId":"achievement","inquiry":{"en":"Why isn't progress happening faster?","ar":"ما الخطوة التي أستطيع القيام بها الآن بدل الاستعجال؟"},"strength":0.5}],"readMore":{"essence":{"en":"A restless, forward-pushing energy — a signal that you're ready to move faster than circumstances allow.","ar":"طاقة قلقة تدفعك إلى الأمام — إشارة إلى أنك مستعد للتحرّك أسرع مما تسمح به الظروف."},"signal":{"en":"Impatience is growth straining against its constraints. It says: I want to be further along. It's the bridge between growth (I'm ready for the next thing) and achievement (why isn't progress happening?). Impatience can be destructive when it leads to rushing, but it's also a sign of vitality — you care about getting somewhere.","ar":"نفاد الصبر هو النمو وهو يصارع قيوده؛ يقول: أريد أن أكون قد تقدّمت أكثر. وهو يربط النمو (أنا مستعد للخطوة التالية) بالإنجاز (لماذا لا يحدث تقدّم؟). وقد يكون نفاد الصبر هدّامًا حين يقود إلى التسرّع، لكنه أيضًا علامة حيوية — فأنت تهتمّ بأن تصل إلى مكان ما."},"reflection":{"en":"Is this impatience telling you to push harder, or to trust the process?","ar":"هل يدعوك نفاد صبرك إلى أن تدفع بقوة أكبر، أم إلى أن تثق بالمسار؟"},"bookRef":{"en":"Emotion Rules, p. 83","ar":"Emotion Rules، ص. 83"}}},{"id":"depression","label":{"en":"Depression","ar":"الاكتئاب"},"needs":[{"needId":"growth","inquiry":{"en":"Do I really want to move forward?","ar":"ما الخطوة الصغيرة التي قد تساعدني على استعادة الحركة أو الاهتمام؟"},"strength":0.7},{"needId":"meaning","inquiry":{"en":"What has lost its purpose?","ar":"ما الشيء الذي فقد معناه بالنسبة لي؟"},"strength":0.6}],"readMore":{"essence":{"en":"A heavy, low-energy state where forward motion feels impossible — a signal that something fundamental may need to change.","ar":"حالة ثقيلة منخفضة الطاقة يبدو فيها التقدّم مستحيلًا — إشارة إلى أن شيئًا جوهريًا قد يحتاج إلى التغيير."},"signal":{"en":"Depression sits between growth and meaning, asking deep questions about whether the direction you've been heading still makes sense. It can be a sign that what used to fuel you has run dry. While persistent depression needs professional support, the emotional signal itself often carries important information about misalignment between your life and your needs.","ar":"يقع الاكتئاب بين النمو والمعنى، ويطرح أسئلة عميقة عمّا إذا كان الاتجاه الذي تسير فيه ما زال منطقيًا. وقد يكون إشارة إلى أن ما كان يغذّيك قد نضب. ومع أن الاكتئاب المستمر يحتاج إلى دعم مختص، فإن الإشارة العاطفية نفسها كثيرًا ما تحمل معلومات مهمة عن عدم الانسجام بين حياتك واحتياجاتك."},"reflection":{"en":"If this heaviness could speak, what might it be asking you to change — or to grieve?","ar":"لو استطاع هذا الثقل أن يتكلّم، ما الذي قد يطلب منك تغييره — أو الحزن عليه؟"},"bookRef":{"en":"Emotion Rules, p. 83","ar":"Emotion Rules، ص. 83"}}},{"id":"boredom","label":{"en":"Boredom","ar":"الملل"},"needs":[{"needId":"growth","inquiry":{"en":"Is it time to learn or explore?","ar":"ما الشيء الجديد الذي يمكنني تعلمه أو تجربته؟"},"strength":0.8}],"readMore":{"essence":{"en":"A flat, understimulated feeling — a signal that your mind is either resting or hungry to engage with something new.","ar":"شعور باهت يخلو من الحافز — إشارة إلى أن عقلك إمّا يستريح، وإمّا يتوق إلى الانشغال بشيء جديد."},"signal":{"en":"Boredom gets a bad reputation, but it serves two purposes. Sometimes your brain is resting and integrating — it needs the downtime. Other times, boredom is growth calling: you've outgrown the current situation and your mind wants new challenge. Inspired and bored are partners — both teach us about our relationship with learning.","ar":"للملل سمعة سيئة، لكنه يؤدي غرضين: فأحيانًا يكون دماغك في حالة راحة واستيعاب ويحتاج إلى وقت هادئ. وأحيانًا يكون الملل نداء النمو: لقد تجاوزت وضعك الحالي، وعقلك يريد تحديًا جديدًا. والإلهام والملل شريكان، وكلاهما يعلّمنا عن علاقتنا بالتعلّم."},"reflection":{"en":"Is this boredom asking you to rest, or to seek something new?","ar":"هل يطلب منك هذا الملل أن تستريح، أم أن تبحث عن شيء جديد؟"},"bookRef":{"en":"Emotion Rules, pp. 52, 75, 83","ar":"Emotion Rules، ص. 52، 75، 83"}}},{"id":"sadness","label":{"en":"Sadness","ar":"الحزن"},"needs":[{"needId":"belonging","inquiry":{"en":"What connection has been lost or is missing?","ar":"ما العلاقة أو القرب الذي أفتقده؟"},"strength":0.8},{"needId":"meaning","inquiry":{"en":"What do I care about so much that losing it hurts?","ar":"ما الشيء المهم بالنسبة لي الذي يجعل فقده مؤلمًا؟"},"strength":0.6}],"readMore":{"essence":{"en":"A deep, sinking feeling of loss or absence — a signal that something precious to you has changed or is slipping away.","ar":"شعور عميق بالفقد أو الغياب — إشارة إلى أن شيئًا ثمينًا لديك قد تغيّر أو يوشك أن يضيع."},"signal":{"en":"Sadness honors what's precious. It's the emotion that says: this mattered. Joy and sorrow are partners — both help us understand what we care about. Joy energizes us to continue what matters, and sorrow strengthens our understanding of what is most important. The raw emotion of sadness can mean so many things: I miss you. I wish I had more time. I'm grateful for what we shared. The same basic emotion gives us different messages depending on the story around it.","ar":"الحزن يكرّم ما هو ثمين؛ إنه العاطفة التي تقول: هذا كان مهمًّا. والفرح والحزن شريكان، وكلاهما يساعدنا على فهم ما نهتمّ به: الفرح يمنحنا الطاقة لنواصل ما يهمّ، والحزن يعمّق فهمنا لما هو أهمّ. وقد يحمل الحزن الخام معاني كثيرة: أفتقدك. ليتني حظيت بوقت أطول. أنا ممتنّ لما تشاركناه."},"reflection":{"en":"What is this sadness honoring — and can you sit with it rather than push it away?","ar":"ما الذي يكرّمه هذا الحزن — وهل يمكنك أن تبقى معه بدلًا من أن تدفعه بعيدًا؟"},"bookRef":{"en":"Emotion Rules, pp. 51, 75, 89, 229-230","ar":"Emotion Rules، ص. 51، 75، 89، 229-230"}}},{"id":"anxiety","label":{"en":"Anxiety","ar":"القلق"},"needs":[{"needId":"safety","inquiry":{"en":"What do I care about that feels at risk?","ar":"ما الشيء المهم الذي أشعر أنه مهدد؟"},"strength":0.8},{"needId":"achievement","inquiry":{"en":"Am I prepared enough for what's ahead?","ar":"ما الذي أحتاج إلى الاستعداد له؟"},"strength":0.5}],"readMore":{"essence":{"en":"A buzzing, unsettled alertness about the unknown — a generalized form of fear where you can't quite pinpoint the risk.","ar":"ترقّب مضطرب صاخب تجاه المجهول — صورة معمّمة من الخوف لا تستطيع فيها تحديد الخطر بدقة."},"signal":{"en":"Anxiety is your system's way of preparing you for the unknown. It says: be alert, something important might happen. But it doesn't tell you what to do — so it leaves you buzzing. Anxiety is a form of purpose misdirected: all this energy for something important, without a channel. When you start to create a path, even a small one, anxiety can transform into commitment, clarity, and courage.","ar":"القلق طريقة نظامك الداخلي في تهيئتك للمجهول؛ يقول: كن متيقّظًا، فقد يحدث أمر مهم. لكنه لا يخبرك بما عليك فعله، فيتركك مضطربًا. القلق اهتمام لم يجد وجهته: كل هذه الطاقة من أجل شيء مهم، لكن دون مسار. وحين تبدأ في رسم طريق، ولو صغيرًا، يمكن أن يتحوّل القلق إلى التزام ووضوح وشجاعة."},"reflection":{"en":"What is this anxiety trying to protect — and what is one small step you could take right now?","ar":"ما الذي يحاول هذا القلق حمايته — وما الخطوة الصغيرة التي يمكنك أن تخطوها الآن؟"},"bookRef":{"en":"Emotion Rules, pp. 147-149","ar":"Emotion Rules، ص. 147-149"}}},{"id":"gratitude","label":{"en":"Gratitude","ar":"الامتنان"},"needs":[{"needId":"belonging","inquiry":{"en":"What connections and gifts have I been given?","ar":"من أو ما الذي أشعر بالامتنان لوجوده في حياتي؟"},"strength":0.7},{"needId":"meaning","inquiry":{"en":"What richness is already present in my life?","ar":"ما النعمة أو القيمة التي ألاحظها الآن؟"},"strength":0.6}],"readMore":{"essence":{"en":"A warm recognition of goodness received — a signal that something valuable is present in your life right now.","ar":"إقرار دافئ بالخير الذي تلقّيته — إشارة إلى أن شيئًا ثمينًا حاضر في حياتك الآن."},"signal":{"en":"Grateful and jealous are both about ownership — what do we have? What are we working to have? Gratitude is the feeling pair partner for sadness: while sadness honors what's been lost, gratitude honors what's here. Gratitude strengthens your resilience and deepens your sense of connection. It's one of the emotions that bridges belonging and meaning — noticing what you have is both relational and purposeful.","ar":"الامتنان والغيرة كلاهما يتعلّق بالملكية: ماذا لدينا؟ وما الذي نسعى إليه؟ والامتنان شريك الحزن: فبينما يكرّم الحزن ما فُقد، يكرّم الامتنان ما هو موجود. يقوّي الامتنان مرونتك ويعمّق إحساسك بالتواصل، وهو من المشاعر التي تصل الانتماء بالمعنى — فملاحظة ما لديك أمرٌ يتعلّق بالعلاقات وبالغاية في آن واحد."},"reflection":{"en":"What is present in your life right now that you might not have been noticing?","ar":"ما الموجود في حياتك الآن وربما لم تلاحظه بعد؟"},"bookRef":{"en":"Emotion Rules, pp. 76, 89","ar":"Emotion Rules، ص. 76، 89"}}},{"id":"hope","label":{"en":"Hope","ar":"الأمل"},"needs":[{"needId":"meaning","inquiry":{"en":"What opportunities do I see to move toward what I want?","ar":"ما الإمكانية التي ما زلت أراها أمامي؟"},"strength":0.7},{"needId":"growth","inquiry":{"en":"What am I ready to grow into?","ar":"إلى أين أريد أن أتقدم أو أنمو؟"},"strength":0.6}],"readMore":{"essence":{"en":"A forward-leaning feeling that a better future is possible — a signal that you still see a path, even if it's narrow.","ar":"شعور يتطلّع إلى الأمام بأن مستقبلًا أفضل ممكن — إشارة إلى أنك ما زلت ترى طريقًا، ولو كان ضيقًا."},"signal":{"en":"Hope rises when we see opportunities to move toward what we want. Hope and despair are partners: despair means we don't see a way forward, but it still teaches us about the opportunity we crave. Hope fuels your perseverance. Even a small thread of hope means you haven't lost sight of what matters. Hope bridges meaning (there's something worth working toward) and growth (I can become what's needed).","ar":"يرتفع الأمل حين نرى فرصًا للتحرّك نحو ما نريد. والأمل واليأس شريكان: اليأس يعني أننا لا نرى طريقًا، لكنه يعلّمنا عن الفرصة التي نتوق إليها. الأمل يغذّي مثابرتك، وحتى الخيط الرفيع منه يعني أنك لم تغفل عمّا يهمّ. والأمل يصل المعنى (هناك ما يستحق العمل من أجله) بالنمو (أستطيع أن أصبح ما يتطلّبه الأمر)."},"reflection":{"en":"Even a flicker of hope is a signal. What possibility is it pointing you toward?","ar":"حتى بصيص الأمل إشارة. إلى أي إمكانية يشير؟"},"bookRef":{"en":"Emotion Rules, pp. 75, 89, 108","ar":"Emotion Rules، ص. 75، 89، 108"}}},{"id":"compassion","label":{"en":"Compassion","ar":"الرحمة"},"needs":[{"needId":"belonging","inquiry":{"en":"How can I stay present with suffering — mine or others'?","ar":"كيف أستطيع أن أكون حاضرًا مع من يتألم، بما في ذلك نفسي؟"},"strength":0.7},{"needId":"growth","inquiry":{"en":"What is this pain teaching me about what matters?","ar":"ماذا يمكن أن يعلّمني هذا الموقف؟"},"strength":0.5}],"readMore":{"essence":{"en":"An active, caring impulse to be present with pain — yours or someone else's — without turning away.","ar":"دافع فاعل إلى الرعاية والبقاء مع الألم — ألمك أو ألم غيرك — دون أن تشيح بوجهك عنه."},"signal":{"en":"Compassion is one of the doorways to emotional wisdom. It's about choosing to stay present, to be in the fire together, rooted in a genuine desire to help. That means being present without fixing or fading or solving. Compassion is anger's feeling pair partner — both fight for autonomy, freedom, and dignity, but through very different energies. Compassion is a fundamental human capacity that not only benefits those who receive it but also profoundly enriches those who practice it.","ar":"الرحمة أحد أبواب الحكمة العاطفية. إنها اختيار الحضور، أن نكون معًا في قلب المحنة، انطلاقًا من رغبة صادقة في المساعدة. وهذا يعني الحضور دون أن تسارع إلى الإصلاح أو الانسحاب أو تقديم الحلول. والرحمة شريكة الغضب — كلاهما ينافح عن الاستقلالية والحرية والكرامة، لكن بطاقتين مختلفتين جدًا. والرحمة قدرة إنسانية أساسية تنفع من يتلقّاها ومن يمارسها."},"reflection":{"en":"What would it look like to stay present with this — without needing to fix it?","ar":"كيف يكون الأمر لو بقيت حاضرًا مع هذا — دون أن تحتاج إلى إصلاحه؟"},"bookRef":{"en":"Emotion Rules, pp. 76, 239-241","ar":"Emotion Rules، ص. 76، 239-241"}}},{"id":"grief","label":{"en":"Grief","ar":"الأسى"},"needs":[{"needId":"belonging","inquiry":{"en":"What bond has been broken or transformed?","ar":"ما العلاقة أو الشيء الذي فقدته وأفتقده؟"},"strength":0.9},{"needId":"meaning","inquiry":{"en":"How do I make sense of this loss?","ar":"ما الذي كان يجعل هذا الشيء مهمًا بالنسبة لي؟"},"strength":0.7}],"readMore":{"essence":{"en":"A deep, whole-body response to profound loss — a signal that a bond you relied on has been fundamentally changed.","ar":"استجابة عميقة يعيشها الجسد كله لفقدٍ كبير — إشارة إلى أن رابطة كنت تعتمد عليها قد تغيّرت جذريًا."},"signal":{"en":"Grief is not the opposite of love; it is love, shaped by loss. In grief, what truly matters becomes so vividly present. The pain is part of the healing. The wisdom is in the struggle itself. They're interlocked. Grief psychology shows that 'meaning reconstruction' — reworking your personal narrative to incorporate the loss — is what helps people adjust, cope, and eventually thrive again.","ar":"الأسى ليس نقيض الحب؛ إنه حبّ اتّخذ شكل الفقد. وفي الأسى يصبح ما يهمّ حقًّا حاضرًا بوضوح شديد. الألم جزء من التعافي، والحكمة كامنة في المعاناة ذاتها؛ فهما متشابكان. ويُظهر علم نفس الفقد أن «إعادة بناء المعنى» — أي إعادة صياغة قصتك الشخصية لتتّسع للخسارة — هو ما يساعد الناس على التكيّف والتأقلم والازدهار من جديد."},"reflection":{"en":"What is this grief teaching you about what you most loved — and how can you honor that?","ar":"ماذا يعلّمك هذا الأسى عمّا أحببته أكثر — وكيف يمكنك أن تكرّمه؟"},"bookRef":{"en":"Emotion Rules, pp. 69, 79-80, 229-231","ar":"Emotion Rules، ص. 69، 79-80، 229-231"}}},{"id":"stress","label":{"en":"Stress","ar":"الضغط النفسي"},"needs":[{"needId":"safety","inquiry":{"en":"Are my challenges greater than my resources?","ar":"هل ما يحدث الآن أكبر من طاقتي؟ وما الدعم الذي أحتاجه؟"},"strength":0.7},{"needId":"achievement","inquiry":{"en":"What do I need to prioritize or let go of?","ar":"ما الذي يجب أن أرتبه أو أطلب المساعدة فيه؟"},"strength":0.5}],"readMore":{"essence":{"en":"A feeling of being stretched thin — a signal that what you're facing feels bigger than what you have to face it with.","ar":"شعور بأنك مُثقل فوق طاقتك — إشارة إلى أن ما تواجهه يبدو أكبر مما لديك لمواجهته."},"signal":{"en":"Stress means our perceived challenges are bigger than our perceived resources. Three key insights: stress isn't automatically bad — like other emotions, it's a signal. It's rooted in perception. And we can reduce stress by gathering more resources. Stress is also a form of energy. When we shift our mindset about stress, we can transform it from something that drains us into something that fuels resilience.","ar":"الضغط النفسي يعني أن التحدّيات التي ندركها أكبر من الموارد التي ندركها. وهنا ثلاث أفكار رئيسية: الضغط ليس سيئًا بالضرورة — فهو، كغيره من المشاعر، إشارة. وهو متجذّر في الإدراك. ويمكننا تخفيفه بجمع مزيد من الموارد. والضغط أيضًا شكل من أشكال الطاقة؛ فحين نغيّر نظرتنا إليه، يمكننا أن نحوّله من شيء يستنزفنا إلى شيء يغذّي مرونتنا."},"reflection":{"en":"What resources — internal or external — could you gather to shift this balance?","ar":"ما الموارد — الداخلية أو الخارجية — التي يمكنك جمعها لتغيير هذا الميزان؟"},"bookRef":{"en":"Emotion Rules, pp. 131-133","ar":"Emotion Rules، ص. 131-133"}}},{"id":"overwhelm","label":{"en":"Overwhelm","ar":"الشعور بالانغمار"},"needs":[{"needId":"safety","inquiry":{"en":"What is too much right now?","ar":"ما الشيء الذي يفوق قدرتي الآن؟"},"strength":0.7},{"needId":"autonomy","inquiry":{"en":"Where have I lost the ability to choose?","ar":"ما الاختيار الصغير الذي ما زال متاحًا لي؟"},"strength":0.6}],"readMore":{"essence":{"en":"A flooding sensation of too much, too fast — a signal that your system needs you to slow down and regain some control.","ar":"إحساس طاغٍ بأن الأمور كثيرة جدًا وتتسارع بشدة — إشارة إلى أن نظامك يحتاج منك أن تبطئ وتستعيد شيئًا من السيطرة."},"signal":{"en":"When overwhelm hits, your vision narrows. You might be thinking in seconds or minutes, maybe hours. Your brain enters triage mode. Overwhelm bridges safety (something is too much for my system) and autonomy (I've lost the power to choose). The first step is to reduce the input — not to solve everything, but to find one thing you can control. Even a small exercise of agency begins to restore balance.","ar":"حين يداهمك الشعور بالانغمار تضيق رؤيتك؛ فقد تفكّر بالثواني أو الدقائق، وربما الساعات، ويدخل دماغك في وضع «الفرز». والانغمار يربط الأمان (شيء ما يفوق طاقة نظامي) بالاستقلالية (فقدت القدرة على الاختيار). والخطوة الأولى هي تقليل المدخلات — لا لحلّ كل شيء، بل لإيجاد شيء واحد تستطيع التحكّم فيه. وحتى ممارسة صغيرة لإرادتك تبدأ في استعادة التوازن."},"reflection":{"en":"What one thing could you set down right now to create a little space?","ar":"ما الشيء الواحد الذي يمكنك أن تضعه جانبًا الآن لتصنع لنفسك مساحة صغيرة؟"},"bookRef":{"en":"Emotion Rules, pp. 132, 226","ar":"Emotion Rules، ص. 132، 226"}}},{"id":"contentment","label":{"en":"Contentment","ar":"الرضا"},"needs":[{"needId":"safety","inquiry":{"en":"What is settled and at peace right now?","ar":"ما الشيء الذي أشعر بالاطمئنان تجاهه الآن؟"},"strength":0.6},{"needId":"meaning","inquiry":{"en":"Am I aligned with what matters?","ar":"هل ما أفعله منسجم مع ما يهمني؟"},"strength":0.6}],"readMore":{"essence":{"en":"A quiet, settled feeling that things are enough — a signal of alignment between your life and your values.","ar":"شعور هادئ مستقر بأن ما لديك يكفي — إشارة إلى الانسجام بين حياتك وقيمك."},"signal":{"en":"Content and agitated are partners — sometimes we feel at peace, and sometimes a lack of peace pushes us toward change. Contentment is easy to overlook because it doesn't demand attention the way urgent emotions do. But it's a profound signal: something is right. It bridges safety (things are settled) and meaning (this aligns with what matters). In a culture obsessed with more, contentment asks: what if this is enough?","ar":"الرضا والانزعاج شريكان — أحيانًا نشعر بالسلام، وأحيانًا يدفعنا غيابه نحو التغيير. ومن السهل أن نغفل عن الرضا لأنه لا يطالب بالانتباه كما تفعل المشاعر المُلحّة، لكنه إشارة عميقة: ثمة أمرٌ في مكانه الصحيح. وهو يصل الأمان (الأمور مستقرة) بالمعنى (هذا ينسجم مع ما يهمّ). وفي ثقافة مهووسة بالمزيد، يسأل الرضا: ماذا لو كان هذا كافيًا؟"},"reflection":{"en":"Can you pause and fully receive this feeling — without immediately reaching for the next thing?","ar":"هل يمكنك أن تتوقّف وتتلقّى هذا الشعور كاملًا — دون أن تقفز فورًا إلى الشيء التالي؟"},"bookRef":{"en":"Emotion Rules, pp. 75, 246","ar":"Emotion Rules، ص. 75، 246"}}},{"id":"courage","label":{"en":"Courage","ar":"الشجاعة"},"needs":[{"needId":"safety","inquiry":{"en":"What am I willing to risk for what I care about?","ar":"ما الشيء الذي أخشاه لكنني مستعد لمواجهته من أجل شيء مهم؟"},"strength":0.6},{"needId":"growth","inquiry":{"en":"What becomes possible if I move through this fear?","ar":"ما الذي قد يصبح ممكنًا إذا واجهت خوفي؟"},"strength":0.7}],"readMore":{"essence":{"en":"A resolve to move forward despite uncertainty or risk — a signal that something matters enough to face the fear.","ar":"عزم على المضيّ قُدمًا رغم عدم اليقين أو الخطر — إشارة إلى أن شيئًا يهمّك بما يكفي لتواجه خوفك."},"signal":{"en":"Courage is fear's feeling pair partner. They're not opposites — they arise from the same root: caring deeply about something. Fear says 'this is at risk,' and courage says 'it's worth the risk.' Courage bridges safety and growth because it requires acknowledging the danger (safety) while choosing to step forward anyway (growth). Anxiety can transform into commitment, clarity, and courage when you find a path forward.","ar":"الشجاعة هي الشريك العاطفي للخوف. ليسا نقيضين، بل ينبعان من الجذر نفسه: الاهتمام العميق بشيء ما. الخوف يقول «هذا في خطر»، والشجاعة تقول «إنه يستحق المخاطرة». وتربط الشجاعة الأمان بالنمو لأنها تتطلّب الاعتراف بالخطر (الأمان) مع اختيار المضيّ قُدمًا رغم ذلك (النمو). ويمكن للقلق أن يتحوّل إلى التزام ووضوح وشجاعة حين تجد طريقًا إلى الأمام."},"reflection":{"en":"What fear are you willing to walk alongside in order to grow?","ar":"ما الخوف الذي أنت مستعدّ لأن ترافقه من أجل أن تنمو؟"},"bookRef":{"en":"Emotion Rules, pp. 76, 149","ar":"Emotion Rules، ص. 76، 149"}}},{"id":"disgust","label":{"en":"Disgust","ar":"الاشمئزاز"},"needs":[{"needId":"safety","inquiry":{"en":"What rules have been violated? Is this situation safe?","ar":"ما الشيء الذي أراه غير آمن أو غير مناسب؟"},"strength":0.8},{"needId":"belonging","inquiry":{"en":"Does this align with the values of my community?","ar":"هل يتفق ما يحدث مع القيم التي أؤمن بها؟"},"strength":0.4}],"readMore":{"essence":{"en":"A visceral recoil — a signal that something has crossed a boundary of what feels acceptable or safe.","ar":"نفور غريزي — إشارة إلى أن شيئًا ما تجاوز حدود المقبول أو الآمن."},"signal":{"en":"Disgust evolved to protect us from contamination, but it extends far beyond the physical. Trust and disgust are partners: trust tells us the rules are in place and the situation is safe; disgust tells us rules are violated or the situation is not safe. Disgust also has a moral dimension — researchers call it 'moral disgust' because it responds to ethical violations. Its survival function is to avoid toxicity, whether physical, social, or moral.","ar":"نشأ الاشمئزاز ليحمينا من التلوّث، لكنه يمتدّ إلى ما هو أبعد من الماديّ. والثقة والاشمئزاز شريكان: الثقة تخبرنا أن القواعد قائمة وأن الموقف آمن، والاشمئزاز يخبرنا أن القواعد انتُهكت أو أن الموقف غير آمن. وللاشمئزاز بُعد أخلاقي أيضًا — يسمّيه الباحثون «الاشمئزاز الأخلاقي» لأنه يستجيب للانتهاكات الأخلاقية. ووظيفته في البقاء هي تجنّب كل ما هو سامّ، جسديًا كان أو اجتماعيًا أو أخلاقيًا."},"reflection":{"en":"What boundary has been crossed here — and what does that tell you about your values?","ar":"ما الحدود التي تم تجاوزها هنا — وماذا يخبرك ذلك عن قيمك؟"},"bookRef":{"en":"Emotion Rules, pp. 51, 75, 76","ar":"Emotion Rules، ص. 51، 75، 76"}}},{"id":"exhaustion","label":{"en":"Exhaustion","ar":"الإنهاك"},"needs":[{"needId":"achievement","inquiry":{"en":"Have I been pushing too hard without return?","ar":"هل أضغط على نفسي أكثر مما أستطيع؟"},"strength":0.7},{"needId":"meaning","inquiry":{"en":"Has the purpose behind my effort disappeared?","ar":"هل ما أفعله ما زال ذا معنى بالنسبة لي؟"},"strength":0.6},{"needId":"belonging","inquiry":{"en":"Am I trying to do this alone?","ar":"هل أحتاج إلى طلب الدعم بدل القيام بكل شيء وحدي؟"},"strength":0.4}],"readMore":{"essence":{"en":"A deep depletion of energy — a signal that you've been giving more than you're receiving, and something fundamental is off balance.","ar":"استنزاف عميق للطاقة — إشارة إلى أنك تعطي أكثر مما تتلقّى، وأن شيئًا أساسيًا فقد توازنه."},"signal":{"en":"Exhaustion isn't just about working too hard. The real drivers are emotional: burnout happens when your effort feels futile, when you don't feel seen, supported, or successful. It's not about how many hours you worked — it's about how many hours felt like they didn't matter. Exhaustion bridges achievement (pushing without return), meaning (the purpose has vanished), and belonging (doing it alone). The opposite of burnout isn't rest — it's sustainable motivation aligned with your values.","ar":"الإنهاك لا يتعلّق بالعمل الشاق وحده؛ فدوافعه الحقيقية عاطفية. يحدث الاحتراق حين يبدو جهدك بلا جدوى، وحين لا تشعر بأنك مرئيّ أو مدعوم أو ناجح. فالمسألة ليست عدد الساعات التي عملتها، بل عدد الساعات التي شعرت أنها بلا قيمة. والإنهاك يربط الإنجاز (الجهد بلا مردود) بالمعنى (غياب الغاية) وبالانتماء (العمل وحيدًا). وعكس الاحتراق ليس الراحة، بل الدافع المستدام المنسجم مع قيمك."},"reflection":{"en":"Which need is most depleted right now — meaning, recognition, connection, or control?","ar":"ما الحاجة الأكثر استنزافًا لديك الآن — المعنى، أم التقدير، أم التواصل، أم السيطرة؟"},"bookRef":{"en":"Emotion Rules, pp. 75, 133-135","ar":"Emotion Rules، ص. 75، 133-135"}}}]}</script>
  <script>
    /* نسخة عربية مُراجَعة: كل البيانات مضمّنة داخل الملف، والصفحة تعمل دون اتصال بأي خادم خارجي */
    (function(){
      /* العربية هي اللغة الافتراضية، مع حفظ اختيار المستخدم إن غيّرها */
      /* لغة الموقع تصل عبر ?lang=ar أو ?lang=en، وإلا فالعربية افتراضيًا مع حفظ اختيار المستخدم */
      try {
        var q = new URLSearchParams(location.search).get('lang');
        if (q === 'ar' || q === 'en') localStorage.setItem('constellation_locale', q);
        else if (!localStorage.getItem('constellation_locale')) localStorage.setItem('constellation_locale','ar');
      } catch(e) {}

      var embedded = {
        'emotion-constellation-more-info-data.json': function(){ return document.getElementById('data-more-info').textContent; }
      };
      function mapFor(loc){
        var el = document.getElementById('data-map-' + loc) || document.getElementById('data-map-ar');
        return el.textContent;
      }

      /* ===== مُجيب محلي بدل خادم المحادثة الخارجي (لا يُرسَل أي شيء عبر الإنترنت) ===== */
      var CANNED = {
        ar: {
          'ما كوكبة المشاعر؟': 'كوكبة المشاعر خريطة تفاعلية تعرض ست حاجات أساسية لدى كل إنسان: الأمان، والانتماء، والاستقلالية، والإنجاز، والمعنى، والنمو.\n\nحول هذه الحاجات تدور النجوم الصغيرة، وكل نجمة شعور. عندما تضغط على شعور، ترى الحاجات التي يرتبط بها، والمشاعر الأخرى التي قد تظهر معه، وأسئلة تساعدك على فهمه.\n\nالفكرة الأساسية: لا توجد مشاعر سلبية؛ كل شعور رسالة من داخلك تخبرك بشيء مهم.',
          'كيف أستكشف مشاعري؟': 'جرّب هذه الخطوات:\n\n١. لاحظ: ما الشعور الذي أشعر به الآن؟ ابحث عنه في الخريطة واضغط عليه.\n٢. اقرأ: انظر إلى الحاجات المضيئة، واقرأ الأسئلة التي تظهر بجانب الخطوط.\n٣. توسّع: انظر إلى المشاعر التي قد تجتمع معه في أسفل الشاشة، واسأل نفسك: هل أشعر بأحدها أيضًا؟\n٤. تأمّل: اضغط على النجمة ✦ بجانب الشعور لتقرأ رسالته.',
          'ماذا أستطيع أن أختار؟': 'المشاعر لا تأمرنا بما نفعل، بل تعطينا معلومات. بعد أن تفهم رسالة شعورك، اسأل نفسك:\n\n• ما الذي أحتاجه الآن؟\n• ما الخيارات المتاحة أمامي؟\n• أي خيار يساعدني ويحترم الآخرين؟\n\nمثال: إذا شعرت بالغضب لأن شيئًا يقف في طريقك، يمكنك أن تختار أن تأخذ نفسًا عميقًا، ثم تتحدث بهدوء، أو تطلب المساعدة من شخص تثق به.',
          'كيف أستخدم كوكبة المشاعر؟': 'اضغط على أي شعور في الخريطة. ستضيء الحاجات المرتبطة به، وتظهر أسئلة تساعدك على التفكير. في أسفل الشاشة ستجد مشاعر قد تجتمع معه، ويمكنك الضغط عليها للانتقال إليها.\n\nاضغط على النجمة ✦ بجانب الشعور لقراءة رسالته، واضغط على اسم أي حاجة لترى كل المشاعر المرتبطة بها.',
          'هل يمكن أن أشعر بأكثر من شعور في الوقت نفسه؟': 'نعم، وهذا طبيعي جدًا. قد تشعر بالحماس والقلق معًا قبل الاختبار، أو بالفرح والحزن معًا عند وداع صديق ينتقل إلى مدرسة أخرى.\n\nفي الخريطة، المشاعر التي تظهر في أسفل الشاشة هي مشاعر قد تجتمع مع الشعور الذي اخترته لأنها ترتبط بالحاجات نفسها. ملاحظة أكثر من شعور تساعدك على فهم الموقف بشكل أوضح.',
          'كيف أنتقل من الشعور إلى الاختيار؟': 'تذكّر ثلاث خطوات:\n\n١. اعرف نفسك: ماذا أشعر؟ وماذا أشعر أيضًا؟\n٢. اختر نفسك: ماذا قد تخبرني مشاعري؟ وما الخيارات المتاحة؟\n٣. امنح نفسك: أي خيار يساعدني ويساعد من حولي؟\n\nبين الشعور والتصرف مساحة صغيرة؛ نستطيع أن نستخدمها لنختار بوعي.'
        },
        en: {
          'Give me an intro to this tool': 'The Emotion Constellation is an interactive map of six basic human needs: Safety, Belonging, Autonomy, Achievement, Meaning, and Growth.\n\nAround these needs are stars, and each star is a feeling. Tap a feeling to see which needs it connects to, which other feelings often come with it, and questions that help you understand it.\n\nThe core idea: there are no negative feelings — each one is a message from us, for us.',
          'What are emotions?': 'Emotions are signals from your brain and body. They help you notice what matters, get ready to act, and connect with others.\n\nEach feeling carries information. Fear can point to something you want to protect; frustration can point to something blocking your way; gratitude can point to something you value.',
          'How can emotions help me?': 'Emotions don’t tell you what to do — they give you information. Once you understand the message, ask yourself:\n\n• What do I need right now?\n• What options do I have?\n• Which choice helps me and respects others?',
          'How does this map help me?': 'Tap any feeling on the map. The needs it connects to light up, and questions appear to help you reflect. At the bottom you’ll see feelings that often come with it — tap one to move there.\n\nTap the ✦ star next to a feeling to read its message, or tap a need to see all the feelings linked to it.',
          'What do you mean by ‘there are no negative feelings’?': 'Some feelings are uncomfortable, but that doesn’t make them bad. Each feeling is a signal about something that matters to you. Fear helps protect what you care about; sadness shows what you value; anger shows that something important is being blocked.\n\nWhen we listen to the message instead of pushing the feeling away, we can choose a wiser response.',
          'What is Emotion Rules all about?': 'Emotion Rules, by Joshua Freedman, explores how feelings work and how we can use them wisely. One of its key ideas is that every emotion is a message that helps us with our basic needs — and this map is a way to explore that idea.'
        }
      };
      var T = {
        ar: {
          ask: 'اسأل نفسك:',
          needIntro: function(l){ return 'قد يرتبط شعور ' + l + ' بهذه الحاجات:'; },
          needOutro: 'أي هذه الأسئلة أقرب إلى موقفك الآن؟',
          relate: function(a,b,n){ return a + ' و' + b + ' يلتقيان عند حاجة مشتركة: ' + n + '. عندما يظهران معًا، قد يكون هذا الجانب مهمًّا لك الآن.'; },
          relateNone: function(a,b){ return 'قد يظهر ' + a + ' و' + b + ' في الموقف نفسه. لاحظ ما يخبرك به كل منهما، وما الحاجة المهمة التي يشيران إليها.'; },
          and: ' و',
          generic: 'جرّب الضغط على أحد الأسئلة المقترحة، أو اختر شعورًا من الخريطة لتستكشفه.'
        },
        en: {
          ask: 'Ask yourself:',
          needIntro: function(l){ return l + ' may connect to these needs:'; },
          needOutro: 'Which of these questions fits your situation right now?',
          relate: function(a,b,n){ return a + ' and ' + b + ' both connect to: ' + n + '. When they show up together, this part of your life may matter a lot right now.'; },
          relateNone: function(a,b){ return a + ' and ' + b + ' can show up in the same moment. Notice what each one is telling you, and which need they point to.'; },
          and: ' and ',
          generic: 'Try one of the suggested questions, or tap a feeling on the map to explore it.'
        }
      };

      function localAnswer(body){
        var loc = body.locale === 'en' ? 'en' : 'ar', t = T[loc];
        var msgs = body.messages || [], last = '';
        for (var i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === 'user') { last = String(msgs[i].content || '').trim(); break; }
        var c = body.emotionContext || {};
        if (c.isWelcome || !c.label) return CANNED[loc][last] || CANNED.ar[last] || CANNED.en[last] || t.generic;

        var inq = c.inquiries || [], per = c.fellowMessengersPerNeed || {}, low = last.toLowerCase();
        /* سؤال العلاقة بين شعورين */
        var fellow = null, shared = [];
        for (var nid in per) {
          (per[nid] || []).forEach(function(f){
            if (low.indexOf(String(f).toLowerCase()) !== -1) {
              if (!fellow) fellow = f;
              if (String(f) === String(fellow) && shared.indexOf(nid) === -1) shared.push(nid);
            }
          });
        }
        if (fellow) {
          var names = [], qs = [];
          inq.forEach(function(q){ if (shared.indexOf(q.needId) !== -1) { names.push(q.needLabel || q.needId); qs.push(q.inquiry); } });
          var out = names.length ? t.relate(c.label, fellow, names.join(t.and)) : t.relateNone(c.label, fellow);
          if (qs.length) out += '\n\n' + t.ask + '\n' + qs.map(function(q){ return '• ' + q; }).join('\n');
          return out;
        }
        /* سؤال الحاجات */
        if (/حاج|need|الشيء المهم/i.test(last)) {
          return t.needIntro(c.label) + '\n\n' + inq.map(function(q){ return '• ' + (q.needLabel || q.needId) + ': ' + q.inquiry; }).join('\n') + '\n\n' + t.needOutro;
        }
        /* ماذا يخبرني هذا الشعور؟ */
        var parts = [];
        if (c.wisdomEssence) parts.push(c.wisdomEssence);
        if (c.wisdomSignal) parts.push(c.wisdomSignal);
        if (inq.length) parts.push(t.ask + '\n' + inq.map(function(q){ return '• ' + q.inquiry; }).join('\n'));
        return parts.join('\n\n') || t.generic;
      }

      function streamResponse(text){
        var enc = new TextEncoder(), words = text.split(/(\s+)/), i = 0;
        var stream = new ReadableStream({
          pull: function(ctrl){
            return new Promise(function(res){
              setTimeout(function(){
                if (i >= words.length) { ctrl.enqueue(enc.encode('data: [DONE]\n')); ctrl.close(); return res(); }
                var chunk = words.slice(i, i + 3).join(''); i += 3;
                ctrl.enqueue(enc.encode('data: ' + JSON.stringify({ content: chunk }) + '\n'));
                res();
              }, 35);
            });
          }
        });
        return new Response(stream, { status: 200, headers: { 'Content-Type': 'text/event-stream' } });
      }

      var origFetch = window.fetch.bind(window);
      window.fetch = function(input, init){
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (/cloudfunctions\.net\/constellationChat/.test(url)) {
          var body = {};
          try { body = JSON.parse((init && init.body) || '{}'); } catch(e) {}
          return Promise.resolve(streamResponse(localAnswer(body)));
        }
        if (/cloudfunctions\.net\//.test(url)) {
          return Promise.resolve(new Response('{"error":"offline"}', { status: 503, headers: { 'Content-Type': 'application/json' } }));
        }
        for (var k in embedded) {
          if (url.indexOf(k) !== -1) {
            return Promise.resolve(new Response(embedded[k](), { status: 200, headers: { 'Content-Type': 'application/json' } }));
          }
        }
        var m = url.match(/\/constellation\/data\/constellation-([a-z]{2})\.json/);
        if (m) {
          return Promise.resolve(new Response(mapFor(m[1]), { status: 200, headers: { 'Content-Type': 'application/json' } }));
        }
        return origFetch(input, init);
      };
    })();
  </script>
